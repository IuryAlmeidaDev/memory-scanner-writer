<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Tipo Impedimento</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarTipoImpedimento" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarTipoImpedimento')}" />
		</h:form>		
			
		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta"/>

				<sgp:formInputText id="pesquisar" labelValue="Nome" maxlength="80" value="#{tipoImpedimentoBean.filtro.descricao}" styleFormLabelColumn="min-width:50px !important"/>
				
				<sgp:formSelectOneMenu
					styleFormLabelColumn="min-width:50px !important"
					id="status" labelValue="Situação"
					value="#{tipoImpedimentoBean.filtro.status}"
					itemsValue="#{comboHelperBean.statusSgp}"
					itemValue="#{item}"
					itemLabel="#{item.descricao}" 
					temSelecione="true"/>
				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search" />
				<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{tipoImpedimentoBean.imprimir()}"/>
			</p:panel>
		</h:form>	

		<h:form id="registrosForm">
				<p:dataTable id="dataTable" var="tipoImpedimento" value="#{tipoImpedimentoBean.lazyDataModel}" rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{tipoImpedimento.id}"
                             emptyMessage="Nenhum registro encontrado.">
					<p:column headerText="Código" width="100" sortBy="#{tipoImpedimento.id}">
						<h:outputText value="#{tipoImpedimento.id}" />
					</p:column>

					<p:column headerText="Descrição" sortBy="#{tipoImpedimento.descricao}">
						<h:outputText value="#{tipoImpedimento.descricao}" />
					</p:column>

					<p:column headerText="Situação" width="120" sortBy="#{tipoImpedimento.status}">
						<h:outputText value="#{tipoImpedimento.status.descricao}" />
					</p:column>

					<p:column headerText="Ações" width="120" >
						<center>
							<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarTipoImpedimento" rendered="#{securityUtil.possuiPermissao('VisualizarTipoImpedimento')}">
								<f:param name="id" value="#{tipoImpedimento.id}" />
							</p:button>
							<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:AlterarTipoImpedimento" rendered="#{securityUtil.possuiPermissao('AlterarTipoImpedimento')}">
								<f:param name="id" value="#{tipoImpedimento.id}" />
							</p:button>
							<p:commandButton action="#{tipoImpedimentoBean.excluir(tipoImpedimento)}"	icon="ui-icon-trash" title="Excluir" update="@form :registrosForm :mensagens" rendered="#{securityUtil.possuiPermissao('ExcluirTipoImpedimento')}">
								 <p:confirm header="Confirmação" message="Deseja excluir o tipo de impedimento?" icon="ui-icon-alert" />
							</p:commandButton>
						</center>
					</p:column>
					<f:facet name="footer">
						Total de registros: #{tipoImpedimentoBean.lazyDataModel.rowCount}
					</f:facet>
				</p:dataTable>

				<p:confirmDialog global="true">
					<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
