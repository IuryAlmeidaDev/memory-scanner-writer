<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Quadro de Vagas</h3>

		<!-- 
		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarQuadroVagas" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarUnidade')}"/>
		</h:form>
		 -->

		<h:form id="meuFormulario" >
			<p:panel rendered="#{securityUtil.possuiPermissao('ListarTodasUnidades')}">
				<p:outputLabel value="Consulta"/>
				
				<sgp:formInputText 
					labelValue="Unidade" 
					size="50"
					value="#{quadroVagasBean.filtro.nome}" />
					
				<sgp:formInputText labelValue="Sigla"
					value="#{quadroVagasBean.filtro.sigla}" />
					
				<sgp:formSelectOneMenu
					id="tipoUnidade"
					itemValue="#{item}"
					itemsValue="#{comboHelperBean.tipoUnidades}"
					labelValue="Tipo Instituição"
					itemLabel="#{item.descricao}"
					value="#{quadroVagasBean.filtro.tipoUnidade}"
					converter="SimpleEntityConverter"
					temSelecione="true"/>
					
				<sgp:formSelectOneMenu 
					id="situacaoUnidade"
					labelValue="Situação" 
					itemValue="#{item}"
					itemLabel="#{item.descricao}"
					itemsValue="#{comboHelperBean.situacaoUnidadeTodas}" 
					temSelecione="true" 
					value="#{quadroVagasBean.filtro.situacaoUnidade}"/>

				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search" />
				<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{quadroVagasBean.imprimir()}"/>
			</p:panel>
		</h:form>

		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="unidade" value="#{quadroVagasBean.unidades}" emptyMessage="Nenhum registro encontrado."
				rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{unidade.id}">
				<p:column headerText="Codigo" sortBy="#{unidade.id}" width="120">
					<h:outputText value="#{unidade.id}" />
				</p:column>
				<p:column headerText="Sigla" sortBy="#{unidade.nomeUnidade}">
					<h:outputText value="#{unidade.nomeUnidade}" />
				</p:column>
				<p:column headerText="Sigla" sortBy="#{unidade.sigla}" width="80">
					<h:outputText value="#{unidade.sigla}" />
				</p:column>
				<p:column headerText="Capacidade" sortBy="#{unidade.capacidadeTotal}">
					<h:outputText value="#{unidade.capacidadeTotal}" />
				</p:column>
				<p:column headerText="Condenados" sortBy="#{unidade.quantidadeCondenado}">
					<h:outputText value="#{unidade.quantidadeCondenado}" />
				</p:column>
				<p:column headerText="Provisórios" sortBy="#{unidade.quantidadeProvisorios}">
					<h:outputText value="#{unidade.quantidadeProvisorios}" />
				</p:column>
				<p:column headerText="Recuperandos" sortBy="#{unidade.totalRecuperando}">
					<h:outputText value="#{unidade.totalRecuperando}" />
				</p:column>
				<p:column headerText="Deficit" style="width:100px;" sortBy="#{unidade.deficit}">
					<h:outputText value="#{unidade.deficit}" />
				</p:column>
				<p:column headerText="Vagas" sortBy="#{unidade.vagas}">
					<h:outputText value="#{unidade.vagas}" />
				</p:column>
				
				<!-- 
				<p:column headerText="Ações" style="width:150px;">
					<center>
						<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarUnidade" rendered="#{securityUtil.possuiPermissao('VisualizarUnidade')}">
							<f:param name="id" value="#{unidade.id}" />
						</p:button>
						<p:button title="Editar" icon="ui-icon-pencil" outcome="pretty:AlterarUnidade" rendered="#{securityUtil.possuiPermissao('AlterarUnidade')}">
							<f:param name="id" value="#{unidade.id}" />
						</p:button>
						<p:commandButton title="Histórico de Situações" icon="ui-icon-clock" action="#{estruturaBean.listarPorUnidade(unidade)}"
							 oncomplete="PF('listarSituacaoEstruturaUnidade').show()" update=":listarSituacoes" process="@this"/>
						<p:commandButton title="Imprimir Lista de Chamada" icon="fa fa-print" oncomplete="PF('dlgListaDeChamada').show()"
							 update=":formListaChamadas" actionListener="#{quadroVagasBean.selecionarEstruturaChamada(unidade)}"/>
					</center>
				</p:column>
				-->
				
				<f:facet name="footer">
					Total de registros: #{quadroVagasBean.unidades.rowCount}
				</f:facet>
			</p:dataTable>
		</h:form>
		
	</ui:define>
</ui:composition>
