<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="/WEB-INF/pages/_templates/principal.xhtml">  

	<ui:define name="head">
		<ui:include src="/WEB-INF/pages/_script/biometria.xhtml" />
	</ui:define>

	<ui:define name="footer">
		<h:outputStylesheet library="css" name="corpohumano.css" />
		<h:outputScript library="js" name="biometriav2.js?ver=#{utilBean.biometriaVersao}" />
			<script type="text/javascript">
				var timeout;
				clearInterval(timeout);
				timeout = setInterval(refresh, 600000);
			</script>
	</ui:define>
		
	<ui:define name="conteudo">
		<sgp:validarAcesso />
	
		<h:form prependId="false">
			<p:remoteCommand name="refresh" actionListener="#{utilBean.refresh}" />
			<p:remoteCommand autoRun="true" oncomplete="#{recuperandoBean.executarPreCadastroPessoaRemoteCommand()}"/>
			<p:commandButton id="cb" actionListener="#{recuperandoBean.abrirDialogPreCadastroPessoa}" style="display:none">
				<p:ajax event="dialogReturn" listener="#{recuperandoBean.associarPreCadastroPessoa}" update=":tabView:formConteudo :tabView:formConteudoRec :tabView:groupBotaoSalvarRec :tabView:formFoto :tabView:infoPeric"/>
			</p:commandButton>
		</h:form>
		
		<pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.RegiaoParticularidade" var="Regiao" allSuffix="ALL_ENUM_VALUES" />
		<pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.OrientacaoParticularidade" var="Orientacao" allSuffix="ALL_ENUM_VALUES" />
		<pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.BiometriaTipoDedo" var="TipoDedo" allSuffix="ALL_ENUM_VALUES" />
		
		<h3>#{recuperandoBean.tituloPagina} Recuperando</h3>
		<p:panel id="cabecalho" rendered="#{recuperandoBean.recuperando.id>0}" style="border:#{recuperandoBean.corPericulosidade}; border-width:4px; border-style:solid;" 
			footer="#{recuperandoBean.recuperandoAuditoriaRodape()}">
			<h:form id="formCabecalho">
				<div class="row">
					<div class="col-md-3">
						<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.fotoFrenteAtual}" emptyMessage="Sem foto de frente." var="f">
							<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}" cache="false" width="180" height="240">
								<f:param name="hashId" value="#{f.imagem.id}" />
							</p:graphicImage>
						</p:dataGrid>
					</div>
					<div class="col-md-4">
						<sgp:formOutputLabel labelValue="Matrícula" value="#{recuperandoBean.recuperando.id}"/>
						<sgp:formOutputLabel labelValue="Nome" value="#{recuperandoBean.recuperando.pessoa.nome}"/>
						<sgp:formOutputLabel labelValue="Nome da Mãe" value="#{recuperandoBean.recuperando.pessoa.nomeMae}"/>
						<sgp:formOutputLabel labelValue="Dt. Nascimento" value="#{recuperandoBean.recuperando.pessoa.dataNascimento}" converterData="true"/>
						<sgp:formOutputLabel labelValue="Perículosidade" value="#{recuperandoBean.recuperando.periculosidade}" />
						<sgp:formOutputLabel labelValue="Regime Atual" value="#{recuperandoBean.recuperando.regimeAtual.descricao}" />
						<sgp:formOutputLabel labelValue="Condição Atual" value="#{recuperandoBean.recuperando.condicaoAtual}" />
					</div>
					<div class="col-md-4">
						<sgp:formOutputLabel labelValue="Movimentação Interna?" value="#{recuperandoBean.movimentacaoInterna}"/>
						<sgp:formOutputLabel labelValue="Movimentação Externa?" value="#{recuperandoBean.movimentacaoExterna}"/>
						<sgp:formOutputLabel labelValue="Em Transferência?" value="#{recuperandoBean.emTransferencia}"/>
					</div>
				</div>
			</h:form>
		</p:panel>
		
		
		<p:tabView id="tabView" cache="true" dynamic="true" effect="fade" effectDuration="fast">
			<p:tab id="tabRecuperando" title="Recuperando">
				<div class="row">
					<div class="col-md-6">
						<h:form id="formConteudo">
							<h:panelGroup id="infos1">
								<h4>
								 <sgp:formOutputLabel labelValue="Matrícula" value="#{recuperandoBean.recuperando.id > 0 ? recuperandoBean.recuperando.id : null}"/>
								</h4>
								<sgp:formOutputLabel labelValue="Nome" value="#{recuperandoBean.recuperando.pessoa.nome}" rowStyle="float:left"/>
								<p:commandButton icon="ui-icon-pencil" immediate="true" actionListener="#{recuperandoBean.abrirDialogPreCadastroPessoa}" 
									rendered="#{securityUtil.possuiPermissao('AlterarPessoaRecuperando') and !recuperandoBean.isVisualizacao}">
									<p:ajax event="dialogReturn" listener="#{recuperandoBean.associarPreCadastroPessoa}" update=":tabView:groupBotaoSalvarRec :tabView:formConteudo :tabView:formSocial"/>
								</p:commandButton>
								
								<p:commandButton icon="ui-icon-document" immediate="true" actionListener="#{recuperandoBean.abrirDialogPreCadastroPessoa}" 
									rendered="#{securityUtil.possuiPermissao('VisualizarPessoaRecuperando') and recuperandoBean.isVisualizacao}">
									<p:ajax event="dialogReturn" listener="#{recuperandoBean.associarPreCadastroPessoa}" update=":tabView:groupBotaoSalvarRec :tabView:formConteudo :tabView:formSocial"/>
								</p:commandButton>
								<sgp:formOutputLabel labelValue="Nome da Mãe" value="#{recuperandoBean.recuperando.pessoa.nomeMae}" />
								<sgp:formOutputLabel labelValue="Dt. Nascimento" value="#{recuperandoBean.recuperando.pessoa.dataNascimento}" converterData="true"/>
								<sgp:formOutputLabel labelValue="Sexo" value="#{recuperandoBean.recuperando.pessoa.sexo.descricao}" />
								<sgp:formOutputLabel labelValue="Nacionalidade" value="#{recuperandoBean.recuperando.pessoa.nacionalidade.descricao}" />
								<sgp:formOutputLabel labelValue="Naturalidade" value="#{recuperandoBean.recuperando.naturalidade}" />
							</h:panelGroup>
						</h:form>
						<h:form id="formConteudoRec" prependId="false">
							<h:panelGroup id="groupConteudoRec">
								<sgp:formSelectOneMenu id="sinais" labelValue="Sinal/Tatuagem" value="#{recuperandoBean.recuperando.temSinalOuTatuagem}" display="text" 
									validationRequired="true" temSelecione="true" disabled="#{recuperandoBean.isVisualizacao}" >
									<f:selectItem itemLabel="Sim" itemValue="true" />
									<f:selectItem itemLabel="Não" itemValue="false" />
								</sgp:formSelectOneMenu>
								
								<sgp:formInputMask id="altura" labelValue="Altura" value="#{recuperandoBean.recuperando.altura}" size="4" mask="9?.99" maxlength="5" display="text"
									validationRequired="true" disabled="#{recuperandoBean.isVisualizacao}"/>
								
								<sgp:formInputNumber id="peso" labelValue="Peso" value="#{recuperandoBean.recuperando.peso}" size="6" maxlength="6" display="text"
									 disabled="#{recuperandoBean.isVisualizacao}"/>
		
								<sgp:formSelectOneMenu display="text" requiredMessage="*" id="tipoSanguineo" labelValue="Tipo Sanguineo" itemValue="#{item}" temSelecione="true"
									value="#{recuperandoBean.recuperando.tipoSanguineo}" itemsValue="#{comboHelperBean.tipoSanguineo}" itemLabel="#{item.descricao}"
									disabled="#{recuperandoBean.isVisualizacao}" converter="SimpleEntityConverter" />				
				
								<sgp:formSelectOneMenu display="text" requiredMessage="*" id="Raca" labelValue="Raça" temSelecione="true" itemValue="#{item}"
									value="#{recuperandoBean.recuperando.raca}" itemsValue="#{comboHelperBean.racas}" itemLabel="#{item.descricao}"
									disabled="#{recuperandoBean.isVisualizacao}" converter="SimpleEntityConverter" />
									
								<sgp:formSelectOneMenu display="text" requiredMessage="*" id="corOlho" labelValue="Cor dos Olhos" itemValue="#{item}" temSelecione="true"
									value="#{recuperandoBean.recuperando.corOlho}" itemsValue="#{comboHelperBean.corOlho}" itemLabel="#{item.descricao}"
									disabled="#{recuperandoBean.isVisualizacao}" />
									
								<sgp:formSelectOneMenu display="text" requiredMessage="*" id="corCabelho" labelValue="Cor dos Cabelos" itemValue="#{item}" temSelecione="true"
									value="#{recuperandoBean.recuperando.corCabelo}" itemsValue="#{comboHelperBean.corCabelo}" itemLabel="#{item.descricao}"
									disabled="#{recuperandoBean.isVisualizacao}" />
									
								<sgp:formCheckbox labelValue="Monitorado Eletronicamente" value="#{recuperandoBean.recuperando.monitoramentoEletronico}" disabled="#{recuperandoBean.isVisualizacao}"/>
							</h:panelGroup>
							
							<h:panelGroup id="groupBotaoSalvarRec">
								<br/><br/><br/>
								<p:commandButton value="Salvar" update=":formCabecalho :mensagens :tabView:formConteudo :tabView:formConteudoRec :tabView:formFoto :tabView:infoPeric :tabView:biometriaCapturada :tabView:formBio :tabView:formPassagem :tabView:formInfos :tabView:formAbaFotos :tabView:formAbaFotosImg :tabView:formAbaFotosHistorico :tabView:formInfoParticularidade :tabView:formCorpo :tabView:formParticularidades :tabView:formSocial :tabView:formParente" action="#{recuperandoBean.salvar()}" 
									disabled="#{(empty recuperandoBean.recuperando.pessoa.nome)}"
									icon="ui-icon-disk" rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando') ) and !recuperandoBean.isVisualizacao}" />
		
								<p:button outcome="pretty:ListarRecuperando" value="Voltar" disabled="#{(empty recuperandoBean.recuperando.pessoa.nome)}" icon="ui-icon-arrowreturnthick-1-w">
									<f:param name="list" value="1"/>
								</p:button>
							</h:panelGroup>
						</h:form>
					</div>
					
					<div class="col-md-6">
						<h:form id="formFoto">
							<p:commandButton icon="fa fa-camera" value="Adicionar Foto" immediate="true" actionListener="#{recuperandoBean.abrirDialogFoto}" disabled="#{(empty recuperandoBean.recuperando.pessoa.nome)}"
								rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando') ) and !recuperandoBean.isVisualizacao}">
								<p:ajax event="dialogReturn" listener="#{recuperandoBean.associarFoto}" update=":tabView:formFoto" />
							</p:commandButton>
							
							<br/><br/>
							<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.fotoFrenteAtual}" emptyMessage="Sem foto de frente." var="f">
								<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}" cache="false" width="180" height="240">
									<f:param name="hashId" value="#{f.imagem.id}" />
								</p:graphicImage>
							</p:dataGrid>
						</h:form>
						
						<h:panelGroup id="infoPeric" rendered="#{securityUtil.possuiPermissao('AlterarPericulosidade')}">
							<sgp:formOutputLabel labelValue="Perículosidade" value="#{recuperandoBean.recuperando.periculosidade}" rowStyle="float:left"/>
							<p:commandButton title="Alterar Perículosidade" icon="ui-icon-pencil" disabled="#{(empty recuperandoBean.recuperando.pessoa.nome)}" oncomplete="PF('altPericulosidade').show()"  update=":formPeric" process="@this" rendered="#{securityUtil.possuiPermissao('AlterarPericulosidade') and !recuperandoBean.isVisualizacao}"/>									
							<sgp:formOutputLabel labelValue="Observação" value="#{recuperandoBean.recuperando.observacao}" />
						</h:panelGroup>
						
						<h:panelGroup id="digital">
							<p:commandButton value="Registrar Biometria" id="btnBio" onclick="enviaComandoWs('registrar');" icon="ui-icon-bio" rendered="#{(((securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and recuperandoBean.verificarSeBiometriaEhObrigatoria()))}" />
							
							<h:form prependId="false" id="formGamb">
								<h:inputHidden value="#{recuperandoBean.temBiometria}" id="temBiometria" />
								<h:inputHidden value="#{recuperandoBean.recuperando.id}" id="idRecuperando"/>
							</h:form>
						</h:panelGroup>
						
						<div id="divRegistroBiometrico" style="display: inline;">
							<h:form prependId="false" id="formBio">
								<p:remoteCommand name="executarBiometria" actionListener="#{recuperandoBean.registrarBiometria}" update=":tabView:biometriaCapturada" />
								<h:inputHidden value="#{recuperandoBean.biometria}" id="paramBiometria" />
							</h:form>
						</div>
						
						<h:panelGroup id="biometriaCapturada">
							<p:panelGrid rendered="#{recuperandoBean.recuperando.pessoa.biometria.dedos.size() gt 0 or recuperandoBean.recuperando.pessoa.biometria.id gt 0}" style="border-width:1px; border-style:solid; margin-bottom: 15px">
							    <f:facet name="header">
							        <p:row>
							            <p:column colspan="3">Biometria capturada em <h:outputText value="#{recuperandoBean.recuperando.pessoa.biometria.dataCaptura}" >
	    									<f:convertDateTime pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>
							        </p:row>
							        <p:row>
							       		<p:column colspan="1"></p:column>
							            <p:column colspan="1">Esquerda</p:column>
							      	 	<p:column colspan="1">Direita</p:column>
							         </p:row>
							    </f:facet>
							    <p:row>
							        <p:column style="font-weight: bold;">Polegar</p:column>
							        <p:column style="text-align: center" rowspan="1">
							        	<p:graphicImage id="bioPE" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioPE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_ESQUERDO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							        <p:column style="text-align: center">
							        	<p:graphicImage id="bioPD" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioPD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_DIREITO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							     </p:row>
							     
							      <p:row>
							        <p:column style="font-weight: bold;">Indicador</p:column>
							        <p:column style="text-align: center" rowspan="1">
							        	<p:graphicImage id="bioIE" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioIE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_ESQUERDO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.INDICADOR_ESQUERDO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							        <p:column style="text-align: center">
							        	<p:graphicImage id="bioID" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
    								     <p:overlayPanel for="bioID" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_DIREITO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.INDICADOR_DIREITO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							     </p:row>
							        
							      <p:row>
							        <p:column style="font-weight: bold;">Médio</p:column>
							        <p:column style="text-align: center" rowspan="1">
							        	<p:graphicImage id="bioME" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
     						        	<p:overlayPanel for="bioME" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_ESQUERDO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MEDIO_ESQUERDO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							        <p:column style="text-align: center">
							        	<p:graphicImage id="bioMD" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioMD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_DIREITO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MEDIO_DIREITO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							     </p:row>
							   
							   	 <p:row>
							        <p:column style="font-weight: bold;">Anelar</p:column>
							        <p:column style="text-align: center" rowspan="1">
							        	<p:graphicImage id="bioAE" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioAE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_ESQUERDO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.ANELAR_ESQUERDO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							        <p:column style="text-align: center">
							        	<p:graphicImage id="bioAD" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
							        	<p:overlayPanel for="bioAD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO))}">
								        	<p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{recuperandoBean.recuperando.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.ANELAR_DIREITO)}" var="f">
												<p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
													<f:param name="hashId" value="#{f.id}" />
												</p:graphicImage>
											</p:dataGrid>
							        	</p:overlayPanel>
							        </p:column>
							     </p:row>
							    
							    <p:row>
							        <p:column style="font-weight: bold;">Mínimo</p:column>
							        <p:column style="text-align: center" rowspan="1">
							        	<p:graphicImage id="bioMIE" name="#{(recuperandoBean.recuperando.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>

								<p:commandButton action="#{recuperandoBean.excluirParente(parente)}" immediate="true" icon="ui-icon-trash" title="Excluir" update=":tabView:formParente:parentes :mensagens"

							 		<p:confirm header="Confirmação" message="Deseja excluir este Parente?" icon="ui-icon-alert" />
								</p:commandButton>							
							</center>
						</p:column>
					</p:dataTable>
					
					<p:confirmDialog global="true">
						<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
						<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
					</p:confirmDialog>
					
				</p:panel>
				<br/><br/>
				<p:commandButton value="Salvar" update=":mensagens" action="#{recuperandoBean.salvar()}" icon="ui-icon-disk" rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao}" />
				<p:button outcome="pretty:ListarRecuperando" value="Voltar" disabled="#{(empty recuperandoBean.recuperando.pessoa.nome)}" icon="ui-icon-arrowreturnthick-1-w">
					<f:param name="list" value="1"/>
				</p:button>		
			</h:form>
			</p:tab>
		</p:tabView>
		
		<p:dialog id="dialogAlcunha" header="Alcunha" showEffect="fade" widgetVar="novaAlcunha" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="formDialog">
				<p:panel>
					<sgp:formInputText 
						id="alcunha"
						labelValue="Alcunha"
						validationRequired="true"
						value="#{recuperandoBean.alcunha.nome}"
						size="40"
						display="text"					
						maxlength="80"
						disabled="#{recuperandoBean.isVisualizacao}"/>
						
						<sgp:formCheckbox labelValue="Principal" value="#{recuperandoBean.alcunha.principal}" disabled="#{recuperandoBean.isVisualizacao}"/>			
					
					<br/>				
					<p:commandButton title="Salvar" value="Adicionar" icon="ui-icon-plus" update="@form :tabView:formInfos:alcunhas" action="#{recuperandoBean.incluirAlcunha()}" 
						rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao}"/>
					<p:commandButton value="Fechar" onclick="PF('novaAlcunha').hide()" process="@this"/>
					<br/>
				</p:panel>			
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogOutroNome" header="Outro Nome" showEffect="fade" widgetVar="outroNome" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="formOutroNome">
				<p:panel>
					<sgp:formInputText display="text" requiredMessage="*" id="nomePessoa" labelValue="Nome"
						value="#{recuperandoBean.outroNome.nome}" validationRequired="true"
						size="40" disabled="#{recuperandoBean.isVisualizacao}" maxlength="80" />
		
					<sgp:formInputText display="text" requiredMessage="*" id="nomeMae"
						labelValue="Nome da Mãe" value="#{recuperandoBean.outroNome.nomeMae}"
						validationRequired="true" size="40" maxlength="80"
						disabled="#{recuperandoBean.isVisualizacao}" />
							
					<sgp:formCalendar display="text" labelValue="Nascimento"
						value="#{recuperandoBean.outroNome.dataNascimento}" dataMaxima="#{comboHelperBean.maxDate}"
						validationRequired="true" disabled="#{recuperandoBean.isVisualizacao}" />			
					
					<br/><br/><br/>				
					<p:commandButton title="Salvar" value="Adicionar" icon="ui-icon-plus" update="@form :tabView:formInfos:outrosNomes" action="#{recuperandoBean.incluirNome()}" 
						rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao}"/>
				 	<p:commandButton value="Fechar" onclick="PF('outroNome').hide()" process="@this"/>
					<br/>
				</p:panel>			
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogPericulosidade" header="Perículosidade" showEffect="fade" widgetVar="altPericulosidade" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="formPeric">
			<p:panel>
				<sgp:formSelectOneMenu 
					id="peric" labelValue="Perículosidade"
					value="#{recuperandoBean.recuperando.periculosidade}"
					itemsValue="#{comboHelperBean.periculosidade}" 
					itemValue="#{item}"
					itemLabel="#{item.descricao}" 
					disabled="#{recuperandoBean.isVisualizacao}"
					display="text"
					temSelecione="true" />
	
				<sgp:formInputTextarea 
					id="obsPeric"
					labelValue="Observação"
					value="#{recuperandoBean.recuperando.observacao}"
					validationRequired="true"
					disabled="#{recuperandoBean.isVisualizacao}"
					rows="10"
					columns="50"
					maxlength="250"
					autoResize="true"
					size="#{recuperandoBean.recuperando.observacao.length()+5}"
					display="text"/>			
				
					
					<br/>
					<br/>
					<br/>				
				<p:commandButton title="Alterar" value="Salvar" icon="ui-icon-pencil" update="@form :tabView:infoPeric :cabecalho" action="#{recuperandoBean.alterarPericulosidade()}" rendered="#{securityUtil.possuiPermissao('AlterarPericulosidade') and !recuperandoBean.isVisualizacao}"/>
			 	<p:commandButton value="Fechar" onclick="PF('altPericulosidade').hide()" process="@this"/>

				<br/>
			</p:panel>			
			
		</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogParente" header="Parente" showEffect="fade" widgetVar="novoParente" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="formParente">
			<p:panel>
					 	
				<sgp:formInputText 
					id="nome"
					labelValue="Nome"
					validationRequired="true"
					value="#{recuperandoBean.parente.nome}"
					size="40"
					display="text"					
					maxlength="80"
					disabled="#{recuperandoBean.isVisualizacao}"/>
					
					<sgp:formCalendar display="text" labelValue="Nascimento"
						value="#{recuperandoBean.parente.dataNascimento}" dataMaxima="#{recuperandoBean.dataMinima}"
						validationRequired="false" disabled="#{recuperandoBean.isVisualizacao}" />

					<sgp:formSelectOneMenu display="text" requiredMessage="*"
						id="parentesco" labelValue="Parentesco" itemValue="#{item}"
						temSelecione="true" validationRequired="true"
						value="#{recuperandoBean.parente.parentesco}"
						itemsValue="#{comboHelperBean.parentescos}"
						itemLabel="#{item.descricao}"
						disabled="#{recuperandoBean.isVisualizacao}"
						converter="SimpleEntityConverter">
						<f:ajax event="change" render=":formParente:jud:input" />
					</sgp:formSelectOneMenu>

					<sgp:formCheckbox id="jud" labelValue="Possui decisão Judicial" value="#{recuperandoBean.parente.judicial}" display="text"
								    validatorId="checkBoxValidator"	disabled="#{recuperandoBean.isVisualizacao or !(recuperandoBean.parente.parentesco.grau>1)}" />

					<sgp:formSelectOneMenu id="status" labelValue="Status"
						value="#{recuperandoBean.parente.status}"
						itemsValue="#{comboHelperBean.status}" itemValue="#{item}"
						itemLabel="#{item.descricao}"
						disabled="#{recuperandoBean.isVisualizacao}" display="text" />

					<br/>	
					<br/>			
				<p:commandButton title="Salvar" value="Adicionar" icon="ui-icon-plus" update="@form :tabView:formParente:parentes" action="#{recuperandoBean.incluirParente()}" 
					rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao and recuperandoBean.alterarParentes()}"/>
			 		
				<p:commandButton value="Fechar" onclick="PF('novoParente').hide()" process="@this"/>
				
				<br/>
			</p:panel>			
			
		</h:form>
    	</p:dialog>

		<p:dialog id="dialogProcesso" header="Alterar Regime do Processo" showEffect="fade" widgetVar="dialogProcesso" modal="true"
    			draggable="false" resizable="false" focus=":formDialogProcesso:nomeRecuperando" closeOnEscape="true">
    		<h:form id="formDialogProcesso">
    			<sgp:formOutputText id="nomeRecuperando" labelValue="Recuperando" value="#{processoRegimeCondicaoBean.processoRegimeCondicao.processo.recuperando.pessoa.nome}"/>
    			
    			<sgp:formOutputText labelValue="Matrícula" value="#{processoRegimeCondicaoBean.processoRegimeCondicao.processo.recuperando.id}"/>
    			
    			<sgp:formCalendar labelValue="Data Documento"
						value="#{processoRegimeCondicaoBean.processoRegimeCondicao.dataDocumento}" display="text"
						validationRequired="true" />
    			
    			<sgp:formInputTextarea id="observacaoProcesso" labelValue="Observação"
						value="#{processoRegimeCondicaoBean.processoRegimeCondicao.observacao}" 
						rows="10"
						columns="50" 
						maxlength="250" 
						autoResize="true"
						size="#{processoRegimeCondicaoBean.processoRegimeCondicao.observacao.length()}"
						display="text" 
						validationRequired="true"/>
						
				<sgp:formSelectOneMenu
					id="regime"
					labelValue="Regime"
					value="#{processoRegimeCondicaoBean.processoRegimeCondicao.regime}" 
					itemsValue="#{comboHelperBean.regimes}" 
					itemValue="#{item}" 
					itemLabel="#{item.descricao}"
					display="text"
					converter="SimpleEntityConverter"
					validationRequired="true"
					temSelecione="true"/>
					
				<sgp:formSelectOneMenu
					id="condicao"
					labelValue="Condição"
					value="#{processoRegimeCondicaoBean.processoRegimeCondicao.condicao}"
					itemsValue="#{comboHelperBean.condicao}" 
					itemValue="#{item}" 
					itemLabel="#{item.descricao}"
					display="text"
					validationRequired="true"
					temSelecione="true">
					<f:ajax event="change" render="formDialogProcesso:anoMesDia"/>
				</sgp:formSelectOneMenu>
					
				<h:panelGroup id="anoMesDia">
					<sgp:formInputText id="ano" value="#{processoRegimeCondicaoBean.processoRegimeCondicao.ano}" labelValue="Ano" size="10" maxlength="4" validationRequired="true" display="text" disabled="#{recuperandoBean.isVisualizacao}"
						rendered="#{processoRegimeCondicaoBean.processoRegimeCondicao.condicao != null and processoRegimeCondicaoBean.processoRegimeCondicao.condicao.descricao.equalsIgnoreCase('Condenado')}"/>
			
					<sgp:formInputText id="mes" value="#{processoRegimeCondicaoBean.processoRegimeCondicao.mes}" labelValue="Mês" size="10" maxlength="2" validationRequired="true" display="text" disabled="#{recuperandoBean.isVisualizacao}"
						rendered="#{processoRegimeCondicaoBean.processoRegimeCondicao.condicao != null and processoRegimeCondicaoBean.processoRegimeCondicao.condicao.descricao.equalsIgnoreCase('Condenado')}"/>
			
					<sgp:formInputText id="dia" value="#{processoRegimeCondicaoBean.processoRegimeCondicao.dia}" labelValue="Dia" size="10" maxlength="2" validationRequired="true" display="text" disabled="#{recuperandoBean.isVisualizacao}"
						rendered="#{processoRegimeCondicaoBean.processoRegimeCondicao.condicao != null and processoRegimeCondicaoBean.processoRegimeCondicao.condicao.descricao.equalsIgnoreCase('Condenado')}"/>
				</h:panelGroup>
					
    			<br/><br/><br/>
    			<p:commandButton value="Salvar" update=":tabView:formPassagem" action="#{processoRegimeCondicaoBean.salvar()}" icon="ui-icon-disk" 
    				rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao}"/>
    			<p:commandButton value="Fechar" onclick="PF('dialogProcesso').hide()"/>
    		</h:form>
    			
		</p:dialog>
		
		<p:dialog id="dialogFinalizarProcesso" header="Finalizar Processo" showEffect="fade" widgetVar="dialogFinalizarProcesso" modal="true"
    			draggable="false" resizable="false" closeOnEscape="true" focus=":formDialogFinalizarProcesso:numeroProcesso">
    		<h:form id="formDialogFinalizarProcesso">
    			<sgp:formOutputText id="numeroProcesso" labelValue="Nº Processo" value="#{recuperandoBean.processo.numeroProcesso}"/>
    			
    			<sgp:formCalendar
    				labelValue="Data de Finalizado"
					value="#{recuperandoBean.processo.dataFinalizado}"
					display="text"
					validationRequired="true" />
    			
    			<sgp:formInputTextarea id="observacao" labelValue="Observação"
						value="#{recuperandoBean.processo.observacaoFinalizado}" 
						rows="10"
						columns="50" 
						maxlength="250" 
						autoResize="true"
						size="#{recuperandoBean.processo.observacaoFinalizado.length()}"
						display="text" 
						validationRequired="true"/>
				
				<br/><br/><br/>
				<p:commandButton value="Salvar" update=":mensagens" action="#{recuperandoBean.salvarProcesso()}" icon="ui-icon-disk" 
					rendered="#{(securityUtil.possuiPermissao('CadastrarRecuperando') or securityUtil.possuiPermissao('AlterarRecuperando')) and !recuperandoBean.isVisualizacao}"/>
    			<p:commandButton value="Fechar" onclick="PF('dialogFinalizarProcesso').hide()"/>
			</h:form>
    			
		</p:dialog>
		
		<p:dialog id="dialogPassagem" header="Passagem" showEffect="fade" widgetVar="visualizarPassagem" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="passagemForm">
				<p:panel>
					<div class="row">
						<div class="col-md-8">
							<sgp:formOutputLabel labelValue="Data da Prisão" value="#{recuperandoBean.passagemSelecionada.dataPrisao}" converterData="true"/>
							<sgp:formOutputLabel labelValue="Data da Entrada" value="#{recuperandoBean.passagemSelecionada.dataEntrada}" converterDataHora="true" />
							<sgp:formOutputLabel labelValue="Procedência" value="#{recuperandoBean.passagemSelecionada.passagemProcedencia.procedencia.nome}" />
													
							<p:panel header="Desligamento" rendered="#{recuperandoBean.passagemSelecionada.dataSaida != null}">
								<sgp:formOutputLabel labelValue="Número do Documento" value="#{recuperandoBean.passagemSelecionada.numeroDocumento}"/>
								<sgp:formOutputLabel labelValue="Data da Saída" value="#{recuperandoBean.passagemSelecionada.dataSaida}" converterDataHora="true"/>
								<sgp:formOutputLabel labelValue="Motivo" value="#{recuperandoBean.passagemSelecionada.tipoDesligamento.descricao}"/>
								<p:row rendered="#{recuperandoBean.passagemSelecionada.estabelecimentoDestino != null}">
								<sgp:formOutputLabel labelValue="Estabelecimento" value="#{recuperandoBean.passagemSelecionada.estabelecimentoDestino.nome}" />
								</p:row>
								<sgp:formOutputLabel labelValue="Observação" value="#{recuperandoBean.passagemSelecionada.obsDesligamento}" />
							</p:panel>
						</div>
					
						<div class="col-md-4">
							<p:dataGrid layout="tabular" style="margin-left: 8px; width: 188px" columns="1" rows="1" value="#{recuperandoBean.passagemSelecionada.foto}" emptyMessage="Sem foto de frente." var="f">
								<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}" cache="false" width="180" height="240">
									<f:param name="hashId" value="#{f.imagem.id}" />
								</p:graphicImage>
							</p:dataGrid>
						</div>
					</div>
				
					<br/>
				
					<p:dataTable id="lotacoes" var="lotacao" value="#{recuperandoBean.passagemSelecionada.lotacao}" rows="10" paginator="true" paginatorPosition="bottom"  
									sortBy="#{lotacao.id}" emptyMessage="Nenhum registro encontrado." paginatorAlwaysVisible="false">
									
						<p:column headerText="Origem">
							<h:outputText value="#{lotacao.tipoTransito.descricao}" />
						</p:column>
						<p:column headerText="Estrutura">
							<h:outputText value="#{lotacao.estrutura.nomeCompleto}" />
						</p:column>
						
						<p:column headerText="Entrada">
							<h:outputText value="#{lotacao.dataEntrada}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
							</h:outputText>
						</p:column>
						
						<p:column headerText="Saída">
							<h:outputText value="#{lotacao.dataSaida}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
							</h:outputText>
						</p:column>	
						
					</p:dataTable>
					
					<br/>
	    			<p:commandButton value="Fechar" onclick="PF('visualizarPassagem').hide()"/>
	    			<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{recuperandoBean.imprimirExtratoRecuperandoPorPassagem(recuperandoBean.passagemSelecionada.id)}"/>
    			</p:panel>
			</h:form>
    	</p:dialog>
    	
    	<h:form id="formAutCadBio" prependId="false">
    		<p:dialog id="dialogAutorizacaoBiometria" dynamic="true" header="Autorização para cadastro SEM BIOMETRIA" showEffect="fade" widgetVar="dlgAutBio" modal="true" draggable="false" 
    			resizable="false" closeOnEscape="true">
    			<h:panelGroup id="divAut">
	    			<sgp:formInputText id="login" labelValue="Login" maxlength="11" minlength="4" value="#{recuperandoBean.loginUsuarioAutorizador}" validationRequired="true"
	    				display="text" requiredMessage="*"/>
					<sgp:formInputPassword id="senha" labelValue="Senha" maxlength="15" minlength="4"
						value="#{recuperandoBean.senhaUsuarioAutorizador}" validationRequired="true" display="text" requiredMessage="*"/>
					<sgp:formInputTextarea id="observacao" labelValue="Observação" value="#{recuperandoBean.observacaoUsuarioAutorizador}"
						rows="5" columns="40" maxlength="250" display="text" requiredMessage="*" validationRequired="true" />
					
					<br/><br/><br/>
					<p:commandButton value="Autorizar" update=":divAut :mensagens" action="#{recuperandoBean.autorizarCadastroSemBiometria}" icon="ui-icon-disk" />
	    			<p:commandButton value="Fechar" onclick="PF('dlgAutBio').hide()" immediate="true"/>
	    		</h:panelGroup>
    		</p:dialog>
		</h:form>
		
		<p:confirmDialog widgetVar="confirmaCadBio" header="CADASTRAR RECUPERANDO SEM BIOMETRIA" message="Para realizar o cadastro SEM BIOMETRIA é necessária a autorização de um responsável, deseja continuar?">
			<p:commandButton value="Sim" type="button" onclick="PF('confirmaCadBio').hide(); PF('dlgAutBio').show();" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="Não" type="button" onclick="PF('confirmaCadBio').hide();" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>
	
		<style>
			#tabView\:formParticularidades\:dataGridPart_content {
				padding: 10px;
				border: 0px;
			}
			#tabView\:formAbaFotosHistorico\:dataGridFotos_content {
				padding: 10px;
				border: 0px;
			}
		</style>
	</ui:define>
</ui:composition>
