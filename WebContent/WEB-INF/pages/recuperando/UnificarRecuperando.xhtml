								var="img1">

									cache="false" width="180" height="240">
									<f:param name="hashId" value="#{img1.id}" />

							</p:dataGrid>

								</p:graphicImage>
							</p:dataGrid>
								
							
							<p:panel style="border:none;">
								<h4>Passagens no sistema prisional</h4>

								<p:outputLabel
									value="Total de passagens: #{unificarRecuperandoBean.recuperando1.passagens.size()}" />

								<p:dataTable id="dataTableRec1" var="pass"
									value="#{unificarRecuperandoBean.recuperando1.passagens}"
									rows="10" paginator="true" paginatorPosition="bottom"
									lazy="true" sortBy="#{pass.id}"
									emptyMessage="Nenhum registro encontrado."
									paginatorAlwaysVisible="false">

									<p:column headerText="Procedência" style="font-size:12px;">
										<h:outputText style="font-size:11px;"
											value="#{pass.passagemProcedencia.procedencia.nome}" />
									</p:column>

									<p:column headerText="Data de Entrada" width="120" style="font-size:12px;">
										<h:outputText value="#{pass.dataEntrada}" style="font-size:11px;">
											<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
										</h:outputText>
									</p:column>

									<p:column headerText="Data de Saída" width="110" style="font-size:12px;">
										<h:outputText value="#{pass.dataSaida}" style="font-size:11px;">
											<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
										</h:outputText>
									</p:column>

									<p:column headerText="Lotação" width="85" style="font-size:12px;">
										<center>
											<p:commandButton title="Lotação" icon="ui-icon-document"
												action="#{unificarRecuperandoBean.visualizarLotacao(pass)}"
												oncomplete="PF('visualizarPassagem').show()"
												update="passagemForm" process="@this" />
										</center>
									</p:column>

								<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o"

									process="@this" />
