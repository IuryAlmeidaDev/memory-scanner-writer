							<h:panelGrid columns="1">
								<h:form id="formPassagem">
									<p:panel>
										<h4>Passagens no sistema prisional</h4>

										<p:outputLabel
											value="Total de passagens: #{unificarRecuperandoBean.recuperando1.passagens.size()}" />

										<p:dataTable id="dataTable" var="pass"
											value="#{unificarRecuperandoBean.recuperando1.passagens}"
											rows="10" paginator="true" paginatorPosition="bottom"
											lazy="true" sortBy="#{pass.id}"
											emptyMessage="Nenhum registro encontrado."
											paginatorAlwaysVisible="false">

											<p:column headerText="Procedência">
												<h:outputText
													value="#{pass.passagemProcedencia.procedencia.nome}" />
											</p:column>

							<p:dataGrid layout="tabular"
								style="margin-left: 8px; width: 188px" columns="1" rows="1"
								value="#{unificarRecuperandoBean.passagemSelecionada.foto}"
								emptyMessage="Sem foto de frente." var="f">
								<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}"
									cache="false" width="180" height="240">
									<f:param name="hashId" value="#{f.imagem.id}" />
								</p:graphicImage>
							</p:dataGrid>
						</div>
					</div>

					<br />

					<p:dataTable id="lotacoes" var="lotacao"
						value="#{unificarRecuperandoBean.passagemSelecionada.lotacao}"
						rows="10" paginator="true" paginatorPosition="bottom"
						sortBy="#{lotacao.id}" emptyMessage="Nenhum registro encontrado."
						paginatorAlwaysVisible="false">

						<p:column headerText="Origem">
							<h:outputText value="#{lotacao.tipoTransito.descricao}" />
						</p:column>
						<p:column headerText="Estrutura">
							<h:outputText value="#{lotacao.estrutura.nomeCompleto}" />
						</p:column>

						<p:column headerText="Entrada">
							<h:outputText value="#{lotacao.dataEntrada}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
							</h:outputText>
						</p:column>

						<p:column headerText="Saída">
							<h:outputText value="#{lotacao.dataSaida}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
							</h:outputText>
						</p:column>

					</p:dataTable>

					<br />
					<p:commandButton value="Fechar"
						onclick="PF('visualizarPassagem').hide()" />
				</p:panel>
			</h:form>
		</p:dialog>


	</ui:define>
</ui:composition>
