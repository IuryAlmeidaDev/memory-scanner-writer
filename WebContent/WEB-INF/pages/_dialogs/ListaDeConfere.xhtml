<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/pages/_templates/dialog.xhtml"
	xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite"
	xmlns:pe="http://primefaces.org/ui/extensions">

	<ui:define name="head">
		<title>Lista de Confere</title>
	</ui:define>
	
	<ui:define name="conteudo">
		<h:form id="formDialogConfere">
			<p:panel>
				<pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.TipoPlantao" var="Plantao" allSuffix="ALL_ENUM_VALUES" />
				
				<sgp:formCalendar labelValue="Data Inicial" value="#{listaDeChamadaBean.filtroConfere.dataInicial}" 
					requiredMessage="*" display="text" pattern="dd/MM/yyyy"/>
				
				<sgp:formCalendar labelValue="Data Final" value="#{listaDeChamadaBean.filtroConfere.dataFinal}"
					requiredMessage="*" display="text" pattern="dd/MM/yyyy"/>
				
				<sgp:formSelectOneMenu itemsValue="#{comboHelperBean.plantoes}" itemValue="#{item}" itemLabel="#{item.name}" 
					labelValue="Plantão" value="#{listaDeChamadaBean.filtroConfere.plantaoInicial}" temSelecione="false" />
				
				<br/>
				<br/>
				<p:commandButton value="Gerar Lista" icon="ui-icon-plus" actionListener="#{listaDeChamadaBean.imprimirListaConfere}"/>
				<p:commandButton value="Fechar" immediate="true" actionListener="#{listaDeChamadaBean.fecharDialogConfere}" />
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
