<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/pages/_templates/dialog.xhtml"
	xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite">

	<ui:define name="head">
		<title>Associar Pessoa</title>
	</ui:define>
	
	<ui:define name="conteudo">
		<h:form>
			<p:panel>
				<sgp:formInputText id="pesquisar" labelValue="Nome" value="#{associarPessoaBean.filtro.nome}" />

				<br />
				<br />
				<p:commandButton value="Pesquisar"
					update=":formPessoas"
					process="@form"
					icon="ui-icon-search" />

			</p:panel>
		</h:form>
		
		<h:form id="formPessoas">
			<p:dataTable id="dataTable" var="pessoa" value="#{associarPessoaBean.pessoas}" rows="5" paginatorAlwaysVisible="false" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{pessoa.id}">
				<p:column headerText="Id" sortBy="#{pessoa.id}" width="100">
					<h:outputText value="#{pessoa.id}" />
				</p:column>
				
				<p:column headerText="Nome" sortBy="#{pessoa.nome}">
					<h:outputText value="#{pessoa.nome}"/>
				</p:column>					
				
				<p:column width="50">
					<center>
						<p:commandButton title="Associar" icon="ui-icon-check" actionListener="#{associarPessoaBean.selecionarPessoa(pessoa)}">
							<p:confirm header="Atenção" message="Salve o cadastro para confirmar a alteração!" icon="ui-icon-alert" />
						</p:commandButton>
					</center>
				</p:column>
			</p:dataTable>
			
			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>

			<div style="text-align: center">
				<br/>
				<p:commandButton value="Fechar" icon="ui-icon-close" actionListener="#{associarPessoaBean.fecharDialog}" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
