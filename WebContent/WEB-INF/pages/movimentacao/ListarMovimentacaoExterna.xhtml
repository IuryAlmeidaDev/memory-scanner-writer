<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Movimentação Externa</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarMovimentacaoExterna" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarMovimentacaoExterna')}"/>
		</h:form>		
			
		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta"/>
				
				<sgp:formInputText 
						id="pedId"
						labelValue="Nº Pedido"
						value="#{movimentacaoExternaBean.filtro.numPedido}"	
						mask="?999999999"										
						display="text"
						toolTip="Nº do Pedido de Trânsito"						
						/>
						
				<sgp:formInputText 
						id="id"
						labelValue="Nº Movimentação"
						value="#{movimentacaoExternaBean.filtro.id}"	
						mask="?999999999"										
						display="text"
						toolTip="Nº da Movimentação"	
						/>
				
										
				<sgp:formCalendar display="text" requiredMessage="*" labelValue="Data Prev. Inicial" toolTip="Data prevista inicial da movimentação"
						value="#{movimentacaoExternaBean.filtro.dataInicio}"   />
						
				<sgp:formCalendar display="text" requiredMessage="*" labelValue="Data Prev. Final" toolTip="Data prevista final da movimentação"
						value="#{movimentacaoExternaBean.filtro.dataFim}"  />
						
				<sgp:formSelectOneMenu 
						id="status" labelValue="Status"
						value="#{movimentacaoExternaBean.filtro.status}"
						temSelecione="true"
						itemsValue="#{comboHelperBean.statusMovimentacao}" 
						itemValue="#{item}"
						itemLabel="#{item.descricao}" 
						disabled="#{movimentacaoExternaBean.isVisualizacao}"
						display="text" />					

				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search" />
				<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{movimentacaoExternaBean.imprimir()}"/>
			</p:panel>
		</h:form>	

		<h:form id="registrosForm">
				<p:dataTable id="dataTable" var="mov" value="#{movimentacaoExternaBean.movimentacoes}" rows="10" paginator="true" paginatorPosition="bottom" lazy="true" 
				             sortBy="#{mov.id}" sortOrder="descending" emptyMessage="Nenhum registro encontrado.">
				             
					<p:column headerText="Nº" width="60" sortBy="#{mov.id}">
						<h:outputText value="#{mov.id}" />
					</p:column>			
					
					<p:column headerText="Observação">
						<h:outputText value="#{mov.observacao}" />
					</p:column>				
					
					<p:column headerText="Data Prevista" sortBy="#{mov.dataPrevista}" width="150">
						<h:outputText value="#{mov.dataPrevista}">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
					</p:column>
					
					<p:column headerText="Data da Saída" sortBy="#{mov.dataInicio}" width="170">
						<h:outputText value="#{mov.dataInicio}">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm"  />
						</h:outputText>
					</p:column>
				
					<p:column headerText="Status"  width="120" sortBy="#{mov.status}">
						<h:outputText value="#{mov.status.descricao}" />
					</p:column>
														
					<p:column headerText="Ações" width="210">
						<center>
							<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarMovimentacaoExterna" rendered="#{securityUtil.possuiPermissao('VisualizarMovimentacaoExterna')}">
								<f:param name="id" value="#{mov.id}" />
							</p:button>
							<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:AlterarMovimentacaoExterna" rendered="#{securityUtil.possuiPermissao('AlterarMovimentacaoExterna') and mov.status.descricao.equalsIgnoreCase('Pendente')}">
								<f:param name="id" value="#{mov.id}" />
							</p:button>
							<p:button title="Iniciar" icon="fa fa-play" outcome="pretty:IniciarMovimentacaoExterna" rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoExterna') and mov.status.descricao.equalsIgnoreCase('Pendente')}">
								<f:param name="id" value="#{mov.id}" />
							</p:button>
							<p:button title="Finalizar" icon="fa fa-flag" outcome="pretty:FinalizarMovimentacaoExterna" rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoExterna') and (mov.status.descricao.equalsIgnoreCase('Em andamento') or mov.status.descricao.equalsIgnoreCase('Finalizado Parcial'))}">
								<f:param name="id" value="#{mov.id}" />
							</p:button>
							<p:commandButton title="Cancelar" icon="ui-icon-cancel"  action="#{movimentacaoExternaBean.cancelarMovimentacao(mov)}" oncomplete="PF('cancelarMovimentacao').show()"  update="cancelarForm" process="@this"
								rendered="#{securityUtil.possuiPermissao('CancelarMovimentacaoExterna') and not mov.pedidos.stream().anyMatch(pedido -> !pedido.status.descricao.equalsIgnoreCase('Em Andamento')) and (mov.status.descricao.equalsIgnoreCase('Pendente') or mov.status.descricao.equalsIgnoreCase('Em Andamento'))}" />							
							<p:commandButton action="#{movimentacaoExternaBean.excluir(mov)}"	icon="ui-icon-trash" title="Excluir" update="@form :registrosForm :mensagens" rendered="#{securityUtil.possuiPermissao('ExcluirMovimentacaoExterna') and mov.status.descricao.equalsIgnoreCase('Pendente')}">
								 <p:confirm header="Confirmação" message="Deseja excluir a movimentação?" icon="ui-icon-alert" />
							</p:commandButton>
							<p:commandButton title="Escolta" icon="fa fa-users" action="#{movimentacaoExternaBean.acrescentarEscolta(mov)}" rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoExterna') and (mov.status.descricao.equalsIgnoreCase('Em andamento') or mov.status.descricao.equalsIgnoreCase('Finalizado Parcial'))}"
								oncomplete="PF('adicionarEscolta').show()"  update="escoltaForm" process="@this" />
							<p:commandButton title="Imprimir" icon="fa fa-print" actionListener="#{movimentacaoExternaBean.imprimirRegistro(mov)}"/>
						</center>
					</p:column>
					
					<f:facet name="footer">
						Total de registros: #{movimentacaoExternaBean.movimentacoes.rowCount}
					</f:facet>
				</p:dataTable>

				<p:confirmDialog global="true">
					<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>
		</h:form>
		
		<p:dialog id="dialogCacel" header="Cancelar Movimentação" showEffect="fade" widgetVar="cancelarMovimentacao" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="cancelarForm">
			<p:panel>
			<sgp:formInputTextarea id="motivoCancel" 
						labelValue="Motivo do Cancelamento"
						value="#{movimentacaoExternaBean.movimentacao.resultado}" 
						validationRequired="true"
						disabled="#{movimentacaoExternaBean.isVisualizacao}"
						rows="10" columns="50"
						maxlength="250" autoResize="true"
						size="#{movimentacaoExternaBean.movimentacao.resultado.length()+5}" 
						display="text" />
					<br/>
					<br/>
					<p:commandButton title="Salvar" value="Confirmar" icon="ui-icon-check" update="@form :registrosForm" action="#{movimentacaoExternaBean.confirmarCancelamentoMovimentacao()}"
						rendered="#{securityUtil.possuiPermissao('CancelarMovimentacaoExterna')}">
								 <p:confirm header="Confirmação" message="Todos os pedidos vinculados serão cancelados! Confirma?" icon="ui-icon-alert" />
							</p:commandButton>
			 		
				<p:commandButton value="Fechar" onclick="PF('cancelarMovimentacao').hide()" process="@this"/>
				
				<br/>
			</p:panel>
			
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogEscolta" header="Adicionar Escolta" showEffect="fade" widgetVar="adicionarEscolta" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form>
			<p:panel>
			    <h:outputText value="Escolta Interna?" />
			    <br/><br/>
			    <p:commandButton  value="Sim" immediate="true" actionListener="#{movimentacaoExternaBean.abrirDialogServidor}" rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoExterna')}">
							<p:ajax event="dialogReturn" listener="#{movimentacaoExternaBean.associarServidor}" update="@form" />
						</p:commandButton>
			 		
				<p:commandButton value="Não" onclick="PF('adicionarEscolta').hide()" oncomplete="PF('escoltaExterna').show()" actionListener="#{movimentacaoExternaBean.escoltaExterna}" process="@this"/>
				
				<br/>
			</p:panel>
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogEscoltaExterna" header="Adicionar Escolta" showEffect="fade" widgetVar="escoltaExterna" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="escoltaForm">
			<p:panel>
			<sgp:formInputText id="nome" labelValue="Nome" value="#{movimentacaoExternaBean.escolta.nome}" validationRequired="true" maxlength="100"
					display="text" size="40"/>
					
					 <sgp:formInputMask id="cpf" labelValue="CPF" value="#{movimentacaoExternaBean.escolta.cpf}" validationRequired="true" mask="999.999.999-99" converter="CpfConverter"
                    validatorId="CpfValidator" display="text" maxlength="11"/>
                    
                    <sgp:formInputMask id="matricula" labelValue="Matrícula" mask="?9999999999" validatorRange="1" value="#{movimentacaoExternaBean.escolta.matricula}" validationRequired="true"						
					display="text" maxlength="10"/>
					
					<br/>
					<br/>
					<p:commandButton value="Adicionar" action="#{movimentacaoExternaBean.adicionarEscoltaExterna()}" update="@form" onclick="PF('escoltaExterna').hide()" icon="ui-icon-disk" rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoExterna')}"/>
					
			 		
				<p:commandButton value="Fechar" onclick="PF('escoltaExterna').hide()" process="@this"/>
				
				<br/>
			</p:panel>
			</h:form>
    	</p:dialog>
		

	</ui:define>
</ui:composition>
