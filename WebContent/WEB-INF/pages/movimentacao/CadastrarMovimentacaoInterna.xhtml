<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>#{movimentacaoInternaBean.tituloPagina} Movimentação Interna</h3>
		
			<h:form id="formMovInt">
					<p:panel header="Nº Movimentação: #{movimentacaoInternaBean.movimentacao.id}" footer="Cadastrado por: #{movimentacaoInternaBean.movimentacao.autorRegistro.usuario} em #{movimentacaoInternaBean.movimentacao.autorRegistro.data} | Alterado por: #{movimentacaoInternaBean.movimentacao.autorUltimaAlteracao.usuario} em #{movimentacaoInternaBean.movimentacao.autorUltimaAlteracao.data}" >		
					
					<h4>
					<sgp:formOutputLabel 
						labelValue="Situação da Movimentação" 
						value="#{movimentacaoInternaBean.movimentacao.status.descricao}" />	
				   	</h4>
				   	
				   	<p:column headerText="Status"  width="120" sortBy="#{pedido.status}">
						<h:outputText value="#{pedido.status.descricao}" />
					</p:column>
				
				  	<sgp:formCalendar 
						labelValue="Data Prev. Saída	"
						value="#{movimentacaoInternaBean.movimentacao.dataPrevista}"
						display="text" 
						dataMinima="#{movimentacaoInternaBean.dataMinima}"
						validationRequired="true"
						pattern="dd/MM/yyyy HH:mm" 
						disabled="#{movimentacaoInternaBean.isVisualizacao or movimentacaoInternaBean.isIniciar or movimentacaoInternaBean.isFinalizar}"/>	

					<sgp:formInputTextarea id="obs" 
						labelValue="Observação"
						value="#{movimentacaoInternaBean.movimentacao.observacao}" 
						validationRequired="true"
						disabled="#{movimentacaoInternaBean.isVisualizacao or movimentacaoInternaBean.isIniciar or movimentacaoInternaBean.isFinalizar}"
						rows="5" columns="100"
						maxlength="250" autoResize="true"
						size="#{movimentacaoInternaBean.movimentacao.observacao.length()+5}" 
						display="text" />
			    <br /> <br /> <br /> <br /> <br /> <br /> <br />							
							
			   	<h4>Pedidos</h4>
				    	<p:commandButton 
							icon="ui-icon-plus" 
							value="Adicionar" 
							immediate="true" 
							actionListener="#{movimentacaoInternaBean.abrirDialogPedido}" 
							rendered="#{(securityUtil.possuiPermissao('CadastrarMovimentacaoInterna') or securityUtil.possuiPermissao('AlterarMovimentacaoInterna')) and !movimentacaoInternaBean.isVisualizacao and !movimentacaoInternaBean.isIniciar and !movimentacaoInternaBean.isFinalizar}">
								<p:ajax event="dialogReturn" listener="#{movimentacaoInternaBean.associarPedido}" update=":formMovInt:pedidos" />
						</p:commandButton>		
						<br/>
						<br/>
						<p:dataTable 
							id="pedidos" 
							var="pedido" 
							value="#{movimentacaoInternaBean.movimentacao.pedidos}" 
							rows="10" 
							paginator="true" 
							paginatorPosition="bottom" 
							paginatorAlwaysVisible="false" 
							sortBy="#{pedido.dataPrevista}"
							emptyMessage="Nenhum registro encontrado.">
				             
					    <p:column headerText="Nº" width="60" sortBy="#{pedido.id}">
							<h:outputText value="#{pedido.id}" />
						</p:column>
					             
						<p:column headerText="Matrícula" sortBy="#{pedido.recuperando.id}">
							<h:outputText value="#{pedido.recuperando.id}" />
						</p:column>
		
						<p:column headerText="Nome" sortBy="#{pedido.recuperando.pessoa.nome}">
							<h:outputText value="#{pedido.recuperando.pessoa.nome}" />
						</p:column>
						
						<p:column headerText="Destino" sortBy="#{pedido.estruturaDestino.nomeCompleto}">
							<h:outputText value="#{pedido.estruturaDestino.nomeCompleto}" />
						</p:column>						
					
					<p:column headerText="Data Prevista" sortBy="#{pedido.dataPrevista}">
						<h:outputText value="#{pedido.dataPrevista}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</h:outputText>
					</p:column>
				<p:column headerText="Ações" rendered="#{!movimentacaoInternaBean.isIniciar}">
					<center>						
						<p:commandButton 
								action="#{movimentacaoInternaBean.excluirPedido(pedido)}" 
								immediate="true" icon="ui-icon-trash" 
								title="Excluir" 
								rendered="#{(securityUtil.possuiPermissao('CadastrarMovimentacaoInterna') or securityUtil.possuiPermissao('AlterarMovimentacaoInterna')) and !movimentacaoInternaBean.isVisualizacao and !movimentacaoInternaBean.isIniciar and !movimentacaoInternaBean.isFinalizar}" 
								update=":formMovInt:pedidos">
							<p:confirm header="Confirmação" message="Deseja excluir o pedido?" icon="ui-icon-alert" />
						</p:commandButton>
						
						<p:commandButton 
							title="Finalizar" 
							icon="fa fa-flag"  
							action="#{movimentacaoInternaBean.finalizarPedido(pedido)}" 
							rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna') and pedido.status.descricao.equalsIgnoreCase('Em andamento') and movimentacaoInternaBean.isFinalizar}"
							oncomplete="PF('finalizarPedido').show()"  
							update="finalizarPedForm" process="@this" 
							/>
						<p:commandButton 
							title="Cancelar" 
							icon="ui-icon-cancel"  
							action="#{movimentacaoInternaBean.cancelarPedido(pedido)}" 
							rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna') and pedido.status.descricao.equalsIgnoreCase('Em andamento') and movimentacaoInternaBean.isFinalizar}"
							oncomplete="PF('cancelarPedido').show()"  
							update="cancelarPedForm" 
							process="@this" />
					</center>
				</p:column>
			</p:dataTable>
			
			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
			
					<br/>
					
					<h4><h:outputText value="Escolta" rendered="#{movimentacaoInternaBean.isIniciar or !movimentacaoInternaBean.movimentacao.status.descricao.equals('Pendente')}" /></h4>
				   
						<p:commandButton icon="ui-icon-plus" value="Adicionar" immediate="true" actionListener="#{movimentacaoInternaBean.abrirDialogServidor}" 
							rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoInterna') and !movimentacaoInternaBean.isVisualizacao and movimentacaoInternaBean.isIniciar}">
			
							<p:ajax event="dialogReturn" listener="#{movimentacaoInternaBean.associarServidor}" update=":formMovInt:escolta" />
						</p:commandButton>		
				  <br /><br/>				
						
				<p:dataTable id="escolta" var="escolta" value="#{movimentacaoInternaBean.movimentacao.escolta}" rows="10" paginator="true" paginatorAlwaysVisible="false" paginatorPosition="bottom" sortBy="#{escolta.id}" rendered="#{movimentacaoInternaBean.isIniciar or !movimentacaoInternaBean.movimentacao.status.descricao.equals('Pendente')}"
				             emptyMessage="Nenhum registro encontrado.">
				             
				    <p:column headerText="Matrícula" width="120">
						<h:outputText value="#{escolta.servidor != null ? escolta.servidor.matricula : escolta.matricula}" />
					</p:column>
				             
					<p:column headerText="Nome" >
						<h:outputText value="#{escolta.servidor != null ? escolta.servidor.nome : escolta.nome}" />
					</p:column>	
					
					<p:column headerText="CPF" width="120">
						<h:outputText value="#{escolta.servidor != null ? escolta.servidor.cpf : escolta.cpf}" converter="CpfConverter" />
					</p:column>	
					
					<p:column headerText="Tipo" >
						<h:outputText value="#{escolta.servidor != null ? 'Interna' : 'Externa'}" />
					</p:column>			
				
				<p:column headerText="Ações" width="100">
					<center>						
						<p:commandButton action="#{movimentacaoInternaBean.excluirServidor(escolta)}" immediate="true" icon="ui-icon-trash" title="Excluir" update=":formMovInt:escolta"
							rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoInterna') and !movimentacaoInternaBean.isVisualizacao and movimentacaoInternaBean.isIniciar}" >
						 		<p:confirm header="Confirmação" message="Deseja excluir o servidor da escolta?" icon="ui-icon-alert" />
						</p:commandButton>
					</center>
				</p:column>
			</p:dataTable>

				<br />
				<br />
				
						<sgp:formOutputLabel 
						labelValue="Resultado" 
						value="#{movimentacaoInternaBean.movimentacao.resultado}" 
						rendered="#{movimentacaoInternaBean.movimentacao.dataConclusao != null}"/>

					<p:commandButton value="Salvar" action="#{movimentacaoInternaBean.salvar()}" update="@form" icon="ui-icon-disk" 
						rendered="#{(securityUtil.possuiPermissao('CadastrarMovimentacaoInterna') or securityUtil.possuiPermissao('AlterarMovimentacaoInterna')) and !movimentacaoInternaBean.isVisualizacao and movimentacaoInternaBean.movimentacao.status.descricao.equalsIgnoreCase('Pendente') and !movimentacaoInternaBean.isIniciar}" />
				
					<p:commandButton action="#{movimentacaoInternaBean.confirmarInicioMovimentacao()}" value="Iniciar" icon="fa fa-play" title="Iniciar" update="@form" 
						rendered="#{securityUtil.possuiPermissao('IniciarMovimentacaoInterna') and !movimentacaoInternaBean.isVisualizacao and movimentacaoInternaBean.movimentacao.status.descricao.equalsIgnoreCase('Pendente') and movimentacaoInternaBean.isIniciar}">
						 		<p:confirm header="Confirmação" message="Deseja Iniciar a movimentação?" icon="ui-icon-alert" />
					</p:commandButton>
					
					<p:commandButton title="Finalizar" value="Finalizar" icon="fa fa-flag" rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna') and !movimentacaoInternaBean.isVisualizacao and movimentacaoInternaBean.isFinalizar}"
								oncomplete="PF('finalizarMovimentacao').show()"  update="finalizarForm" process="@this" />
					
					<p:button outcome="pretty:ListarMovimentacaoInterna" value="Voltar" icon="ui-icon-arrowreturnthick-1-w">
						<f:param name="list" value="1" />
					</p:button>
				
				</p:panel>
				
			</h:form>
			
			<p:dialog id="dialogFinalizarPed" header="Finalizar Pedido" showEffect="fade" widgetVar="finalizarPedido" modal="true" draggable="false" resizable="false" closeOnEscape="true" width="600">
       		<h:form id="finalizarPedForm">
			<p:panel>
			<sgp:formInputTextarea id="resultadoPed" 
						labelValue="Resultado"
						value="#{movimentacaoInternaBean.pedido.resultado}" 
						validationRequired="true"
						disabled="#{movimentacaoInternaBean.isVisualizacao}"
						rows="10" columns="50"
						maxlength="250" autoResize="true"
						size="#{movimentacaoInternaBean.pedido.resultado.length()+5}" 
						display="text" 
						/>
					<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
					
					<label style="color: #f00;font-size: 12px" align="center" ><strong>Após confirmar esse procedimento não será possível retornar. Deseja Finalizar esse Pedido da Movimentação? </strong></label>
					
						<p:commandButton title="Confirmar" value="Confirmar" icon="ui-icon-check" update="@form :formMovInt" action="#{movimentacaoInternaBean.confirmarFinalizacaoPedido()}" rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna')}">
								 <p:confirm header="Confirmação" message="Finalizar o Pedido?" icon="ui-icon-alert" />
							</p:commandButton>
			 		
				<p:commandButton value="Fechar" onclick="PF('finalizarPedido').hide()" process="@this"/>
				
				<br/>
			</p:panel>
			
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogCacel" header="Cancelar Pedido" showEffect="fade" widgetVar="cancelarPedido" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="cancelarPedForm">
			<p:panel>
			<sgp:formInputTextarea id="motivoCancel" 
						labelValue="Motivo do Cancelamento"
						value="#{movimentacaoInternaBean.pedido.resultado}" 
						validationRequired="true"
						disabled="#{movimentacaoInternaBean.isVisualizacao}"
						rows="10" columns="50"
						maxlength="250" autoResize="true"
						size="#{movimentacaoInternaBean.pedido.resultado.length()+5}" 
						display="text" />
					<br/>
					<br/>
					<p:commandButton title="Salvar" value="Confirmar" icon="ui-icon-check" update="@form :formMovInt" action="#{movimentacaoInternaBean.confirmarCancelamentoPedido()}" rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna')}"/>
			 		
				<p:commandButton value="Fechar" onclick="PF('cancelarPedido').hide()" process="@this"/>
				
				<br/>
			</p:panel>
			
			</h:form>
    	</p:dialog>
    	
    	<p:dialog id="dialogFinalizar" header="Finalizar Movimentação" showEffect="fade" widgetVar="finalizarMovimentacao" modal="true" draggable="false" resizable="false" closeOnEscape="true">
       		<h:form id="finalizarForm">
			<p:panel>
			<sgp:formInputTextarea id="resultadoMov" 
						labelValue="Resultado"
						value="#{movimentacaoInternaBean.movimentacao.resultado}" 
						validationRequired="true"
						disabled="#{movimentacaoInternaBean.isVisualizacao}"
						rows="10" columns="50"
						maxlength="250" autoResize="true"
						size="#{movimentacaoInternaBean.movimentacao.resultado.length()+5}" 
						display="text" />
						
					<br/>
					<br/>
					<p:commandButton title="Confirmar" value="Confirmar" icon="ui-icon-check" update="@form :formMovInt" action="#{movimentacaoInternaBean.confirmarFinalizacaoMovimentacao()}" rendered="#{securityUtil.possuiPermissao('FinalizarMovimentacaoInterna')}" />
			 		
				<p:commandButton value="Fechar" onclick="PF('finalizarMovimentacao').hide()" process="@this"/>
				
				<br/>
			</p:panel>
			</h:form>
    	</p:dialog>
	</ui:define>
</ui:composition>
