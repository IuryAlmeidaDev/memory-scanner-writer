                                        <p:radioButton id="renovacao" for="radioCredenciar" itemIndex="1"
                                                       style="float: right"/>
                                    </div>
                                    <div class="ui-g-8 " style="float: left">
                                        <h:outputLabel for="renovacao" value="Renovação"
                                                       style="float: left; padding-top: 3px;"/>
                                    </div>
                                </div>
                            </div>
                        </h:panelGroup>

                    </h:panelGroup>

                    <div class="ui-g-6">
                        <sgp:formCalendar display="text" labelValue="Data do Despacho"
                                          value="#{faseDoCredenciamentoBean.faseDoCredenciamento.dataDespacho}"
                                          styleFormLabelColumn="width:180px;" validationRequired="true"
                                          rendered="#{faseDoCredenciamentoBean.faseDoCredenciamento.faseCredenciamento eq 'ANALISE' or faseDoCredenciamentoBean.faseDoCredenciamento.faseCredenciamento eq 'APROVACAO'}"
                                          disabled="#{faseDoCredenciamentoBean.isVisualizacao}"/>
                    </div>

                    <div class="ui-g-6">
                    <h:panelGroup  id="data" >
                        <sgp:formCalendar display="text" labelValue="Data de Validade visita"
                                          value="#{faseDoCredenciamentoBean.credenciamento.dataValidade}"
                                          styleFormLabelColumn="width:180px;" validationRequired="#{faseDoCredenciamentoBean.faseDoCredenciamento.statusCredenciamento eq 'APROVADO'}"                                        
   										  rendered="#{faseDoCredenciamentoBean.faseDoCredenciamento.faseCredenciamento eq 'APROVACAO' and faseDoCredenciamentoBean.faseDoCredenciamento.statusCredenciamento eq 'APROVADO'}"
                                          disabled="#{faseDoCredenciamentoBean.isVisualizacao or faseDoCredenciamentoBean.telaOrigem == 2 }"/>
                         </h:panelGroup>
                    </div>

                    <div class="ui-g-12">
                        <sgp:formSelectOneMenu rendered="#{faseDoCredenciamentoBean.faseDoCredenciamento ne null}"
                                labelValue="Situação Credenciamento" temSelecione="true"
                                value="#{faseDoCredenciamentoBean.faseDoCredenciamento.statusCredenciamento}"
                                validationRequired="true" display="text"
                                itemsValue="#{faseDoCredenciamentoBean.statusCredenciamentos}"
                                itemValue="#{item}"
                                styleFormLabelColumn="width:180px;"
                                itemLabel="#{item.descricao}"
                                disabled="#{faseDoCredenciamentoBean.isVisualizacao}">
                            <p:ajax event="change" process="@this" update="observacao data"/>
                        </sgp:formSelectOneMenu>
                    </div>

                    <h:panelGroup styleClass="ui-g-12" id="observacao">
                        <sgp:formInputTextarea labelValue="Observação"
                                               value="#{faseDoCredenciamentoBean.faseDoCredenciamento.observacao}"
                                               rows="10"
                                               columns="50"
                                               maxlength="250"
                                               autoResize="true"
                                               display="text"
                                               requiredMessage="Observação obrigatória para credenciamento com situação irregular!"
                                               styleFormLabelColumn="width:180px;"
                                               validationRequired="#{(faseDoCredenciamentoBean.faseDoCredenciamento.statusCredenciamento eq 'IRREGULAR') or (faseDoCredenciamentoBean.faseDoCredenciamento.statusCredenciamento eq 'NAO_APROVADO')}"
                                               disabled="#{faseDoCredenciamentoBean.isVisualizacao}"/>
                    </h:panelGroup>

                    <div class="ui-g-12 "></div>
                    <div class="ui-g-12 "></div>

                    <div class="ui-g-12 ">
                        <h:panelGroup styleClass="ui-g" id="panelBotoes">
                            <div class="ui-g-2">
                                <p:button value="Voltar" icon="ui-icon-arrowreturnthick-1-w"
                                          outcome="#{faseDoCredenciamentoBean.getRetornoTela()}"
                                          style="width: 100%">
                                    <f:param name="id" value="#{faseDoCredenciamentoBean.visitante.id}"/>
                                </p:button>
                            </div>
                            <div class="ui-g-2">
                                <p:commandButton value="Salvar" icon="ui-icon-disk" style="width: 100%"
                                                 update="@form" process="@form" action="#{faseDoCredenciamentoBean.salvar()}"
                                                 rendered="#{!faseDoCredenciamentoBean.isVisualizacao}"/>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>
            </p:panel>
        </h:form>

        <p:confirmDialog global="true">
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"
                             icon="ui-icon-check"/>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no"
                             icon="ui-icon-close"/>
        </p:confirmDialog>
    </ui:define>
</ui:composition>
