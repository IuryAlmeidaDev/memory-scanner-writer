	                                          </p:dataGrid>
	                                      </p:overlayPanel>
	                                  </p:column>
	                                  <p:column style="text-align: center">
	                                      <p:graphicImage id="bioAD" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
	                                      <p:overlayPanel for="bioAD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO))}">
	                                          <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.ANELAR_DIREITO)}" var="f">
	                                              <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
	                                                  <f:param name="hashId" value="#{f.id}" />
	                                              </p:graphicImage>
	                                          </p:dataGrid>
	                                      </p:overlayPanel>
	                                  </p:column>
	                              </p:row>
	
	                              <p:row>
	                                  <p:column style="font-weight: bold;">Mínimo</p:column>
	                                  <p:column style="text-align: center" rowspan="1">
	                                      <p:graphicImage id="bioMIE" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
	                                      <p:overlayPanel for="bioMIE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_ESQUERDO))}">
	                                          <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MINIMO_ESQUERDO)}" var="f">
	                                              <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
	                                                  <f:param name="hashId" value="#{f.id}" />
	                                              </p:graphicImage>
	                                          </p:dataGrid>
	                                      </p:overlayPanel>
	                                  </p:column>
	                                  <p:column style="text-align: center">
	                                      <p:graphicImage id="bioMID" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
	                                      <p:overlayPanel for="bioMID" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_DIREITO))}">
	                                          <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MINIMO_DIREITO)}" var="f">
	                                              <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
	                                                  <f:param name="hashId" value="#{f.id}" />
	                                              </p:graphicImage>
	                                          </p:dataGrid>
	                                      </p:overlayPanel>
	                                  </p:column>
	                              </p:row>
	                          </p:panelGrid>
	                        </center>
	                      </h:panelGroup>
	                      	
	                    <h:panelGroup styleClass="ui-g-12" id="btnValidarBiometria">
	                    <p:remoteCommand name="retornoBiometria" actionListener="#{visitanteBean.retornoOperacaoBiometrica()}" />
	                        <div class="ui-g">
	                            <div class="ui-g-2">
	                                <p:button outcome="pretty:ListarVisitante" value="Voltar" style="width: 100%;"
	                                          icon="ui-icon-arrowreturnthick-1-w">
	                                    <f:param name="list" value="1"/>
	                                </p:button>
	                            </div>
	                            <div class="ui-g-6"></div>
	                              <div class="ui-g-2">
	                                <p:commandButton value="Autorizar sem Biometria" icon="ui-icon-bio"
	                                	action="${visitanteBean.abrirDlgAutorizar}"
	                                        style="width: 205px; margin-left:-40px;"   />
	                            </div>
	                            <div class="ui-g-2">
	                                <p:commandButton value="Validar Biometria" icon="ui-icon-check" styleClass="botaoBiometrico" onclick="capturar(); return false;"
	                                        style="float: right; width: 100%;" />
	                            </div>
	                        </div>
	                    </h:panelGroup>                            
                    
                    </div>
                </p:panel>
            </h:form>
            </p:panel>

            <h:form prependId="false" rendered="#{visitanteBean.cadastroTipoVisita}" id="tipoVisitaTornarVisitante">
                <p:panel>
                    <div class="ui-g">
                        <h:panelGroup styleClass="ui-g-12" id="tipoVisita">
                            <sgp:formSelectOneMenu
                                    id="categoria" labelValue="Tipo Visita"
                                    value="#{visitanteBean.tipoVisita}"
                                    itemsValue="#{visitanteBean.tipoVisitas}"
                                    itemValue="#{item}"
                                    itemLabel="#{item.descricao}"
                                    temSelecione="true"
                                    validationRequired="true"
                                    converter="SimpleEntityConverter"
                                    display="text"
                                    disabled="#{visitanteBean.isVisualizacao}">
                                <p:ajax update="infoRec, addRecuperando, table, profissao, unidade, btnTipoVisita" event="change"
                                        process="tipoVisita" listener="#{visitanteBean.selecionarTipoVisita()}"/>
                            </sgp:formSelectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup styleClass="ui-g-12" id="profissao">
                            <sgp:formInputText labelValue="Profissão" display="text"   
                                                 value="#{visitanteBean.profissao}"
                                                 validationRequired="true" maxlength="255"
                                                 size="100"
                                                 rendered="#{visitanteBean.tipoVisita ne null and visitanteBean.tipoVisita.tipoEntrada == 'ENTRADA_SAIDA'}"/>
                        </h:panelGroup>

                        <h:panelGroup styleClass="ui-g-12" id="unidade">
                            <sgp:formSelectOneMenu
                                    labelValue="Unidade Prisional"
                                    value="#{visitanteBean.unidadePrisional}"
                                    itemsValue="#{visitanteBean.unidades}"
                                    itemValue="#{item}"
                                    itemLabel="#{item.nome}"
                                    temSelecione="true"
                                    validationRequired="true"
                                    converter="SimpleEntityConverter"
                                    display="text"
                                    filter="true"
                                    filterMatchMode="custom"
                                    filterFunction="removeAcento"
                                    rendered="#{visitanteBean.tipoVisita ne null and visitanteBean.tipoVisita.tipoEntrada == 'ENTRADA_SAIDA'}"
                            />
                        </h:panelGroup>

                        <h:panelGroup id="infoRec">
                            <h:panelGroup styleClass="ui-g-12" id="addRecuperando" rendered="#{visitanteBean.tipoVisita.obrigatorioRecuperando eq 'S'}">
                                <h:outputLabel value="Recuperando:" style="margin-right: 5px;"/>

                                <p:commandButton title="Adicionar Recuperando" icon="ui-icon-plus"
                                                 value="Adicionar" process="@this"
                                                 actionListener="#{visitanteBean.abrirDialogRecuperando}"
                                                 rendered="#{not visitanteBean.isVisualizacao}"
                                                 disabled="#{visitanteBean.tipoVisita eq null
                                                                or visitanteBean.tipoVisita.obrigatorioRecuperando eq 'N'}">
                                    <p:ajax event="dialogReturn" listener="#{visitanteBean.associarRecuperando}"
                                            update="table, dialog, btnTipoVisita"/>
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup id="table" styleClass="ui-g-12" rendered="#{visitanteBean.tipoVisita.obrigatorioRecuperando eq 'S'}">
                                <p:dataTable value="#{visitanteBean.credenciamentos}"
                                             emptyMessage="Nenhum recuperando adicionado."
                                             var="recuperando" paginatorAlwaysVisible="false" rows="5" paginator="true"
                                             paginatorPosition="bottom" lazy="true">

                                    <p:column headerText="Matrícula">
                                        <h:outputText value="#{recuperando.recuperando.id}"/>
                                    </p:column>

                                    <p:column headerText="Nome Recuperando">
                                        <h:outputText value="#{recuperando.recuperando.pessoa.nome}"/>
                                    </p:column>

                                    <p:column headerText="Unidade">
                                        <h:outputText value="#{recuperando.recuperando.unidadeAtual}"/>
                                    </p:column>

                                    <p:column headerText="Tipo Visitação">
                                        <h:outputText value="#{recuperando.tipoVisita.descricao}"/>
                                    </p:column>

                                    <p:column style="width:100px;">
                                        <center>
                                            <p:commandButton rendered="#{!visitanteBean.isVisualizacao}" title="Remover"
                                                             icon="ui-icon-trash" process="@this"
                                                             update="table, btnTipoVisita"
                                                             action="#{visitanteBean.credenciamentos.remove(recuperando)}">
                                                <f:attribute name="recuperando" value="#{recuperando}"/>
                                            </p:commandButton>
                                        </center>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup styleClass="ui-g-12" id="btnTipoVisita">
                            <div class="ui-g">
                                <div class="ui-g-2">
                                    <p:button outcome="pretty:ListarVisitante" value="Voltar" style="width: 100%;"
                                              icon="ui-icon-arrowreturnthick-1-w">
                                        <f:param name="list" value="1"/>
                                    </p:button>
                                </div>
                                <div class="ui-g-8"></div>
                                <div class="ui-g-2">
                                    <p:commandButton value="Próximo" icon="fa fa-arrow-right"
                                                     style="float: right; width: 100%;"
                                                     action="#{visitanteBean.proximoCadastroTipoVisita()}"
                                                     disabled="#{visitanteBean.credenciamentos.isEmpty() and visitanteBean.tipoVisita.obrigatorioRecuperando eq 'S'}"
                                                     process="@form" update="panelTipoVisita, panelDadosVisita, panelTornarVisitante"/>
                                </div>
                            </div>
                        </h:panelGroup>
                    </div>
                </p:panel>
            </h:form>
            </div>
        </h:panelGroup>

        <h:panelGroup id="panelDadosVisita">
            <ui:include src="include/dadosVisitante.xhtml"/>
        </h:panelGroup>

        <ui:include src="dialog/selecionarParente.xhtml"/>

        <p:confirmDialog global="true">
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"
                             icon="ui-icon-check"/>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no"
                             icon="ui-icon-close"/>
        </p:confirmDialog>
        
        
    </ui:define>
</ui:composition>
