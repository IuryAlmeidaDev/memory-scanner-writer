<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pe="http://primefaces.org/ui/extensions"
                xmlns:sgp="http://sejudh.mt.gov.br/components">

    <div id="divRegistroBiometrico" style="display: inline;">
        <h:form prependId="false" id="formBio">
            <p:remoteCommand name="retornoBiometria" actionListener="#{visitanteBean.retornoOperacaoBiometrica()}" update=":tabView:biometriaCapturada" />
        </h:form>
    </div>
    
		<style type="text/css">
		.singleLine
		{
		    table-layout: fixed;
		    word-wrap: break-word;
		}
		</style>

    <h:form id="tabView" rendered="#{visitanteBean.cadastroDadosVisitante}" >
        <p:wizard id="wizard" widgetVar="wizard" showNavBar="false" flowListener="#{visitanteBean.onFlowProcess}">
            <p:tab id="tabDados" title="Dados" >
                <p:panel>
                    <div class="ui-g">
                        <div class="ui-g-8">
                            <sgp:formInputText
                                    display="text" id="nomePessoa" labelValue="Nome"
                                    value="#{visitanteBean.visitante.pessoa.nome}" validationRequired="true"
                                    size="40" disabled="#{visitanteBean.disableDadosVisitante}" maxlength="80"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"/>

                            <sgp:formInputText
                                    display="text" id="nomeMae"
                                    labelValue="Nome da Mãe" value="#{visitanteBean.visitante.pessoa.nomeMae}"
                                    validationRequired="true" size="40" maxlength="80"
                                    disabled="#{visitanteBean.disableDadosVisitante}"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"/>

                            <sgp:formInputText
                                    display="text" id="nomePai"
                                    labelValue="Nome do Pai" value="#{visitanteBean.visitante.pessoa.nomePai}"
                                    size="40" maxlength="80" disabled="#{visitanteBean.disableDadosVisitante}"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"/>

                            <sgp:formCalendar
                                    display="text" labelValue="Nascimento"
                                    value="#{visitanteBean.visitante.pessoa.dataNascimento}"
                                    validationRequired="true" disabled="#{visitanteBean.disableDadosVisitante}"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;">
                                <p:ajax event="dateSelect" listener="#{visitanteBean.selecionarEmancipado()}" update="tabView:emancipado, tabView:panelResponsavel"/>
                                <p:ajax event="change" listener="#{visitanteBean.selecionarEmancipado()}" update="tabView:emancipado, tabView:panelResponsavel"/>
                            </sgp:formCalendar>

                            <h:panelGroup id="emancipado">
                                <sgp:formSelectOneMenu
                                        labelValue="Emancipado?" temSelecione="true"
                                        value="#{visitanteBean.visitante.emancipado}"
                                        validationRequired="true"
                                        display="text"
                                        requiredMessage="Emancipado é obrigatório."
                                        itemsValue="#{comboHelperBean.simNao}"
                                        itemValue="#{item}"
                                        rendered="#{visitanteBean.exibirEmancipado()}"
                                        disabled="#{visitanteBean.disableDadosVisitante}"
                                        itemLabel="#{item.descricao}" styleFormLabelColumn="width: 160px"
                                        style="width: 400px;">
                                    <p:ajax listener="#{visitanteBean.selecionarEmancipado()}"
                                            update="tabView:panelResponsavel"  process="@this" />
                                </sgp:formSelectOneMenu>
                            </h:panelGroup>

                            <sgp:formSelectOneMenu
                                    display="text" id="nacionalidade"
                                    labelValue="Nacionalidade" itemValue="#{item}" temSelecione="true"
                                    itemLabel="#{item.descricao}" itemsValue="#{comboHelperBean.nacionalidades}"
                                    value="#{visitanteBean.visitante.pessoa.nacionalidade}" filter="true"
                                    filterMatchMode="custom" filterFunction="removeAcento"
                                    converter="SimpleEntityConverter" validationRequired="true"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    disabled="#{visitanteBean.disableDadosVisitante}">
                                <f:ajax event="change" listener="#{visitanteBean.alterarNacionalidade}"
                                        render="tabView:pais:input tabView:estado:input tabView:naturalidade:input"/>
                            </sgp:formSelectOneMenu>

                            <sgp:formSelectOneMenu
                                    display="text" id="pais"
                                    labelValue="País de Origem" itemValue="#{item}" temSelecione="true"
                                    itemLabel="#{item.nome}" itemsValue="#{comboHelperBean.paises}"
                                    value="#{visitanteBean.visitante.pessoa.pais}" filter="true"
                                    filterMatchMode="custom" filterFunction="removeAcento"
                                    converter="SimpleEntityConverter" validationRequired="true"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    disabled="#{visitanteBean.disableDadosVisitante or !visitanteBean.pessoaEhEstrangeira()}">
                                <f:ajax event="change"
                                        render="tabView:estado:input tabView:naturalidade:input"/>
                            </sgp:formSelectOneMenu>

                            <sgp:formSelectOneMenu
                                    display="text" id="estado"
                                    labelValue="Estado" itemValue="#{item}" itemLabel="#{item.nome}"
                                    temSelecione="true"
                                    disabled="#{visitanteBean.disableDadosVisitante or visitanteBean.pessoaEhEstrangeira()}"
                                    itemsValue="#{comboHelperBean.estados}"
                                    value="#{visitanteBean.estado}" filter="true" filterMatchMode="custom"
                                    filterFunction="removeAcento"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    converter="EstadoConverter" validationRequired="true">
                                <f:ajax event="change" listener="#{visitanteBean.listarCidades}"
                                        render="tabView:naturalidade:input"/>
                            </sgp:formSelectOneMenu>

                            <sgp:formSelectOneMenu
                                    display="text" id="naturalidade"
                                    labelValue="Naturalidade" itemValue="#{item}" itemLabel="#{item.nome}"
                                    temSelecione="true"
                                    disabled="#{visitanteBean.disableDadosVisitante or visitanteBean.pessoaEhEstrangeira()}"
                                    itemsValue="#{visitanteBean.cidades}"
                                    value="#{visitanteBean.visitante.pessoa.naturalidade}" filter="true"
                                    filterMatchMode="custom" filterFunction="removeAcento"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    converter="SimpleEntityConverter" validationRequired="true"/>

                            <sgp:formSelectOneMenu
                                    display="text" labelValue="Sexo" itemValue="#{item}"
                                    temSelecione="true"
                                    value="#{visitanteBean.visitante.pessoa.sexo}"
                                    itemsValue="#{comboHelperBean.sexos}" validationRequired="true"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    itemLabel="#{item.descricao}" disabled="#{visitanteBean.disableDadosVisitante}"/>

                            <sgp:formSelectOneMenu
                                    display="text" temSelecione="true"
                                    labelValue="Identidade de Gênero" itemValue="#{item}"
                                    itemLabel="#{item.descricao}"
                                    disabled="#{visitanteBean.disableDadosVisitante}"
                                    itemsValue="#{comboHelperBean.identidadeDeGenero}"
                                    value="#{visitanteBean.visitante.identidadeDeGenero}" filter="true"
                                    filterMatchMode="custom" filterFunction="removeAcento"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    converter="SimpleEntityConverter"/>

                            <sgp:formInputText
                                    display="text" id="nomeSocial"
                                    labelValue="Nome Social" value="#{visitanteBean.visitante.pessoa.nomeSocial}"
                                    size="40" maxlength="80"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    disabled="#{visitanteBean.disableDadosVisitante}"/>

                            <sgp:formSelectOneMenu
                                    id="pne"
                                    temSelecione="true"
                                    labelValue="PNE?"
                                    value="#{visitanteBean.visitante.pne}"
                                    itemsValue="#{comboHelperBean.simNao}"
                                    itemValue="#{item}"
                                    validationRequired="true"
                                    styleFormLabelColumn="width: 160px" style="width: 400px;"
                                    disabled="#{visitanteBean.disableDadosVisitante}"
                                    itemLabel="#{item.descricao}"
                                    display="text">
                                <f:ajax event="change" render="tabView:pnePermanente"/>
                            </sgp:formSelectOneMenu>

                            <h:panelGroup id="pnePermanente">
                                <sgp:formSelectOneMenu
                                        labelValue="Permanente?" temSelecione="true"
                                        value="#{visitanteBean.visitante.pnePermanente}"
                                        disabled="#{visitanteBean.disableDadosVisitante}"
                                        validationRequired="true"
                                        display="text"
                                        itemsValue="#{comboHelperBean.simNao}"
                                        itemValue="#{item}"
                                        rendered="#{visitanteBean.visitante.pne eq 'S'}"
                                        styleFormLabelColumn="width: 160px" style="width: 400px;"
                                        itemLabel="#{item.descricao}"/>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-4">
                            <div class="ui-g">
                                <h:panelGroup styleClass="ui-g-12" id="panelFoto">
                                    <center>
                                        <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1"
                                                    value="#{visitanteBean.visitante.fotoFrenteAtual}"
                                                    emptyMessage="Sem foto de frente." var="f">
                                            <p:graphicImage value="#{imageHandlerBean.getImagemVisitante(f.imagem)}"
                                                            cache="false" width="180" height="240">
                                                <f:param name="hashId" value="#{f.imagem.id}" />
                                            </p:graphicImage>
                                        </p:dataGrid>
                                    </center>
                                </h:panelGroup>

                                <div class="ui-g-12">


                                    <h:panelGroup id="biometriaCapturada">
                                        <pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.BiometriaTipoDedo" var="TipoDedo" allSuffix="ALL_ENUM_VALUES" />
                                        <center>
                                            <p:panelGrid rendered="#{visitanteBean.visitante.pessoa.biometria.dedos.size() gt 0 or visitanteBean.visitante.pessoa.biometria.id gt 0 or true}" style="border-width:1px; border-style:solid; margin-bottom: 15px">
                                                <f:facet name="header">
                                                    <p:row>
                                                        <p:column colspan="3">
                                                            <h:outputText value="Biometria capturada em: "/>
                                                            <h:outputText value="#{visitanteBean.visitante.pessoa.biometria.dataCaptura}">
                                                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                                                            </h:outputText>
                                                        </p:column>
                                                    </p:row>
                                                    <p:row>
                                                        <p:column colspan="1"/>
                                                        <p:column colspan="1">Esquerda</p:column>
                                                        <p:column colspan="1">Direita</p:column>
                                                    </p:row>
                                                </f:facet>
                                                <p:row>
                                                    <p:column style="font-weight: bold;">Polegar</p:column>
                                                    <p:column style="text-align: center" rowspan="1">
                                                        <p:graphicImage id="bioPE" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioPE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_ESQUERDO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                    <p:column style="text-align: center">
                                                        <p:graphicImage id="bioPD" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioPD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_DIREITO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                </p:row>

                                                <p:row>
                                                    <p:column style="font-weight: bold;">Indicador</p:column>
                                                    <p:column style="text-align: center" rowspan="1">
                                                        <p:graphicImage id="bioIE" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioIE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_ESQUERDO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.INDICADOR_ESQUERDO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                    <p:column style="text-align: center">
                                                        <p:graphicImage id="bioID" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioID" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.INDICADOR_DIREITO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.INDICADOR_DIREITO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                </p:row>

                                                <p:row>
                                                    <p:column style="font-weight: bold;">Médio</p:column>
                                                    <p:column style="text-align: center" rowspan="1">
                                                        <p:graphicImage id="bioME" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioME" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_ESQUERDO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MEDIO_ESQUERDO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                    <p:column style="text-align: center">
                                                        <p:graphicImage id="bioMD" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioMD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MEDIO_DIREITO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MEDIO_DIREITO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                </p:row>

                                                <p:row>
                                                    <p:column style="font-weight: bold;">Anelar</p:column>
                                                    <p:column style="text-align: center" rowspan="1">
                                                        <p:graphicImage id="bioAE" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioAE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_ESQUERDO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.ANELAR_ESQUERDO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                    <p:column style="text-align: center">
                                                        <p:graphicImage id="bioAD" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioAD" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.ANELAR_DIREITO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.ANELAR_DIREITO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                </p:row>

                                                <p:row>
                                                    <p:column style="font-weight: bold;">Mínimo</p:column>
                                                    <p:column style="text-align: center" rowspan="1">
                                                        <p:graphicImage id="bioMIE" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_ESQUERDO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioMIE" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_ESQUERDO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MINIMO_ESQUERDO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                    <p:column style="text-align: center">
                                                        <p:graphicImage id="bioMID" name="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_DIREITO) ? 'green.png' : 'red.png')}" library="icons"/>
                                                        <p:overlayPanel for="bioMID" my="right bottom" at="left top" showEvent="mouseover" hideEvent="mouseout" appendToBody="true" rendered="#{(visitanteBean.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.MINIMO_DIREITO))}">
                                                            <p:dataGrid layout="tabular" style="width: 188px" columns="1" rows="1" value="#{visitanteBean.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.MINIMO_DIREITO)}" var="f">
                                                                <p:graphicImage value="#{imageHandlerBean.getImagem(f)}" cache="false" width="180" height="240">
                                                                    <f:param name="hashId" value="#{f.id}" />
                                                                </p:graphicImage>
                                                            </p:dataGrid>
                                                        </p:overlayPanel>
                                                    </p:column>
                                                </p:row>
                                            </p:panelGrid>
                                        </center>
                                    </h:panelGroup>

                                    <p:panel header="Autorização de cadastro sem biometria" id="autorizadorBiometria" rendered="#{visitanteBean.visitante.autorizacaoCadastroSemBiometria != null}">
                                        <sgp:formOutputLabel labelValue="Autorizador" value="#{visitanteBean.visitante.autorizacaoCadastroSemBiometria.usuario.servidor.nome}" />
                                        <sgp:formOutputLabel labelValue="Observação" value="#{visitanteBean.visitante.autorizacaoCadastroSemBiometria.observacao}" />
                                        <sgp:formOutputLabel labelValue="Data" value="#{visitanteBean.visitante.autorizacaoCadastroSemBiometria.dataAutorizacao}" converterData="true" />
                                    </p:panel>
                                </div>

                                <h:panelGroup styleClass="ui-g-12" rendered="#{not visitanteBean.isVisualizacao}">
                                    <center>
                                        <p:commandButton value="Capturar Foto" process="@this" icon="fa fa-camera"
                                                         actionListener="#{visitanteBean.abrirDialogFoto}" style="width: 200px;">
                                            <p:ajax event="dialogReturn" listener="#{visitanteBean.associarFoto}" update="panelFoto" />
                                        </p:commandButton>
                                        <p:commandButton value="Capturar Biometria"  icon="ui-icon-bio" styleClass="botaoBiometrico"
                                                         style="width: 200px;" id="btnBio" disabled="#{visitanteBean.disableDadosVisitante}"
                                                         onclick="registrar(#{visitanteBean.visitante.pessoa.id}); return false;"/>

										<p:remoteCommand global="false" autoRun="true" id="rcBiometria" oncomplete="validar_leitor();" process="@this btnBio" rendered="#{visitanteBean.cadastroDadosVisitante}" />
                                    </center>
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>

                    <br/>
                    <br/>
                </p:panel>
                <br/>
                <p:panel id="panelResponsavel" rendered="#{visitanteBean.tituloPagina ne 'Novo Credenciamento'}">
                    <div class="ui-g">
                        <div class="ui-g-12">
                            <h4>Visitante Responsável</h4>
                        </div>
                        <h:panelGroup styleClass="ui-g-12">
                            <p:commandButton value="Adicionar" actionListener="#{visitanteBean.novoResponsavel()}"
                                             process="@this" style="width: 150px;"
                                             disabled="#{not(visitanteBean.visitante.emancipado == 'N' and visitanteBean.exibirEmancipado())}">
                                <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirResponsavel}"
                                        update="panelResponsavel"/>
                            </p:commandButton>
                        </h:panelGroup>
                        <h:panelGroup styleClass="ui-g-12" rendered="#{visitanteBean.visitante.responsavel ne null and visitanteBean.exibirEmancipado()}">
       			             <div class="ui-g">
							    <div class="ui-g-8">
									<h:outputLabel value="Nome:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.nome}" />						
								<div>
									<h:outputLabel value="Nome da Mãe:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.nomeMae}" />
								</div>								
								<div>
									<h:outputLabel value="Dt. Nascimento:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.dataNascimento}" converterData="true" >
									<f:convertDateTime pattern="dd/MM/yyyy"/>
									</h:outputLabel>									
								</div>								
								<div>
									<h:outputLabel value="Nome do Pai:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.nomePai}"/>
								</div>							
								<div>
									<h:outputLabel value="Emancipado:" style="width: 150px;"  rendered="#{visitanteBean.visitante.responsavel.emancipado == 'N'}" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.emancipado.descricao}" rendered="#{visitanteBean.visitante.responsavel.emancipado == 'N'}"/>
								</div>								
								<div>
									<h:outputLabel value="Nacionalidade:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.nacionalidade.descricao}"/>
								</div>								
								<div>
									<h:outputLabel value="Pais de Origem:" style="width: 150px;"  />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.pais.nome}" />
								</div>
								<div>
									<h:outputLabel value="Estado:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.naturalidade.estado.nome}"/>
								</div>								
								<div>
									<h:outputLabel value="Cidade:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.naturalidade.nome}"/>
								</div>								
								<div>
									<h:outputLabel value="Sexo:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.sexo.descricao}"/>
								</div>								
								<div>
									<h:outputLabel value="Ident. Gênero:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.identidadeDeGenero.descricao}" rendered="#{visitanteBean.visitante.identidadeDeGenero ne null}"/>
								</div>								
								<div>
									<h:outputLabel value="Nome Social:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.nomeSocial}"/>
								</div>
								<div>
									<h:outputLabel value="PNE:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pne.descricao}"/>
								</div>
								<div>
									<h:outputLabel value="Permanente:" style="width: 150px;" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pnePermanente.descricao}"/>
								</div>
								<div>
									<h:outputLabel value="Profissão:" style="width: 150px;" rendered="#{visitanteBean.visitante.pessoa.recuperando.profissao ne null}" />
									<h:outputLabel value="#{visitanteBean.visitante.responsavel.pessoa.recuperando.profissao}"/>
								</div>
								</div>
									<div class="ui-g-4">
										<p:dataGrid layout="tabular" style="width: 188px; margin-right: 100px ;  margin-bottom: 100px;" columns="1"
											rows="1" value="#{visitanteBean.visitante.responsavel.fotoFrenteAtual}"
											emptyMessage="Sem foto de frente." var="f">
											<p:graphicImage
												value="#{imageHandlerBean.getImagem(f.imagem)}"
												cache="false" width="180" height="240">
												<f:param name="hashId" value="#{f.imagem.id}" />
											</p:graphicImage>
										</p:dataGrid>
									</div>
                            </div>
                        </h:panelGroup>
                    </div>
                </p:panel>
            </p:tab>
            

            <p:tab id="tabDocumentos" title="Documentos">
                <p:panel>
                    <p:commandButton title="Adicionar Documento" icon="ui-icon-plus" value="Adicionar"
                                     actionListener="#{visitanteBean.novoDocumento()}"
                                     process="@this" disabled="#{visitanteBean.isVisualizacao}">
                        <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirDocumento}" update="documentos"/>
                    </p:commandButton>

                    <br/>
                    <br/>

                    <p:dataTable  id="documentos" var="doc" emptyMessage="Nenhum documento adicionado."
                                 value="#{visitanteBean.visitante.visitanteDocumentos}" rows="5" paginator="true"
                                 paginatorAlwaysVisible="false" paginatorPosition="bottom" sortBy="#{doc.id}">
                        <p:column headerText="Tipo" width="124">
                            <h:outputText id="tipoDocumento" value="#{doc.documento.tipoDocumento.descricao}"/>
                        </p:column>
                        <p:column styleClass="singleLine" headerText="Número" width="60">
                            <h:outputText value="#{doc.documento.numero}"/>
                        </p:column>
                        <p:column styleClass="singleLine" headerText="Descrição" width="136">
                            <h:outputText id="descricao" value="#{doc.documento.descricao}"
                                        />
                        </p:column>
                        <p:column headerText="Emissão" width="68">
                            <h:outputText value="#{doc.documento.dataEmissao}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Validade" width="68">
                            <h:outputText value="#{doc.documento.dataValidade}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        <p:column width="60">
                            <center>
                                <p:commandButton title="Alterar Documento" icon="ui-icon-pencil"
                                                 actionListener="#{visitanteBean.alterarDocumento(doc)}"
                                                 process="@this" disabled="#{visitanteBean.isVisualizacao}">
                                    <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirDocumento}"
                                            update="documentos"/>
                                </p:commandButton>

                                <p:commandButton action="#{visitanteBean.excluirDocumento(doc)}" immediate="true"
                                                 icon="ui-icon-trash" title="Excluir"
                                                 rendered="#{!visitanteBean.isVisualizacao}"
                                                 update="documentos">
                                    <p:confirm header="Confirmação" message="Deseja excluir o documento?"
                                               icon="ui-icon-alert"/>
                                </p:commandButton>
                            </center>
                        </p:column>
                    </p:dataTable>

                    <br/>
                </p:panel>
            </p:tab>

            <p:tab id="tabEnderecos" title="Endereços">
                <p:panel>
                    <p:commandButton title="Adicionar Endereço" icon="ui-icon-plus" value="Adicionar"
                                     actionListener="#{visitanteBean.novoEndereco()}" process="@this"
                                     disabled="#{visitanteBean.isVisualizacao}">
                        <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirEndereco}" update="enderecos"/>
                    </p:commandButton>

                    <br/>
                    <br/>
                    <p:dataTable id="enderecos" var="endereco" emptyMessage="Nenhum endereço adicionado."
                                 value="#{visitanteBean.visitante.pessoa.enderecos}" rows="5" paginator="true"
                                 paginatorAlwaysVisible="false" paginatorPosition="bottom" sortBy="#{endereco.id}">
                        <p:column styleClass="singleLine" headerText="Logradouro" width="120">
                            <h:outputText id="logradouro" value="#{endereco.logradouro}"/>
                        </p:column>
                        <p:column headerText="Nº" width="50">
                            <h:outputText value="#{endereco.numero}"/>
                        </p:column>
                        <p:column styleClass="singleLine" headerText="Bairro" width="130">
                            <h:outputText id="bairro" value="#{endereco.bairro}"/>
                        </p:column>
                        <p:column styleClass="singleLine" headerText="Complemento" width="120">
                            <h:outputText id="complemento" value="#{endereco.complemento}"/>
                        </p:column>
                        <p:column headerText="Cidade" width="120">
                            <h:outputText id="cidade" value="#{endereco.cidade.nome}"/>
                            <p:tooltip for="cidade" value="#{endereco.cidade.nome}"/>
                        </p:column>
                        <p:column headerText="UF" width="20">
                            <h:outputText value="#{endereco.cidade.estado.uf}"/>
                        </p:column>
                        <p:column width="60">
                            <center>
                                <p:commandButton title="Alterar Endereço" icon="ui-icon-pencil"
                                                 actionListener="#{visitanteBean.alterarEndereco(endereco)}"
                                                 process="@this" disabled="#{visitanteBean.isVisualizacao}">
                                    <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirEndereco}"
                                            update="enderecos"/>
                                </p:commandButton>

                                <p:commandButton action="#{visitanteBean.excluirEndereco(endereco)}" immediate="true"
                                                 icon="ui-icon-trash" title="Excluir"
                                                 rendered="#{!visitanteBean.isVisualizacao}"
                                                 update="enderecos">
                                    <p:confirm header="Confirmação" message="Deseja excluir o endereço?"
                                               icon="ui-icon-alert"/>
                                </p:commandButton>
                            </center>
                        </p:column>
                    </p:dataTable>

                    <br/>
                </p:panel>
            </p:tab>

            <p:tab id="tabContatos" title="Contatos">
                <p:panel>
                    <p:commandButton title="Adicionar Contato" icon="ui-icon-plus" value="Adicionar"
                                     actionListener="#{visitanteBean.novoContato()}"
                                     process="@this" disabled="#{visitanteBean.isVisualizacao}">
                        <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirContato}" update="contatos"/>
                    </p:commandButton>

                    <br/>
                    <br/>
                    <p:dataTable id="contatos" var="contato" emptyMessage="Nenhum contato adicionado."
                                 value="#{visitanteBean.visitante.pessoa.contatos}" rows="5" paginator="true"
                                 paginatorAlwaysVisible="false" paginatorPosition="bottom" sortBy="#{contato.id}">
                        <p:column headerText="Nome" width="120">
                            <h:outputText value="#{contato.nome}"/>
                        </p:column>
                        <p:column headerText="Tipo" width="100">
                            <h:outputText value="#{contato.tipoContato.descricao}"/>
                        </p:column>
                        <p:column headerText="Valor" width="120">
                            <h:outputText value="#{contato.valor}"/>
                        </p:column>
                        <p:column styleClass="singleLine" headerText="Observação" width="120">
                            <h:outputText value="#{contato.observacao}"/>
                        </p:column>
                        <p:column width="60">
                            <center>
                                <p:commandButton title="Alterar Contato" icon="ui-icon-pencil"
                                                 actionListener="#{visitanteBean.alterarContato(contato)}"
                                                 process="@this" disabled="#{visitanteBean.isVisualizacao}">
                                    <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirContato}"
                                            update="contatos"/>
                                </p:commandButton>

                                <p:commandButton action="#{visitanteBean.excluirContato(contato)}" immediate="true"
                                                 icon="ui-icon-trash" title="Excluir"
                                                 rendered="#{!visitanteBean.isVisualizacao}"
                                                 update="contatos">
                                    <p:confirm header="Confirmação" message="Deseja excluir o Contato?"
                                               icon="ui-icon-alert"/>
                                </p:commandButton>
                            </center>
                        </p:column>
                    </p:dataTable>

                    <br/>
                </p:panel>
            </p:tab>

            <p:tab id="tabCertidoes" title="Certidões">
                <p:panel>
                    <p:commandButton title="Adicionar Certidão" icon="ui-icon-plus" value="Adicionar"
                                     actionListener="#{visitanteBean.novaCertidao()}"
                                     process="@this" disabled="#{visitanteBean.isVisualizacao}">
                        <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirCertidao}" update="certidoes"/>
                    </p:commandButton>

                    <br/>
                    <br/>
                    <p:dataTable id="certidoes" var="certidao" emptyMessage="Nenhuma certidão adicionada."
                                 value="#{visitanteBean.visitante.certidoes}" rows="5" paginator="true"
                                 paginatorAlwaysVisible="false" paginatorPosition="bottom" sortBy="#{certidao.id}">
                        <p:column headerText="Descrição" width="60%">
                            <h:outputText value="#{certidao.certidao.descricao}"/>
                        </p:column>
                        <p:column headerText="Entregue pelo Visitante?" width="15%">
                            <h:outputText value="#{certidao.entregue.descricao}"/>
                        </p:column>
                        <p:column headerText="Obrigatório?" width="15%">
                            <h:outputText value="#{certidao.obrigatorio.descricao}"/>
                        </p:column>
                        <p:column width="10%">
                            <center>
                                <p:commandButton title="Alterar Certidão" icon="ui-icon-pencil"
                                                 actionListener="#{visitanteBean.alterarCertidao(certidao)}"
                                                 process="@this" disabled="#{visitanteBean.isVisualizacao}">
                                    <p:ajax event="dialogReturn" listener="#{visitanteBean.incluirCertidao}"
                                            update="certidoes"/>
                                </p:commandButton>

                                <p:commandButton action="#{visitanteBean.excluirCertidao(certidao)}" immediate="true"
                                                 icon="ui-icon-trash" title="Excluir"
                                                 update="certidoes">
                                    <p:confirm header="Confirmação" message="Deseja excluir a certidão?"
                                               icon="ui-icon-alert"/>
                                </p:commandButton>
                            </center>
                        </p:column>
                    </p:dataTable>

                    <br/>
                </p:panel>
            </p:tab>
        </p:wizard>

        <div class="ui-g-12 ui-g-nopad">
            <h:panelGroup styleClass="ui-g " id="panelBotoes">
                <div class="ui-g-2">
                    <p:commandButton value="Voltar" icon="fa fa-arrow-left" style="float: left; width: 100%;"
                                     process="@this" onclick="PF('wizard').back();"
                                     update="panelDadosVisita"/>
                </div>
                <div class="ui-g-8"></div>
                <div class="ui-g-2">
                    <p:commandButton id="btnNext" value="Próximo" icon="fa fa-arrow-right"
                                     style="float: right; width: 100%;" onclick="PF('wizard').next();"/>
                </div>
            </h:panelGroup>
        </div>
    </h:form>

    <h:form id="formAutCadBio" prependId="false">
        <p:dialog id="dialogAutorizacaoBiometria" dynamic="true" header="Autorização para cadastro SEM BIOMETRIA" showEffect="fade" widgetVar="dlgAutBio" modal="true" draggable="false"
                  resizable="false" closeOnEscape="true">
            <h:panelGroup id="divAut">
                <sgp:formInputText id="login" labelValue="Login" maxlength="11" minlength="4" value="#{visitanteBean.loginUsuarioAutorizador}" validationRequired="true"
                                   display="text" requiredMessage="*"/>
                <sgp:formInputPassword id="senha" labelValue="Senha" maxlength="15" display="text" requiredMessage="*"
                                       value="#{visitanteBean.senhaUsuarioAutorizador}" validationRequired="true" />
                <sgp:formInputTextarea id="observacao" labelValue="Observação" value="#{visitanteBean.observacaoUsuarioAutorizador}"
                                       columns="40" maxlength="250" display="text" requiredMessage="*" validationRequired="true" />

                <br/><br/><br/>
                <p:commandButton value="Autorizar" update="divAut, mensagens" action="#{visitanteBean.autorizarCadastroSemBiometria()}" icon="ui-icon-disk" />
                <p:commandButton value="Fechar" onclick="PF('dlgAutBio').hide()" immediate="true"/>
            </h:panelGroup>
        </p:dialog>
    </h:form>

    <p:confirmDialog widgetVar="confirmaCadBio" header="CADASTRAR VISITANTE SEM BIOMETRIA" message="Para realizar o cadastro SEM BIOMETRIA é necessária a autorização de um responsável, deseja continuar?">
        <p:commandButton value="Sim" type="button" onclick="PF('confirmaCadBio').hide(); PF('dlgAutBio').show();" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
        <p:commandButton value="Não" type="button" onclick="PF('confirmaCadBio').hide();" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
    </p:confirmDialog>

    <p:confirmDialog global="true" header="Atenção"
                     widgetVar="confirmResponsavelDialog" message="Visitante Responsável é obrigatório para Emancipado: Não">
        <p:commandButton value="OK" type="button" styleClass="ui-confirmdialog-yes" onclick="PF('confirmResponsavelDialog').hide();"/>
    </p:confirmDialog>

    <p:dialog id="confirmAoMenosUmEnderecoObrigatorio" header="Atenção!" showEffect="fade"
              widgetVar="confirmAoMenosUmEnderecoObrigatorio" modal="true"
              draggable="false" resizable="false" closeOnEscape="true">

        <div class="ui-g">
            <div class="ui-g-12">
                <i class="fa fa-exclamation-triangle"></i> Endereço obrigatório!
            </div>
        </div>

        <f:facet name="footer">
            <p:commandButton value="OK" type="button" styleClass="ui-confirmdialog-yes" onclick="PF('confirmAoMenosUmEnderecoObrigatorio').hide();"/>
        </f:facet>
    </p:dialog>

    <p:dialog id="confirmObrigatorioDocumento" header="Atenção!" showEffect="fade"
              widgetVar="confirmObrigatorioDocumento" modal="true"
              draggable="false" resizable="false" closeOnEscape="true">

        <div class="ui-g">
            <ui:repeat value="#{visitanteBean.documentosDescricao}" var="doc">
                <div class="ui-g-12">
                    #{doc}
                </div>
            </ui:repeat>
        </div>

        <f:facet name="footer">
            <p:commandButton value="OK" type="button" styleClass="ui-confirmdialog-yes" onclick="PF('confirmObrigatorioDocumento').hide();"/>
        </f:facet>
    </p:dialog>

    <p:dialog id="confirmObrigatorioCertidao" header="Atenção!" showEffect="fade"
              widgetVar="confirmObrigatorioCertidao" modal="true"
              draggable="false" resizable="false" closeOnEscape="true">

        <div class="ui-g">
            <div class="ui-g-12">
                <i class="fa fa-exclamation-triangle"></i> Certidão obrigatório!
            </div>
            <ui:repeat value="#{visitanteBean.certidoesDescricao}" var="cert">
                <div class="ui-g-12">
                    #{cert}
                </div>
            </ui:repeat>
        </div>

        <f:facet name="footer">
            <p:commandButton value="OK" type="button" styleClass="ui-confirmdialog-yes" onclick="PF('confirmObrigatorioCertidao').hide();"/>
        </f:facet>
    </p:dialog>

    <h:form id="formAutCadBio2" prependId="false">
        <p:dialog id="dialogAutorizacaoBiometria2" dynamic="true" header="Autorização para cadastro SEM BIOMETRIA" showEffect="fade" widgetVar="dlgAutBio2" modal="true" draggable="false"
                  resizable="false" closeOnEscape="true">
            <h:panelGroup id="divAut2">
                <sgp:formInputText id="login2" labelValue="Login" maxlength="11" minlength="4" value="#{visitanteBean.loginUsuarioAutorizador}" validationRequired="true"
                                   display="text" requiredMessage="*"/>
                <sgp:formInputPassword id="senha2" labelValue="Senha" maxlength="15" display="text" requiredMessage="*"
                                       value="#{visitanteBean.senhaUsuarioAutorizador}" validationRequired="true" />
                <sgp:formInputTextarea id="observacao2" labelValue="Observação" value="#{visitanteBean.observacaoUsuarioAutorizador}"
                                       columns="40" maxlength="250" display="text" requiredMessage="*" validationRequired="true" />

                <br/><br/><br/>
                <p:commandButton value="Autorizar" update="divAut, mensagens" action="#{visitanteBean.validarCadastroSemBiometria()}" icon="ui-icon-disk" />
                <p:commandButton value="Fechar" onclick="PF('dlgAutBio').hide()" immediate="true"/>
            </h:panelGroup>
        </p:dialog>
    </h:form>

</ui:composition>
