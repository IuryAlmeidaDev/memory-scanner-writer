<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Fornecedor</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarFornecedor" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarFornecedor')}"/>
		</h:form>
		<br/><br/>
		
		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="fornecedor" value="#{fornecedorBean.fornecedores}" emptyMessage="Nenhum registro encontrado."
				rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{fornecedor.id}">
				<p:column headerText="Código" style="width:100px;" sortBy="#{fornecedor.id}">
					<h:outputText value="#{fornecedor.id}" />
				</p:column>
				<p:column headerText="CNPJ" sortBy="#{fornecedor.cnpj}">
					<h:outputText value="#{fornecedor.cnpj}" />
				</p:column>
				<p:column headerText="Nome Fantasia" sortBy="#{fornecedor.nomeFantasia}" width="150">
					<h:outputText value="#{fornecedor.nomeFantasia}" />
				</p:column>
				<p:column headerText="Razão Social" sortBy="#{fornecedor.razaoSocial}">
					<h:outputText value="#{fornecedor.razaoSocial}" />
				</p:column>
				<p:column headerText="Ações" style="width:150px;">
					<center>
						<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:Visualizarfornecedor" rendered="#{securityUtil.possuiPermissao('Visualizarfornecedor')}">
							<f:param name="id" value="#{fornecedor.id}" />
						</p:button>
						<p:button title="Editar" icon="ui-icon-pencil" outcome="pretty:Alterarfornecedor" rendered="#{securityUtil.possuiPermissao('Alterarfornecedor')}">
							<f:param name="id" value="#{fornecedor.id}" />
						</p:button>
					</center>
				</p:column>
				
				<f:facet name="footer">
					Total de registros: #{fornecedorBean.fornecedores.rowCount}
				</f:facet>
			</p:dataTable>

			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>

	</ui:define>
</ui:composition>
