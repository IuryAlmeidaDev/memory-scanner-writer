<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="conteudo">
		
		<h3>NServer</h3>
		
		<h:form>
			<p:poll interval="5" listener="#{nServerBean.checkStatus}" async="true" global="false" update=":formStatusNserver" />
		</h:form>
		<h:form id="formStatusNserver">
			<p:outputLabel value="Status NServer: " />
			<p:graphicImage id="situacao" name="#{(nServerBean.statusNServer ? 'green.png' : 'red.png')}" library="icons"/>
			<br/>
			<p:outputLabel value="Total de templates no NServer: " for="totalMemoria"/>
			<h:outputText id="totalMemoria" value="#{nServerBean.countMemoria}" />
			<br/>
			<p:outputLabel value="Total de templates em UserTbl: " for="totalUserTbl"/>
			<h:outputText id="totalUserTbl" value="#{nServerBean.countUserTbl}" />
			<br/>
			<p:outputLabel value="Total de templates em Pessoa: " for="totalPessoa"/>
			<h:outputText id="totalPessoa" value="#{nServerBean.countPessoa}" />
		</h:form>
		
		<h:form id="formExcluir">
			<br/>
			<p:panel header="Excluir Template">
				<p:inputText title="IdPessoa" value="#{nServerBean.idPessoa}" /><br/><br/>
				<p:commandButton icon="ui-icon" value="Excluir" action="#{nServerBean.excluir}" update="@form :mensagens  :userTbl :pessoas" />
			</p:panel>
		</h:form>
		<h:form id="formImportar">
			<br/>
			<p:panel header="Importar Template">
				<p:inputText title="IdPessoa" value="#{nServerBean.idPessoa}" /><br/><br/>
				<p:commandButton icon="ui-icon" value="Importar" action="#{nServerBean.importar}" update="@form :mensagens :userTbl :pessoas" />
			</p:panel>
		</h:form>
		
		<h:form>
			<br/>
			<p:commandButton icon="ui-icon" value="Atualizar grids" action="#{nServerBean.carregarListas}" update=":userTbl :pessoas" />
		</h:form>
		
		<h:form id="userTbl">
			<br/>
			<p:dataTable id="dataTable" var="user" value="#{nServerBean.userTblList}" rows="10" paginator="true" paginatorPosition="bottom" sortBy="#{user.pessoa_id}"
			             emptyMessage="Nenhum registro encontrado." paginatorAlwaysVisible="false">
				<f:facet name="header">
					Templates que estão na UserTbl e não estão em Pessoa (com biometria coletada)
				</f:facet>
				<p:column headerText="Template Id" sortBy="#{user.id}">
					<h:outputText value="#{user.id}" />
				</p:column>
				<p:column headerText="Pessoa Id" sortBy="#{user.pessoa_id}">
					<h:outputText value="#{user.pessoa_id}" />
				</p:column>
			</p:dataTable>
		</h:form>
		
		<h:form id="pessoas">
			<br/>
			<p:dataTable id="dataTable" var="pessoa" value="#{nServerBean.pessoaList}" rows="10" paginator="true" paginatorPosition="bottom" sortBy="#{pessoa.id}"
			             emptyMessage="Nenhum registro encontrado." paginatorAlwaysVisible="false">
				<f:facet name="header">
					Pessoas com biometria que não estão na UserTbl
				</f:facet>
				<p:column headerText="Pessoa Id" width="120" sortBy="#{pessoa.id}">
					<h:outputText value="#{pessoa.id}" />
				</p:column>
				<p:column headerText="Bio Id" width="120" sortBy="#{pessoa.biometria_id}">
					<h:outputText value="#{pessoa.biometria_id}" />
				</p:column>
				<p:column headerText="Recup. Id" width="120" sortBy="#{pessoa.matricula}">
					<h:outputText value="#{pessoa.matricula}" />
				</p:column>
				<p:column headerText="Visit. Id"  width="120" sortBy="#{pessoa.codigo_visitante}">
					<h:outputText value="#{pessoa.codigo_visitante}" />
				</p:column>
				<p:column headerText="Nome" sortBy="#{pessoa.nome}">
					<h:outputText value="#{pessoa.nome}" />
				</p:column>
				<p:column headerText="Nome da mãe" sortBy="#{pessoa.nomeMae}">
					<h:outputText value="#{pessoa.nomeMae}" />
				</p:column>
				<p:column headerText="Data de Nascimento" width="170" sortBy="#{pessoa.dataNascimento}">
					<h:outputText value="#{pessoa.dataNascimento}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
