<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>#{funcaoBean.tituloPagina} Função</h3>
			<h:form>
				<p:panel footer="Cadastrado por: #{funcaoBean.funcao.autorRegistro.usuario} em #{funcaoBean.funcao.autorRegistro.data} | Última alteração: #{funcaoBean.funcao.autorUltimaAlteracao.usuario} em #{funcaoBean.funcao.autorUltimaAlteracao.data}">
					<sgp:formInputText 
						id="nomeFuncao"
						labelValue="Nome"
						value="#{funcaoBean.funcao.nome}"
						validationRequired="true"
						disabled="#{funcaoBean.isVisualizacao}"
						maxlength="80"
						display="text"
						styleFormLabelColumn="width:140px"/>
						
					<sgp:formSelectOneMenu 
						id="cargo" labelValue="Cargo" 
						value="#{funcaoBean.funcao.cargo}" 
						itemsValue="#{funcaoBean.cargos}" 
						itemValue="#{item}"
						itemLabel="#{item.nome}" 
						temSelecione="true" 
						validationRequired="true" 
						display="text"
						disabled="#{funcaoBean.isVisualizacao}"
						converter="SimpleEntityConverter"
						styleFormLabelColumn="width:140px"/>
					
						
					<sgp:formSelectOneMenu 
						id="escolta" labelValue="Lotação Obrigatória?"
						value="#{funcaoBean.funcao.lotacaoObrigatoria}"
						validationRequired="true"
						temSelecione="true"
						disabled="#{funcaoBean.isVisualizacao}"
						display="text"
						styleFormLabelColumn="width:140px">
						<f:selectItem itemLabel="Sim" itemValue="true" />
						<f:selectItem itemLabel="Não" itemValue="false" />
					</sgp:formSelectOneMenu>
											
					<sgp:formSelectOneMenu
						id="status"
						labelValue="Status"
						value="#{funcaoBean.funcao.status}" 
						itemsValue="#{comboHelperBean.status}" 
						itemValue="#{item}" 
						itemLabel="#{item.descricao}" 
						disabled="#{funcaoBean.isVisualizacao}"
						styleFormLabelColumn="width:140px"/>
			
					<br/>
					<br/>
					<p:commandButton value="Salvar" action="#{funcaoBean.salvar()}"	update="@form" icon="ui-icon-disk" 
					rendered="#{(securityUtil.possuiPermissao('CadastrarFuncao') and !funcaoBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarFuncao') and !funcaoBean.isVisualizacao)}" />
					<p:button outcome="pretty:ListarFuncao" value="Voltar" icon="ui-icon-arrowreturnthick-1-w">
						<f:param name="list" value="1"/>
					</p:button>
				</p:panel>
			</h:form>
	</ui:define>
</ui:composition>
