<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		<h3>Perfil</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarPerfil" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarPerfil')}" />
		</h:form>


		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta"/>
				<sgp:formInputText id="pesquisar" labelValue="Nome" value="#{perfilBean.filtro.nome}" />

				<br />
				<br />
				<p:commandButton value="Pesquisar"
					update=":registrosForm"
					process="@form"
					icon="ui-icon-search" />

			</p:panel>
		</h:form>

		<h:form id="registrosForm">
				<p:dataTable id="dataTable" var="perfil" value="#{perfilBean.perfis}" rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{perfil.id}">
					<p:column headerText="Código" style="width:100px;" sortBy="#{perfil.id}">
						<h:outputText value="#{perfil.id}" />
					</p:column>

					<p:column headerText="Nome" sortBy="#{perfil.nome}">
						<h:outputText value="#{perfil.nome}"/>
					</p:column>					
					
					<p:column headerText="Descrição" sortBy="#{perfil.descricao}">
						<h:outputText value="#{perfil.descricao}" />
					</p:column>

					<p:column headerText="Ações" style="width:120px;">
						<center>
							<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarPerfil" rendered="#{securityUtil.possuiPermissao('VisualizarPerfil')}">
								<f:param name="id" value="#{perfil.id}" />
							</p:button>
							<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:AlterarPerfil" rendered="#{securityUtil.possuiPermissao('AlterarPerfil')}">
								<f:param name="id" value="#{perfil.id}" />
							</p:button>
							<p:commandButton action="#{perfilBean.excluir(perfil)}" icon="ui-icon-trash" title="Excluir" update="@form :registrosForm :mensagens" rendered="#{securityUtil.possuiPermissao('ExcluirPerfil')}">
								<p:confirm header="Confirmação" message="Deseja excluir o perfil?" icon="ui-icon-alert" />
							</p:commandButton>
						</center>
					</p:column>
					
					<f:facet name="footer">
						Total de registros: #{perfilBean.perfis.rowCount}
					</f:facet>
				</p:dataTable>

				<p:confirmDialog global="true">
					<p:commandButton value="Sim" type="button"
						styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button"
						styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
