<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
	template="/WEB-INF/pages/_templates/principal.xhtml"
	xmlns:pe="http://primefaces.org/ui/extensions">

	<ui:define name="footer">
		<h:outputScript library="js" name="selectOneMenuFilter.js" />
	</ui:define>
		
	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>#{contratoBean.tituloPagina} Contrato</h3>
		
		<p:panel id="cabecalho" rendered="#{contratoBean.contrato.id>0}" >
			<h:form id="formCabecalho">
					<p:column>
						<sgp:formOutputLabel labelValue="Numero do contrato" value="#{contratoBean.contrato.numContrato}"/>
						<sgp:formOutputLabel labelValue="Fornecedor" value="#{contratoBean.contrato.fornecedor.nomeFantasia}"/>
					</p:column>
				</h:form>
		</p:panel>	
			
		<h:form id="ContratoForm">
			<p:tabView id="tabView" effect="fade" effectDuration="fast" widgetVar="aba" dynamic="true">
				<p:tab title="Contrato" id="tab">	
					<p:panel>
						<h:form id="formContrato">
						
							<sgp:formInputText 
								id="numContrato"
								labelValue="Numero do contrato"
								value="#{contratoBean.contrato.numContrato}"
								validationRequired="true"
								maxlength="150"
								disabled="#{contratoBean.isVisualizacao}"
								display="text"/>
								
								<sgp:formSelectOneMenu 
								id="Fornecedor" labelValue="Fornecedor"	
								value="#{contratoBean.contrato.fornecedor}"							
								itemsValue="#{contratoBean.fornecedores}" 
								itemValue="#{item}"
								itemLabel="#{item.nomeFantasia}" 
								temSelecione="true"
								filter="true" filterMatchMode="custom" filterFunction="removeAcento"
								converter="SimpleEntityConverter"/>		
								
							<sgp:formCalendar display="text" requiredMessage="*" labelValue="Virgencia do contrato"
								value="#{contratoBean.contrato.vigenciaContrato}" dataMaxima="#{comboHelperBean.maxDate}"
								validationRequired="true" disabled="#{pessoaBean.isVisualizacao}" />	
								
							<sgp:formSelectOneMenu 
								id="unidadePrisional" labelValue="Unidade Prisional"
								
								itemsValue="#{contratoBean.unidadesPrisionais}" 
								itemValue="#{item}"
								itemLabel="#{item.nome}" 
								temSelecione="true"
								filter="true" filterMatchMode="custom" filterFunction="removeAcento"
								converter="SimpleEntityConverter"/>				
							
								<br/><br/>
						</h:form>
					</p:panel>
					
					<br/><br/>				
					<p:commandButton value="Salvar" action="#{contratoBean.salvar()}"	update="@form" icon="ui-icon-disk" 
						rendered="#{(securityUtil.possuiPermissao('CadastrarContrato') and !contratoBean.isVisualizacao) or (securityUtil.possuiPermissao('Alterarcontrato') and !contratoBean.isVisualizacao)}" />
					<p:button outcome="pretty:ListarContrato" value="Voltar" icon="ui-icon-arrowreturnthick-1-w">
						<f:param name="list" value="1" />
					</p:button>
				</p:tab>
			</p:tabView>
		</h:form>
    </ui:define>
</ui:composition>
