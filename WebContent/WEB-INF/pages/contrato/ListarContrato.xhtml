<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Contrato</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarContrato" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarContrato')}"/>
		</h:form>
		<br/><br/>
		
		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="contrato" value="#{contratoBean.contratos}" emptyMessage="Nenhum registro encontrado."
				rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{contrato.id}">
				<p:column headerText="Código" style="width:100px;" sortBy="#{contrato.id}">
					<h:outputText value="#{contrato.id}" />
				</p:column>
				<p:column headerText="Numero do contrato" sortBy="#{contrato.numContrato}">
					<h:outputText value="#{contrato.numContrato}" />
				</p:column>
				<p:column headerText="Virgência do contrato" sortBy="#{contrato.vigenciaContrato}" width="150">
					<h:outputText value="#{contrato.vigenciaContrato}" />
				</p:column>
				<p:column headerText="Fornecedor" sortBy="#{contrato.fornecedor.cnpj}">
					<h:outputText value="#{contrato.fornecedor.cnpj}" />
				</p:column>
				<p:column headerText="Ações" style="width:150px;">
					<center>
						<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:Visualizarcontrato" rendered="#{securityUtil.possuiPermissao('VisualizarContrato')}">
							<f:param name="id" value="#{contrato.id}" />
						</p:button>
						<p:button title="Editar" icon="ui-icon-pencil" outcome="pretty:Alterarcontrato" rendered="#{securityUtil.possuiPermissao('AlterarContrato')}">
							<f:param name="id" value="#{contrato.id}" />
						</p:button>
					</center>
				</p:column>
				
				<f:facet name="footer">
					Total de registros: #{contratoBean.contratos.rowCount}
				</f:facet>
			</p:dataTable>

			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>

	</ui:define>
</ui:composition>
