[main]
user = br.gov.mt.sejudh.sigepen.security.SigepenFilter
user.loginUrl = /login

builtInCacheManager = org.apache.shiro.cache.MemoryConstrainedCacheManager
securityManager.cacheManager = $builtInCacheManager
securityManager.rememberMeManager.cipherKey = 0xda5c29c1969cf1c0d59a202de0c9fab3 

dataSource = org.apache.shiro.jndi.JndiObjectFactory
dataSource.requiredType = javax.sql.DataSource  
dataSource.resourceName = java:/sigepen-dev

#jdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm
jdbcRealm = br.gov.mt.sejudh.sigepen.realm.SigepenRealm
jdbcRealm.permissionsLookupEnabled = true 
jdbcRealm.dataSource = $dataSource

jdbcRealm.authenticationQuery = SELECT SENHA, SALT FROM SIGEPEN_OWNER_DES.USUARIO WHERE LOGIN = ?
#jdbcRealm.userRolesQuery = SELECT P.NOME PERFIL FROM SIGEPEN_OWNER_DES.PERFIL P, SIGEPEN_OWNER_DES.USUARIO_PERFIL UP WHERE P.ID = UP.PERFIL_ID AND USUARIO_ID = (SELECT ID FROM SIGEPEN_OWNER_DES.USUARIO WHERE LOGIN = ?)
jdbcRealm.permissionsQuery = SELECT P.NOME PERMISSAO FROM SIGEPEN_OWNER_DES.PERFIL_PERMISSOES PP, SIGEPEN_OWNER_DES.PERMISSAO P WHERE PP.PERFIL_ID = (SELECT ID FROM SIGEPEN_OWNER_DES.PERFIL WHERE NOME = ?) AND PP.PERMISSAO_ID = P.ID

#jdbcRealm.permissionsQuery = SELECT P.NOME PERMISSAO FROM SIGEPEN_OWNER_DES.PERFIL_PERMISSOES PP, SIGEPEN_OWNER_DES.PERMISSAO P, SIGEPEN_OWNER_DES.ACESSO A, SIGEPEN_OWNER_DES.ACESSO_PERFIL AP WHERE PP.PERFIL_ID = (SELECT ID FROM SIGEPEN_OWNER_DES.PERFIL WHERE NOME = ?) AND PP.PERMISSAO_ID = P.ID AND PP.PERFIL_ID = AP.PERFIL_ID AND AP.ACESSO_ID = A.ID AND A.UNIDADE_ID = ?
jdbcRealm.userRolesQuery = SELECT P.NOME PERFIL FROM SIGEPEN_OWNER_DES.ACESSO A, SIGEPEN_OWNER_DES.ACESSO_PERFIL AP, SIGEPEN_OWNER_DES.PERFIL P WHERE A.ID = AP.ACESSO_ID AND AP.PERFIL_ID = P.ID AND A.USUARIO_ID = (SELECT ID FROM SIGEPEN_OWNER_DES.USUARIO WHERE LOGIN = ?) AND (A.UNIDADE_ID = ? OR A.UNIDADE_ID IS NULL)

credentialsMatcher = org.apache.shiro.authc.credential.HashedCredentialsMatcher
credentialsMatcher.hashAlgorithmName = SHA-256
credentialsMatcher.storedCredentialsHexEncoded = false
credentialsMatcher.hashIterations = 200000
jdbcRealm.credentialsMatcher = $credentialsMatcher

securityManager.realms = $jdbcRealm

[urls]
/javax.faces.resource/** = anon
/services/biometria/** = anon
/biometria/** = anon
/** = user