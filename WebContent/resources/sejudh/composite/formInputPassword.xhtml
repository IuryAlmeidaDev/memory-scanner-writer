<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<cc:interface>
	<cc:attribute name="id" required="false"/>
	<cc:attribute name="value" required="false" />
	<cc:attribute name="labelValue" required="true" />
	<cc:attribute name="validationRequired" required="false" type="java.lang.Boolean" />
	<cc:attribute name="maxlength" required="false" />
	<cc:attribute name="match" required="false" />
	<cc:attribute name="display" required="false" />
	<cc:attribute name="requiredMessage" required="false"/>
	<cc:attribute name="validatorMessage" required="false"/>
	<cc:attribute name="validatorId" required="false"/>	
	<cc:attribute name="styleFormLabelColumn" required="false"/>
</cc:interface>

<cc:implementation>

	<div class="form-block">
		<div class="form-label-column" style="#{cc.attrs.styleFormLabelColumn}">
			<h:outputLabel for="input" value="#{cc.attrs.labelValue}:" />
		</div>

		<div class="form-required-column">
			<ui:fragment rendered="#{cc.attrs.validationRequired}">*</ui:fragment>
			<p:spacer width="15px" rendered="#{!cc.attrs.validationRequired}" />
		</div>

		<div class="form-input-column">
			<p:password id="input" value="#{cc.attrs.value}" maxlength="#{cc.attrs.maxlength}"
				required="#{cc.attrs.validationRequired}" label="#{cc.attrs.labelValue}"
				disabled="#{cc.attrs.disabled}" autocomplete="off"
				style="#{cc.attrs.style}">
				
				<c:if test="#{cc.attrs.match ne null}">
					<f:attribute name="match" value="#{cc.attrs.match}" />
				</c:if>
				
				<c:if test="#{cc.attrs.validatorMessage ne null}">
					<f:attribute name="validatorMessage" value="#{cc.attrs.validatorMessage}"/>
				</c:if>
				
				<c:choose>
					<c:when test="#{cc.attrs.requiredMessage ne null}">
						<f:attribute name="requiredMessage" value="#{cc.attrs.requiredMessage}" />
					</c:when>
				</c:choose>
				
						
				<c:if test="#{cc.attrs.validatorId ne null}">
					<f:validator validatorId="#{cc.attrs.validatorId}" for="input" />
				</c:if>
				
			</p:password>
		</div>
		
		<div class="form-error-column">
			<p:message for="input">
				<c:choose>
					<c:when test="#{cc.attrs.display ne null}">
						<f:attribute name="display" value="#{cc.attrs.display}" />
					</c:when>
					<c:otherwise>
						<f:attribute name="display" value="tooltip"/>
					</c:otherwise>
				</c:choose>
			</p:message>
		</div>
	</div>

</cc:implementation>
</html>
