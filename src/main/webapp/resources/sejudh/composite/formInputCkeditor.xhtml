<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:c="http://java.sun.com/jsp/jstl/core">
<cc:interface>
	<cc:attribute name="labelValue" required="true" />
	<cc:attribute name="minlength" default="1" />
	<cc:attribute name="maxlength" />
	<cc:attribute name="toolbar" required="false" default="[['Bold','Italic','Underline','Strike','Font','Format','Copy','Paste','PasteText','PasteFromWord', 'RemoveFormat']]" />
	<cc:attribute name="validationRequired" required="false" default="false" type="java.lang.Boolean" />
	<cc:attribute name="requiredMessage" required="false"/>
	<cc:attribute name="value" required="false" />
	<cc:attribute name="disabled" required="false" />
	<cc:attribute name="style" required="false" />
	<cc:attribute name="display" required="false" />
	<cc:attribute name="styleFormLabelColumn" required="false"/>
</cc:interface>

<cc:implementation>
	<div style="font-size: 98% !important; padding: 5px;">
		<div class="form-label-column" style="clear: both; float: left #{cc.attrs.styleFormLabelColumn}">
			<h:outputLabel for="input" value="#{cc.attrs.labelValue}:" />
		</div>
		<div class="form-required-column" style="float: left">
			<ui:fragment rendered="#{cc.attrs.validationRequired}">* </ui:fragment>
			<p:spacer width="15px" rendered="#{!cc.attrs.validationRequired}" />
		</div>
		<div class="form-input-column" style="float: left">
			<div style="float: none">
				<pe:ckEditor id="input"
							 value="#{cc.attrs.value}"
							 label="#{cc.attrs.labelValue}"
							 readonly="#{cc.attrs.disabled}"
							 required="#{cc.attrs.validationRequired}"
							 enterMode="CKEDITOR.ENTER_BR"
							 requiredMessage="#{cc.attrs.requiredMessage}"
							 toolbar="[['Bold','Italic','Underline','Strike','Font','Format','Copy','Paste','PasteText','PasteFromWord', 'RemoveFormat']]">
					<f:validateLength maximum="#{cc.attrs.maxlength}" />
				</pe:ckEditor>

				<br/><h:outputText id="display" />
			</div>
		</div>
		<div class="form-error-column" style="float: left">
			<p:message for="input">
				<c:choose>
					<c:when test="#{cc.attrs.display ne null}">
						<f:attribute name="display" value="#{cc.attrs.display}" />
					</c:when>
					<c:otherwise>
						<f:attribute name="display" value="tooltip"/>
					</c:otherwise>
				</c:choose>
			</p:message>
		</div>
	</div>
</cc:implementation>
</html>
