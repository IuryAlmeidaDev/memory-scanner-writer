<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<cc:interface>
		<cc:clientBehavior event="change" name="change" default="true" targets="input" />
 		<cc:attribute name="labelValue" required="true" />
 		<cc:attribute name="id" required="false" />
		<cc:attribute name="itemVar" required="false" default="item" />
		<cc:attribute name="itemValue" required="true" />
		<cc:attribute name="itemsValue" required="true" />
		<cc:attribute name="itemLabel" required="true" />
        <cc:attribute name="appendTo" required="false" />
		<cc:attribute name="validationRequired" required="false" type="java.lang.Boolean" />
		<cc:attribute name="validationGroup" required="false" />
		<cc:attribute name="rendered" required="false" type="java.lang.Boolean" />
		<cc:attribute name="disabled" required="false" type="java.lang.Boolean" />
		<cc:attribute name="value" required="false" />
		<cc:attribute name="converter" required="false" />
		<cc:attribute name="styleClass" required="false" />
		<cc:attribute name="filter" required="false" />
		<cc:attribute name="temSelecione" required="false" />
		<cc:attribute name="display" required="false" />
		<cc:attribute name="requiredMessage" required="false"/>
		<cc:attribute name="filterMatchMode" required="false"/>
		<cc:attribute name="filterFunction" required="false"/>
		<cc:attribute name="styleFormLabelColumn" required="false"/>
		<cc:attribute name="style" required="false"/>
</cc:interface>

<cc:implementation>

	<div class="form-block">
		<div class="form-label-column" style="#{cc.attrs.styleFormLabelColumn}">
			<h:outputLabel for="input" value="#{cc.attrs.labelValue}:" />
		</div>

		<div class="form-required-column">
			<ui:fragment rendered="#{cc.attrs.validationRequired}">*</ui:fragment>
			<p:spacer width="15px" rendered="#{!cc.attrs.validationRequired}" />
		</div>

		<div class="form-input-column">

				<p:selectOneMenu
                        style="#{cc.attrs.style}" id="input" label="#{cc.attrs.labelValue}" value="#{cc.attrs.value}"
                        disabled ="#{cc.attrs.disabled}" effect="fade" filter="#{cc.attrs.filter}"
                        required="#{cc.attrs.validationRequired}" appendTo="#{cc.attrs.appendTo}">
					<c:if test="#{cc.attrs.temSelecione ne null and cc.attrs.temSelecione}">
						<f:selectItem itemLabel="Selecione" noSelectionOption="true"/>
					</c:if>
					
					<f:selectItems value="#{cc.attrs.itemsValue}" var="#{cc.attrs.itemVar}" itemLabel="#{cc.attrs.itemLabel}" itemValue="#{cc.attrs.itemValue}" />
					
					<cc:insertChildren />
					
					<f:attribute name="styleClass" value="#{cc.attrs.styleClass}" />
					<c:if test="#{cc.attrs.converter ne null}">
						<f:converter converterId="#{cc.attrs.converter}" />
					</c:if>
					
					<c:choose>
						<c:when test="#{cc.attrs.requiredMessage ne null}">
							<f:attribute name="requiredMessage" value="#{cc.attrs.requiredMessage}" />
						</c:when>
					</c:choose>

					<c:if test="#{cc.attrs.filterMatchMode ne null}">
						<f:attribute name="filterMatchMode" value="#{cc.attrs.filterMatchMode}" />
					</c:if>
					<c:if test="#{cc.attrs.filterFunction ne null and cc.attrs.filterMatchMode == 'custom'}">
						<f:attribute name="filterFunction" value="#{cc.attrs.filterFunction}" />
					</c:if>
				</p:selectOneMenu>
		</div>
		
		<div class="form-error-column">
			<p:message for="input">
				<c:choose>
					<c:when test="#{cc.attrs.display ne null}">
						<f:attribute name="display" value="#{cc.attrs.display}" />
					</c:when>
					<c:otherwise>
						<f:attribute name="display" value="tooltip"/>
					</c:otherwise>
				</c:choose>
			</p:message>
		</div>
	</div>
</cc:implementation>
</html>
