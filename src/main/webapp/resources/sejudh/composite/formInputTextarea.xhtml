<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:composite="http://java.sun.com/jsf/composite"
>
<cc:interface>
	<cc:attribute name="labelValue" required="true" />
	<cc:attribute name="minlength" default="1" />
	<cc:attribute name="maxlength" />
	<cc:attribute name="autoResize" default="false"/>
	<cc:attribute name="rows" default="5"/>
	<cc:attribute name="columns" default="30"/>
	<cc:attribute name="counter" default="display"/>
	<cc:attribute name="size" />
	<cc:attribute name="validationRequired" required="false" default="false" type="java.lang.Boolean" />
	<cc:attribute name="requiredMessage" required="false"/>
	<cc:attribute name="value" required="false" />
	<cc:attribute name="disabled" required="false" />
	<cc:attribute name="style" required="false" />
	<cc:attribute name="display" required="false" />
	<cc:attribute name="styleFormLabelColumn" required="false"/>
	<cc:clientBehavior name="blur" event="blur" targets="input" />
</cc:interface>

<cc:implementation>
	<div class="form-block">
		<div class="form-label-column" style="#{cc.attrs.styleFormLabelColumn}">
			<h:outputLabel for="input" value="#{cc.attrs.labelValue}:" />
		</div>
		<div class="form-required-column">
			<ui:fragment rendered="#{cc.attrs.validationRequired}">* </ui:fragment>
			<p:spacer width="15px" rendered="#{!cc.attrs.validationRequired}" />
		</div>
		<div class="form-input-column">
			<p:inputTextarea id="input" size="#{cc.attrs.size}" 
				maxlength="#{cc.attrs.maxlength}" value="#{cc.attrs.value}"
				label="#{cc.attrs.labelValue}"
				disabled="#{cc.attrs.disabled}"
				autoResize="#{cc.attrs.autoResize}"
				required="#{cc.attrs.validationRequired}"
				rows="#{cc.attrs.rows}"
				cols="#{cc.attrs.columns}"
				counter="#{cc.attrs.counter}" 
				counterTemplate="{0} caracteres restantes.">
				
				<c:choose>
					<c:when test="#{cc.attrs.requiredMessage ne null}">
						<f:attribute name="requiredMessage" value="#{cc.attrs.requiredMessage}" />
					</c:when>
				</c:choose>
				<composite:insertChildren />
			</p:inputTextarea>
				<br/><h:outputText id="display" />
		</div>
		<div class="form-error-column">
			<p:message for="input">
				<c:choose>
					<c:when test="#{cc.attrs.display ne null}">
						<f:attribute name="display" value="#{cc.attrs.display}" />
					</c:when>
					<c:otherwise>
						<f:attribute name="display" value="tooltip"/>
					</c:otherwise>
				</c:choose>
			</p:message>
		</div>
	</div>
</cc:implementation>
</html>
