<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				xmlns:sgp="http://sejudh.mt.gov.br/components"
				template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
	
	 	<p:growl id="growl" showDetail="true" life="4000" sticky="false" />
	 
		<sgp:validarAcesso />

		<h3>Registro Plantão</h3>

		<!-- Iniciar Plantao -->
		<h:form id="meuFormulario">

			<p:panel header="Início do Plantão">

				<sgp:formSelectOneMenu
						id="slPlantaoIniciado"
						labelValue="Plantão Iniciado"
						value="#{registroPlantaoBean.plantaoSelecionado}"
						disabled="#{registroPlantaoBean.modoVisualizacaoEquipe}"
						style="width:200px;"
						styleInput="width:200px; margin-bottom:15px;">

					<f:selectItem
							itemLabel="Selecione"
							itemValue="" noSelectionOption="true"/>

					<f:selectItems
							value="#{registroPlantaoBean.tiposPlantao}"
							var="p" itemLabel="#{p.descricao}"
							itemValue="#{p}" />

					<p:ajax listener="#{registroPlantaoBean.atualizarPlantaoSelecionado}" update="tabViewPai" />
				</sgp:formSelectOneMenu>


				<br /><br />

				<sgp:formCalendar
						id="dataPlantao"
						labelValue="Data do Plantão"
						value="#{registroPlantaoBean.plantao.dataPlantao}"
						disabled="#{registroPlantaoBean.modoVisualizacaoEquipe}"
						pattern="dd-MM-yyyy HH:mm:ss.SSS"
						style="width:200px;"
						styleInput="width:200px; margin-bottom:15px;">

					<p:ajax event="dateSelect" />
				</sgp:formCalendar>

				<br /><br />

				<sgp:formSelectOneMenu
						labelValue="Status Plantão"
						id="slTipoPlantao"
						value="#{registroPlantaoBean.plantao.statusPlantao}"
						disabled="#{registroPlantaoBean.modoVisualizacaoEquipe}"
						style="width:200px;"
						styleInput="width:200px; margin-bottom:15px;">

					<f:selectItem itemLabel="Não Iniciado" itemValue="#{null}" noSelectionOption="true" />

					<f:selectItems
							value="#{registroPlantaoBean.statusPlantoes}"
							var="status"
							itemValue="#{status}"
							itemLabel="#{status.descricao}" />
				</sgp:formSelectOneMenu>

				<br /><br />

			</p:panel>
		</h:form>


		<h:form id="registrosForm" prependId="false">
			<p:tabView id="tabViewPai" effect="fade" effectDuration="fast"
					   widgetVar="abaPrincipal">

				<!-- Aba Principal - Item Servidores -->
				<ui:include src="Servidor.xhtml" />

				<!-- Aba Principal - Item Alimentos -->
				<!-- <ui:include src="Alimentacao.xhtml" /> -->

				<!-- Aba Principal - Item Visitas -->
				<!-- <ui:include src="Visita.xhtml" /> -->

				<!-- Aba Principal - Item Movimentações -->
				<!-- <ui:include src="Movimentacao.xhtml" /> -->

				<!-- Aba Principal - Item Ocorrencias -->
				<ui:include src="Ocorrencia.xhtml" />

			</p:tabView>
			
			
			<!-- Dialog ocorrencia -->
			<p:dialog header="Ocorrência" widgetVar="dialogOcorrencia" 
			          modal="true" resizable="false" id="dialogOcorrencia">
			    			    
			    <h:panelGroup id="grupoDialogOcorrencia" layout="block">
			        <h:panelGrid columns="1">
			
			            <sgp:formSelectOneMenu 
			                id="slTipoOcorrencia" labelValue="Tipo da Ocorrência"
			                value="#{registroPlantaoBean.ocorrencia.tipoOcorrencia}"
			                converter="SimpleEntityConverter"
			                disabled="#{registroPlantaoBean.modoVisualizacao}"
			                style="width: 250px; margin-bottom: 15px;">
			                			                			
			                <f:selectItem itemLabel="Selecione" itemValue="" noSelectionOption="true" />
			
			                <f:selectItems value="#{registroPlantaoBean.tipoOcorrencias}"
			                               disabled="#{registroPlantaoBean.isVisualizacao}" 
			                               var="t" itemLabel="#{t.tipo}" itemValue="#{t}" />
			
			                <p:ajax event="change" listener="#{registroPlantaoBean.preencherDescricao}" update="descricao" />                           
			            </sgp:formSelectOneMenu>
			
			            <h:outputLabel for="descricao" value="Descrição" />
			            <p:inputText id="descricao" 			            	
			            	value="#{registroPlantaoBean.ocorrencia.descricao}"
			            	disabled="#{registroPlantaoBean.modoVisualizacao}"
			            	style="width: 400px; margin-bottom: 15px;" />
			
			            <h:outputLabel for="dataOcorrencia" value="Data/Hora" />
			            <p:calendar id="dataOcorrencia"
			            	value="#{registroPlantaoBean.ocorrencia.dataOcorrencia}" 
			                pattern="dd/MM/yyyy HH:mm" showTime="true" 
			                disabled="#{registroPlantaoBean.modoVisualizacao}"/><br/>
			            
			            <h:panelGroup rendered="#{not registroPlantaoBean.modoNovo}">
						    <h:outputLabel for="statusOcorrencia" value="Status Ocorrência" /><br />    
						    <p:selectOneMenu id="statusOcorrencia"
						        value="#{registroPlantaoBean.ocorrencia.statusOcorrencia}"
						        disabled="#{registroPlantaoBean.modoVisualizacao}"> 
						    
						        <f:selectItem itemLabel="Selecione" itemValue="" noSelectionOption="true" />
						        <f:selectItems value="#{registroPlantaoBean.statusOcorrencias}"
						            var="status"
						            itemLabel="#{status}" 
						            itemValue="#{status}" />
						    </p:selectOneMenu>
						</h:panelGroup> <br />   
			            
			            <h:outputLabel for="resumo" value="Resumo" />            
			            <p:inputTextarea id="resumo" rows="6" cols="80" 
			            	value="#{registroPlantaoBean.ocorrencia.resumo}"
			            	disabled="#{registroPlantaoBean.modoVisualizacao}"
			            	style="margin-bottom: 15px;"/>
						            
			            <h:panelGroup id="panelDetalhamento" layout="block" rendered="#{registroPlantaoBean.exibirDetalhamento}">
			                <h:outputLabel for="detalhamento" value="Detalhamento:" /><br />
			                <p:inputTextarea id="detalhamento" rows="6" cols="80" 
			                	value="#{registroPlantaoBean.ocorrencia.detalhamento}" 
			                	disabled="#{registroPlantaoBean.modoVisualizacao}"
			                	style="margin-bottom: 15px;"/>
			            </h:panelGroup>
			
			        </h:panelGrid>
			    </h:panelGroup>
			
			    <f:facet name="footer">
			        
			        <p:commandButton value="Detalhamento"
			           actionListener="#{registroPlantaoBean.mostrarDetalhamento}"
			           update="grupoDialogOcorrencia"
			           process="@this" 
			           rendered="#{registroPlantaoBean.modoEdicao}"/>
			
			        <p:commandButton 
					    value="Salvar" 
					    action="#{registroPlantaoBean.salvarOcorrencia}"					    					    					    					    
					    update="@form growl" 
					    oncomplete="PF('dialogOcorrencia').hide()" 
					    rendered="#{registroPlantaoBean.modoEdicao}"/>
					    			        
			        <p:commandButton value="Fechar" 
			            onclick="PF('dialogOcorrencia').hide();" type="button" />
			    </f:facet>
			
			</p:dialog>



			<!-- Dialog  -->
			<p:dialog header="Plantão" widgetVar="dialogAlteracao"
					  modal="true" resizable="false" id="dialogAlteracao">
				<h:panelGrid columns="2">

					<h:outputLabel for="nomeServidor" value="Nome do Servidor:" />
					<h:outputText id="nomeServidor" value="#{registroPlantaoBean.servidorSelecionado.nomeServidor}" />


					<h:outputLabel for="matricula" value="Matrícula:" />
					<h:outputText id="matricula" value="#{registroPlantaoBean.servidorSelecionado.matricula}" readonly="true" />


					<h:outputLabel for="ocorrencia" value="Ocorrência:" />
					<h:selectOneMenu id="ocorrencia" value="#{registroPlantaoBean.servidorSelecionado.ocorrenciaSelecionada}">

						<f:selectItem itemLabel="Troca de posto" itemValue="TROCA_DE_POSTO" />
						<f:selectItem itemLabel="Falta Não Justificada" itemValue="FALTA_NAO_JUSTIFICADA" />
						<f:selectItem itemLabel="Férias" itemValue="FERIAS" />
						<f:selectItem itemLabel="Licença Médica" itemValue="LICENCA_MEDICA" />
						<f:selectItem itemLabel="Licença Premium" itemValue="LICENCA_PREMIUM" />
						<f:selectItem itemLabel="Entrou Atrasado" itemValue="ENTROU_ATRASADO" />
					</h:selectOneMenu>

					<h:outputLabel for="justificativa" value="Justificativa:" />
					<h:inputTextarea id="justificativa"  value="#{registroPlantaoBean.servidorSelecionado.justificativa}"/>

				</h:panelGrid>


				<p:commandButton value="Salvar"
								 action="#{registroPlantaoBean.atualizarRegistroPlantaoServidor()}"
								 update="@form"
								 process="@form" />

			</p:dialog>

		</h:form>



		<!-- Encerrar Plantao -->
		<h:form id="encerrarPLantao">
			<p:panel header="Encerrar PLantão" style="margin-top: 20px;">

				<!-- Próximo Plantão -->
				<sgp:formSelectOneMenu
						labelValue="Próximo Plantao"
						id="slproximoPlantao"
						value="#{registroPlantaoBean.plantaoSelecionado}"
						style="width:200px"
						styleInput="width:200px; margin-bottom:15px;"
						disabled="#{registroPlantaoBean.modoVisualizacaoEquipe}">

					<f:selectItem
							itemLabel="Selecione"
							itemValue="" noSelectionOption="true"/>

					<f:selectItems
							value="#{registroPlantaoBean.tiposPlantao}"
							var="p" itemLabel="#{p.descricao}"
							itemValue="#{p}" />
				</sgp:formSelectOneMenu>

				<br />
				<br />
				<br />
				<br />
				<br />
				<br />
				<br />





				<!-- Botões -->
				<h:panelGroup style="text-align: center; margin-top: 20px;">
					<p:commandButton value="Registrar Encerramento"
									 icon="ui-icon-disk"
									 action="#{registroPlantaoBean.salvar}"
									 update="meuFormulario"
									 style="margin-right: 15px;" />
				</h:panelGroup>


				<br />
				<br />



			</p:panel>

		</h:form>

	</ui:define>
</ui:composition>
