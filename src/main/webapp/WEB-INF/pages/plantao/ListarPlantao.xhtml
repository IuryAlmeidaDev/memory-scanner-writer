<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Livro Plantão</h3>

        <!-- Botão Cadastrar -->
        <h:form>
            <h:panelGroup style="text-align: center; margin-bottom: 15px;">
                <p:button 
                    value="Cadastrar" 
                    outcome="pretty:CadastrarPlantao" 
                    icon="ui-icon-plus" 
                    rendered="#{securityUtil.possuiPermissao('CadastrarPlantao')}" 
                    style="margin-right: 15px;" />
            </h:panelGroup>
        </h:form>

        <!-- Formulário de Consulta -->
        <h:form>
            <h:panelGroup style="margin-top: 20px;">

                <!-- Tipo Plantão -->
                <sgp:formSelectOneMenu
                    labelValue="Plantão"
                    id="plantao"
                    display="text"
                    temSelecione="true"
                    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"  
                    styleInput="width:200px; margin-bottom:15px;">
                    
                    <f:selectItem itemLabel="A" itemValue="A" />
                    <f:selectItem itemLabel="B" itemValue="B" />
                    <f:selectItem itemLabel="C" itemValue="C" />
                    <f:selectItem itemLabel="D" itemValue="D" />
                    <f:selectItem itemLabel="E" itemValue="E" />
                    <f:selectItem itemLabel="GESTAO" itemValue="Gestão" />
                    <f:selectItem itemLabel="ADMINISTRATIVA" itemValue="Administrativa" />
                </sgp:formSelectOneMenu>

                <!-- Status -->
                <sgp:formSelectOneMenu
                    labelValue="Status"
                    id="status"
                    value="#{plantaoBean.filtro.status}"
                    itemsValue="#{comboHelperBean.status}"
                    itemValue="#{item}"
                    itemLabel="#{item.descricao}"
                    temSelecione="true"
                    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"                      
                    styleInput="width:200px; margin-bottom:15px;" />

                <!-- Data -->
                <sgp:formCalendar
                    labelValue="Data"
                    id="dataPlantao"
                    value="#{PlantaoBean.dataPlantao}"
                    pattern="dd/MM/yyyy"
                    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"  
                    styleInput="width:200px; margin-bottom:15px;">
                    <p:ajax event="dateSelect" />
                </sgp:formCalendar>

                <!-- Unidade -->
                <sgp:formSelectOneMenu
                    labelValue="Unidade"
                    id="unidade"
                    value="#{plantaoBean.filtro.unidadePrisional}"
                    itemsValue="#{comboHelperBean.unidadesPrisionais}"
                    itemValue="#{item}"
                    itemLabel="#{item.nome}"
                    display="text"
                    converter="SimpleEntityConverter"
                    temSelecione="true"
                    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"  
                    styleInput="width:200px; margin-bottom:15px;" />

            </h:panelGroup>
            
            <br /><br />

            <!-- Botões de Ação -->
            <h:panelGroup style="text-align: center; margin-top: 20px;">
                <p:commandButton 
                    value="Pesquisar" 
                    icon="ui-icon-search" 
                    style="margin-right: 15px;" />
                <p:commandButton 
                    value="Imprimir" 
                    icon="fa fa-file-pdf-o" />
            </h:panelGroup>
        </h:form>
		
		
		
		<h:form id="registrosForm">
		    <p:dataTable id="dataTable" var="plantao" value="#{plantaoBean.plantoes}"
		        rows="10" paginator="true" paginatorPosition="bottom" lazy="true"
		        sortBy="#{plantao.id}" emptyMessage="Nenhum registro encontrado."
		        style="width: 100%;" responsiveLayout="scroll"
		        rowStyleClass="tabela-linha">
		
		        <!-- Código -->
		        <p:column headerText="Código" style="width: 6%; text-align: center;" sortBy="#{plantao.id}">
		            <h:outputText value="#{plantao.id}" />
		        </p:column>
		
		        <!-- Data -->
		        <p:column headerText="Data" style="width: 10%; text-align: center;" sortBy="#{plantao.dataPlantao}">
		            <h:outputText value="#{plantao.dataPlantao}">
		                <f:convertDateTime pattern="dd/MM/yyyy" />
		            </h:outputText>
		        </p:column>
		
		        <!-- Plantão -->
		        <p:column headerText="Plantão" style="width: 10%; text-align: center;">
		            <h:outputText value="#{plantao.tipoPlantao.descricao}" />
		        </p:column>
		
		        <!-- Unidade -->
		        <p:column headerText="Unidade" style="width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
		            <h:outputText value="#{plantao.unidadePrisional.nome}" />
		        </p:column>
		
		        <!-- Situação -->
		        <p:column headerText="Situação" style="width: 15%; text-align: center;">
		            <h:outputText value="#{plantao.status.descricao}" />
		        </p:column>
		
		        <!-- Ações -->
		        <p:column headerText="Ações" style="width: 25%; text-align: center;">
		            <p:button title="Visualizar" icon="ui-icon-document" style="margin-right: 5px;">
		                <f:param name="id" value="#{plantao.id}" />
		            </p:button>
				           
		            <p:button title="Alterar" icon="ui-icon-pencil">
						<f:param name="id" value="#{plantao.id}" />
					</p:button>				           
		            
		            <p:commandButton action="#{plantaoBean.excluir(plantao)}"	icon="ui-icon-trash" title="Excluir" update="@form :registrosForm :mensagens">
						<p:confirm header="Confirmação" message="Deseja excluir o plantão?" icon="ui-icon-alert" />
					</p:commandButton>
		        </p:column>
		
		        <!-- Rodapé -->
		        <f:facet name="footer">
		            Total de registros: #{plantaoBean.plantoes.rowCount}
		        </f:facet>
		    </p:dataTable>
		    
		    <p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		    		    					
		</h:form>
		
			
	</ui:define>
</ui:composition>
