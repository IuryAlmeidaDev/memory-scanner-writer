<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui" xmlns:sgp="http://sejudh.mt.gov.br/components"
				xmlns:pe="http://primefaces.org/ui/extensions">


	<p:tab title="Servidores" id="tabServidores">
		<p:panel id="panelServidores">
			<p:panel header="Equipe de Gestão" id="panelEquipeGestao">

				<!-- Data Table Listar Servidores e os demais campos -->
				<p:dataTable id="dataTableGestao" var="servidor"
							 value="#{plantaoBean.listaGestao}" rows="10"
							 paginator="true" paginatorPosition="bottom" lazy="true"
							 emptyMessage="Nenhum registro encontrado.">

					<!-- Nome Servidor  -->
					<p:column headerText="Nome do Servidor" width="140">
						<h:outputText value="#{servidor.servidorDTO.nome}" />
					</p:column>

					<!-- Atividade do Servidor  -->
					<p:column headerText="Atividade" width="120">
						<p:selectOneMenu
								value="#{servidor.atividadeSelecionada}"
								id="slAtividadeGestao" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{servidor.atividades}"
										   var="atividade" itemLabel="#{atividade.descricao}"
										   itemValue="#{atividade.descricao}" />
						</p:selectOneMenu>
					</p:column>

					<!-- Situaçao do Servidor  -->
					<p:column headerText="Situação" width="120">
						<p:selectOneMenu
								value="#{servidor.situacaoSelecionada}"
								id="slSituacaoGestao" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{plantaoBean.situacoes}"
										   var="situacao" itemLabel="#{situacao.descricao}"
										   itemValue="#{situacao}" />
						</p:selectOneMenu>
					</p:column>

					<!-- Dialgo Suspenso  -->
					<p:column headerText="Ações" width="40">
						<center>
							<p:commandButton title="Alterar" icon="ui-icon-pencil"
											 actionListener="#{plantaoBean.prepararEdicao(servidor)}"
											 oncomplete="PF('dialogAlteracao').show()"
											 update=":registrosForm:dialogAlteracao"/>
						</center>
					</p:column>

				</p:dataTable>

				<br />
			</p:panel>

			<p:panel header="Equipe de Plantão" id="panelEquipePlantao">

				<!-- Data Table Listar Servidores e os demais campos -->
				<p:dataTable id="dataTableEquipePlantao" var="servidor"
							 value="#{plantaoBean.listaPlantao}" rows="10"
							 paginator="true" paginatorPosition="bottom" lazy="true"
							 emptyMessage="Nenhum registro encontrado.">

					<!-- Nome Servidor  -->
					<p:column headerText="Nome do Servidor" width="140">
						<h:outputText value="#{servidor.servidorDTO.nome}" />
					</p:column>

					<!-- Atividade do Servidor  -->
					<p:column headerText="Atividade" width="120">
						<p:selectOneMenu
								value="#{servidor.atividadeSelecionada}"
								id="slAtividadeEquipePlantao" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{servidor.atividades}"
										   var="atividade" itemLabel="#{atividade.descricao}"
										   itemValue="#{atividade.descricao}" />
						</p:selectOneMenu>
					</p:column>

					<!-- Situaçao do Servidor  -->
					<p:column headerText="Situação" width="120">
						<sgp:formSelectOneMenu
								value="#{servidor.situacaoSelecionada}"
								id="slSituacaoEquipePlantao" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{plantaoBean.situacoes}"
										   var="situacao" itemLabel="#{situacao.descricao}"
										   itemValue="#{situacao}" />
						</sgp:formSelectOneMenu>
					</p:column>

					<!-- Dialgo Suspenso  -->
					<p:column headerText="Ações" width="40">
						<center>
							<p:commandButton title="Alterar" icon="ui-icon-pencil"
											 actionListener="#{plantaoBean.prepararEdicao(servidor)}"
											 oncomplete="PF('dialogAlteracao').show()"
											 update=":registrosForm:dialogAlteracao"/>
						</center>
					</p:column>

				</p:dataTable>
				<br />

			</p:panel>

			<p:panel header="Equipe Administrativa"
					 id="panelEquipeAdministrativa">

				<!-- Data Table Listar Servidores e os demais campos -->
				<p:dataTable id="dataTableAdministrativa" var="servidor"
							 value="#{plantaoBean.listaAdministrativa}" rows="10"
							 paginator="true" paginatorPosition="bottom" lazy="true"
							 emptyMessage="Nenhum registro encontrado.">

					<!-- Nome Servidor  -->
					<p:column headerText="Nome do Servidor" width="140">
						<h:outputText value="#{servidor.servidorDTO.nome}" />
					</p:column>

					<!-- Atividade do Servidor  -->
					<p:column headerText="Atividade" width="120">
						<p:selectOneMenu
								value="#{servidor.atividadeSelecionada}"
								id="slAtividadeAdministrativa" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{servidor.atividades}"
										   var="atividade" itemLabel="#{atividade.descricao}"
										   itemValue="#{atividade.descricao}" />
						</p:selectOneMenu>
					</p:column>


					<!-- Situaçao do Servidor  -->
					<p:column headerText="Situação" width="120">
						<p:selectOneMenu
								value="#{servidor.situacaoSelecionada}"
								id="slSituacaoAdministrativa" temSelecione="true"
								style="width:230px"
								disabled="#{plantaoBean.isVisualizacao}">

							<f:selectItems value="#{plantaoBean.situacoes}"
										   var="situacao" itemLabel="#{situacao.descricao}"
										   itemValue="#{situacao}" />
						</p:selectOneMenu>
					</p:column>


					<!-- Dialgo Suspenso  -->
					<p:column headerText="Ações" width="40">
						<center>
							<p:commandButton title="Alterar" icon="ui-icon-pencil"
											 actionListener="#{plantaoBean.prepararEdicao(f)}"
											 oncomplete="PF('dialogAlteracao').show()"
											 update=":registrosForm:dialogAlteracao"/>
						</center>
					</p:column>

				</p:dataTable>
				<br />

			</p:panel>

			<p:separator style="margin-top:20px" />

			<p:commandButton value="Salvar Equipes"
							 action="#{plantaoBean.salvarTodasEquipes}"
							 icon="ui-icon-disk" style="margin-top:10px"
							 update="tabServidores" />



		</p:panel>
	</p:tab>

	<p:dialog header="Equipe" widgetVar="dialogAlteracao"
			  modal="true" resizable="false" id="dialogAlteracao">
		<h:panelGrid columns="2">

			<h:outputLabel for="nomeServidor" value="Nome do Servidor:" />
			<h:outputText id="nomeServidor" value="#{plantaoBean.servidorSelecionado.nomeServidor}" />


			<h:outputLabel for="matricula" value="Matrícula:" />
			<h:outputText id="matricula" value="#{plantaoBean.servidorSelecionado.matricula}" readonly="true" />


			<h:outputLabel for="ocorrencia" value="Ocorrência:" />
			<h:selectOneMenu id="ocorrencia" value="#{plantaoBean.servidorSelecionado.ocorrenciaSelecionada}">

				<f:selectItem itemLabel="Troca de posto" itemValue="TROCA_DE_POSTO" />
				<f:selectItem itemLabel="Falta Não Justificada" itemValue="FALTA_NAO_JUSTIFICADA" />
				<f:selectItem itemLabel="Férias" itemValue="FERIAS" />
				<f:selectItem itemLabel="Licença Médica" itemValue="LICENCA_MEDICA" />
				<f:selectItem itemLabel="Licença Premium" itemValue="LICENCA_PREMIUM" />
				<f:selectItem itemLabel="Entrou Atrasado" itemValue="ENTROU_ATRASADO" />
			</h:selectOneMenu>

			<h:outputLabel for="justificativa" value="Justificativa:" />
			<h:inputTextarea id="justificativa"  value="#{plantaoBean.servidorSelecionado.justificativa}"/>

		</h:panelGrid>


		<p:commandButton value="Salvar"
						 action="#{plantaoBean.atualizarRegistroPlantaoServidor()}"
						 update="@form"
						 process="@form" />

	</p:dialog>

</ui:composition>
