<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:sgp="http://sejudh.mt.gov.br/components"
    template="/WEB-INF/pages/_templates/principal.xhtml">

    <ui:define name="conteudo">

        <sgp:validarAcesso />

        <h3>Cadastrar Plantão</h3>

        <h:form>

            <!-- Tipo Plantão -->
            <h:panelGroup style="margin-bottom: 15px;">
                <sgp:formSelectOneMenu
                    id="plantao"
                    labelValue="Tipo Plantão"
                    itemValue="#{item}"
                    temSelecione="true"
                    value="#{plantaoBean.plantao.tipoPlantao}"
                    itemsValue="#{comboHelperBean.tipoPlantoes}"
                    itemLabel="#{item.name}"
                    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"  
                    styleInput="width:200px; margin-bottom:15px;"
                    disabled="#{plantaoBean.isVisualizacao}">
                 </sgp:formSelectOneMenu>                    
            </h:panelGroup>

            <!-- Data do Plantão -->
             <h:panelGroup style="margin-bottom: 15px;">
             <sgp:formCalendar
				    id="dataPlantao"
				    labelValue="Data do Plantão"
				    value="#{plantaoBean.plantao.dataPlantao}"
				    validationRequired="true"
                    requiredMessage="*"                       
		            style="width:200px"  
                    styleInput="width:200px; margin-bottom:15px;"
                    disabled="#{plantaoBean.isVisualizacao}"  />
			 </h:panelGroup>
            
            <!-- Unidade -->
             <h:panelGroup style="margin-bottom: 15px;">
		            <sgp:formSelectOneMenu
		                labelValue="Unidade"
		                id="unidade"
		                value="#{plantaoBean.plantao.unidadePrisional}"
		                itemsValue="#{comboHelperBean.unidadesPrisionais}"
		                itemValue="#{item}"
		                itemLabel="#{item.nome}"
		                display="text"
		                converter="SimpleEntityConverter"
		                temSelecione="true"
		                validationRequired="true"
	                    requiredMessage="*"                       
			            style="width:200px"  
	                    styleInput="width:200px; margin-bottom:15px;"
	                    disabled="#{plantaoBean.isVisualizacao}" >
		            </sgp:formSelectOneMenu>
		      </h:panelGroup>

            <!-- Status -->
            <h:panelGroup style="margin-bottom: 15px;">
                <sgp:formSelectOneMenu
                    id="status"
                    labelValue="Status"
                    value="#{plantaoBean.plantao.status}"
                    itemsValue="#{comboHelperBean.status}"
                    itemValue="#{item}"
                    itemLabel="#{item.descricao}"
                    temSelecione="true"
                    validationRequired="true"
	                requiredMessage="*"                       
			        style="width:200px"  
	                styleInput="width:200px; margin-bottom:15px;"
	                disabled="#{plantaoBean.isVisualizacao}" >
	            </sgp:formSelectOneMenu>
            </h:panelGroup>

			<br />
            <!-- Linha de separação -->
            <hr style="margin: 20px 0; border: 1px solid #ccc;" />

            <!-- Botões -->
            <h:panelGroup style="text-align: center; margin-top: 15px;">
                
                <p:commandButton 
			        value="Salvar" 
			        action="#{plantaoBean.salvar()}" 
			        update="@form" 
			        icon="ui-icon-disk" 
			        rendered="#{securityUtil.possuiPermissao('CadastrarCargo') and !cargoBean.isVisualizacao}" 			        
			        style="margin-right:10px;" />
			        
			    <p:button 
			        outcome="pretty:ListarPlantao" 
			        value="Voltar" 
			        icon="ui-icon-arrowreturnthick-1-w">
			        <f:param name="list" value="1" />
			    </p:button>
                
                
                
            </h:panelGroup>

        </h:form>

    </ui:define>
</ui:composition>
