<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui" xmlns:sgp="http://sejudh.mt.gov.br/components"
				xmlns:pe="http://primefaces.org/ui/extensions">


	<p:tab title="Visitas" id="tabVisitas">
		<p:tabView id="tabViewPaiVisita" effect="fade" effectDuration="fast" widgetVar="abaVisitante">

			<p:tab title="Familiar" id="abaVisitanteFamiliar">

				<p:commandButton value="Habilitar Visita" action="#{plantaoBean.habilitarVisitaFamilia}" update="@form"
								 process="@form" style="margin-bottom: 1%;"
								 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" />

				<h:panelGroup layout="block" style="margin-bottom:20px;"
							  rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" id="tableFamiliar">

					<p:messages autoUpdate="true" />

					<h:form id="formularioFamiliar">
						<table class="ui-datatable ui-widget" style="width:100%; border-collapse: collapse;">
							<thead class="ui-datatable-thead ui-widget-header">
							<tr>
								<th style="width: 140px;">Estrutura</th>
								<th style="width: 140px;">Homem</th>
								<th style="width: 140px;">Mulher</th>
								<th style="width: 140px;">Menores</th>
								<th style="width: 140px;">Ocorrência</th>
								<th style="width: 140px;">Hora Início</th>
								<th style="width: 140px;">Hora Fim</th>
							</tr>
							</thead>
							<tbody>
							<tr>
								<td>
									<p:inputText value="#{plantaoBean.plantaoVisitaEstruturaFamilia.estrutura}"
												 required="true"
												 requiredMessage = "Por favor, informe o campo 'Estrutura' "
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="homemFamiliar"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.homem}"
												 required="true"
												 requiredMessage = "Por favor, informe o campo 'Homem'. Apenas números são permitidos."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="mulherFamiliar"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.mulher}"
												 required="true"
												 requiredMessage = "Por favor, informe o campo 'Mulher'. Apenas números são permitidos."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="menores"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.menor}"
												 required="true"
												 requiredMessage = "Por favor, informe o campo 'Menores'. Apenas números são permitidos."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="ocorrenciaFamiliar"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.ocorrencia}"
												 required="true"
												 requiredMessage = "Por favor, informe o campo 'Ocorrência'. Apenas números são permitidos."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputMask id="horaInicioFamiliar"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.horaInicio}"
												 mask="99:99"
												 required="true"
												 requiredMessage = "O campo 'Hora de início' é obrigatório e deve ser informado corretamente."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />

								</td>
								<td>
									<p:inputMask id="horaFimFamiliar"
												 value="#{plantaoBean.plantaoVisitaEstruturaFamilia.horaFim}"
												 mask="99:99"
												 required="true"
												 requiredMessage = "O campo 'Hora de Fim' é obrigatório e deve ser informado corretamente."
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
							</tr>
							</tbody>
						</table>
					</h:form>
				</h:panelGroup>


				<p:commandButton value="salvar Visita" action="#{plantaoBean.salvarVisitaFamilia()}"
								 update="@form tabViewPai:tabViewPaiVisita:dataTableFamilia" process="@form"
								 style="margin-bottom: 1%; margin-top: 1%" disabled="#{plantaoBean.camposDesabilitado}"
								 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" />

				<p:dataTable var="familia" value="#{plantaoBean.plantaoVisitaFamilia}" rows="10" paginator="true"
							 paginatorPosition="bottom" lazy="true" emptyMessage="Nenhum registro encontrado."
							 id="dataTableFamilia">

					<p:column headerText="Estrutura" width="140">
						<h:outputText value="#{familia.estrutura}" />
					</p:column>

					<p:column headerText="Homem" width="140">
						<h:outputText value="#{familia.homem}" />
					</p:column>

					<p:column headerText="Mulher" width="140">
						<h:outputText value="#{familia.mulher}" />
					</p:column>

					<p:column headerText="Menores" width="140">
						<h:outputText value="#{familia.menor}" />
					</p:column>

					<p:column headerText="Ocorrência" width="140">
						<!-- <h:outputText value="#{familia.menor}" /> -->
					</p:column>

					<p:column headerText="Hora inicio" width="140">
						<h:outputText value="#{familia.horaInicio}" />
					</p:column>

					<p:column headerText="Hora fim" width="140">
						<h:outputText value="#{familia.horaFim}" />
					</p:column>
				</p:dataTable>

			</p:tab>

			<p:tab title="Atendimento" id="abaVisitanteAtendimento">

				<p:commandButton value="Habilitar Visita" action="#{plantaoBean.habilitarAtendimento}"
								 update="@form tabViewPai:tabViewPaiVisita:dataTableAtendimento" process="@form"
								 style="margin-bottom: 1%;"
								 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" />

				<h:panelGroup layout="block" style="margin-bottom:20px;"
							  rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}">
					<h:form id="formularioAtendimento">
						<table class="ui-datatable ui-widget" style="width:100%; border-collapse: collapse;">
							<thead class="ui-datatable-thead ui-widget-header">
							<tr>
								<th style="width: 140px;">Estrutura</th>
								<th style="width: 140px;">Homem</th>
								<th style="width: 140px;">Mulher</th>
								<th style="width: 140px;">Menores</th>
								<th style="width: 140px;">Ocorrência</th>
								<th style="width: 140px;">Hora Início</th>
								<th style="width: 140px;">Hora Fim</th>
							</tr>
							</thead>
							<tbody>
							<tr>
								<td>
									<p:inputText id="estruturaAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.estrutura}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="homemAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.homem}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="mulherAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.mulher}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="menoresAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.menor}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="ocorrenciaAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.ocorrencia}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="horaInicioAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.horaInicio}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="horaFimAtendimento"
												 value="#{plantaoBean.plantaoVisitaEstruturaAtendimento.horaFim}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
							</tr>
							</tbody>
						</table>
						<p:commandButton value="salvar Visita" action="#{plantaoBean.salvarVisitaAtendimento()}"
										 update="@form tabViewPai:tabViewPaiVisita:dataTableAtendimento" process="@form" style="margin-bottom: 1%; margin-top: 1%"
										 disabled="#{plantaoBean.camposDesabilitado}"
										 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}">
						</p:commandButton>
					</h:form>

				</h:panelGroup>




				<p:dataTable id="dataTableAtendimento" var="atendimento" value="#{plantaoBean.plantaoVisitaAtendimento}"
							 rows="10" paginator="true" paginatorPosition="bottom" lazy="true"
							 emptyMessage="Nenhum registro encontrado.">

					<p:column headerText="Estrutura" width="140">
						<h:outputText value="#{atendimento.estrutura}" />
					</p:column>

					<p:column headerText="Homem" width="140">
						<h:outputText value="#{atendimento.homem}" />
					</p:column>

					<p:column headerText="Mulher" width="140">
						<h:outputText value="#{atendimento.mulher}" />
					</p:column>

					<p:column headerText="Menores" width="140">
						<h:outputText value="#{atendimento.menor}" />
					</p:column>

					<p:column headerText="Ocorrência" width="140">
						<!-- <h:outputText value="#{atendimento.menor}" /> -->
					</p:column>

					<p:column headerText="Hora inicio" width="140">
						<h:outputText value="#{atendimento.horaInicio}" />
					</p:column>

					<p:column headerText="Hora fim" width="140">
						<h:outputText value="#{atendimento.horaFim}" />
					</p:column>
				</p:dataTable>
			</p:tab>

			<p:tab title="Entrada Saida" id="abaVisitanteEntradaSaida">

				<p:commandButton value="Habilitar Visita" action="#{plantaoBean.habilitarEntradaSaida}" update="@form"
								 process="@form" style="margin-bottom: 1%;"
								 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" />


				<h:panelGroup layout="block" style="margin-bottom:20px;"
							  rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}">
					<h:form id="formularioEntradaSaida">
						<table class="ui-datatable ui-widget" style="width:100%; border-collapse: collapse;">
							<thead class="ui-datatable-thead ui-widget-header">
							<tr>
								<th style="width: 140px;">Estrutura</th>
								<th style="width: 140px;">Homem</th>
								<th style="width: 140px;">Mulher</th>
								<th style="width: 140px;">Menores</th>
								<th style="width: 140px;">Ocorrência</th>
								<th style="width: 140px;">Hora Início</th>
								<th style="width: 140px;">Hora Fim</th>
							</tr>
							</thead>
							<tbody>
							<tr>
								<td>
									<p:inputText id="estruturaEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.estrutura}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="homemEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.homem}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="mulherEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.mulher}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="menoresEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.menor}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="ocorrenciaEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.ocorrencia}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="horaInicioEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.horaInicio}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
								<td>
									<p:inputText id="horaFimEntradaSaida"
												 value="#{plantaoBean.plantaoVisitaEstruturaEntradaSaida.horaFim}"
												 disabled="#{plantaoBean.camposDesabilitado}" style="width: 100%;" />
								</td>
							</tr>
							</tbody>
						</table>
						<p:commandButton value="salvar Visita" action="#{plantaoBean.salvarVisitaEntradaSaida()}"
										 update="@form tabViewPai:tabViewPaiVisita:dataTableEntradaSaida" process="@form"
										 style="margin-bottom: 1%; margin-top: 1%" disabled="#{plantaoBean.camposDesabilitado}"
										 rendered="#{!securityUtil.getUnidadeSelecionada().ativaModuloVisitante}" />

					</h:form>
				</h:panelGroup>

				<p:dataTable id="dataTableEntradaSaida" var="entradaSaida"
							 value="#{plantaoBean.plantaoVisitaEntradaSaida}" rows="10" paginator="true"
							 paginatorPosition="bottom" lazy="true" emptyMessage="Nenhum registro encontrado.">

					<p:column headerText="Estrutura" width="140">
						<h:outputText value="#{entradaSaida.estrutura}" />
					</p:column>

					<p:column headerText="Homem" width="140">
						<h:outputText value="#{entradaSaida.homem}" />
					</p:column>

					<p:column headerText="Mulher" width="140">
						<h:outputText value="#{entradaSaida.mulher}" />
					</p:column>

					<p:column headerText="Menores" width="140">
						<h:outputText value="#{entradaSaida.menor}" />
					</p:column>

					<p:column headerText="Ocorrência" width="140">
						<!-- <h:outputText value="#{entradaSaida.menor}" /> -->
					</p:column>

					<p:column headerText="Hora inicio" width="140">
						<h:outputText value="#{entradaSaida.horaInicio}" />
					</p:column>

					<p:column headerText="Hora fim" width="140">
						<h:outputText value="#{entradaSaida.horaFim}" />
					</p:column>
				</p:dataTable>
			</p:tab>

		</p:tabView>
	</p:tab>

</ui:composition>
