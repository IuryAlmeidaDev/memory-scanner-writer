<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sgp="http://sejudh.mt.gov.br/components"
                template="/WEB-INF/pages/_templates/principal.xhtml">

    <ui:define name="conteudo">
        <sgp:validarAcesso/>

        <div class="sgp-page-header">
            <h3>#{alimentoBean.tituloPagina} Alimento</h3>
        </div>

        <h:form>
            <p:panel styleClass="sgp-card-form">

                <sgp:formInputText
                        id="nomeAlimento"
                        labelValue="Descrição"
                        value="#{alimentoBean.alimento.descricao}"
                        validationRequired="true"
                        disabled="#{alimentoBean.isVisualizacao}"
                        display="text"
                        maxlength="80"/>

                <sgp:formSelectOneMenu
                        id="unidadeMedida"
                        labelValue="Unidade de Medida"
                        value="#{alimentoBean.alimento.unidadeMedida}"
                        itemsValue="#{comboHelperBean.unidadesMedida}"
                        itemValue="#{item}"
                        itemLabel="#{item.descricao}"
                        disabled="#{alimentoBean.isVisualizacao}"
                        display="text"/>

                <sgp:formSelectOneMenu
                        id="status"
                        labelValue="Status"
                        value="#{alimentoBean.alimento.status}"
                        itemsValue="#{comboHelperBean.status}"
                        itemValue="#{item}"
                        itemLabel="#{item.descricao}"
                        disabled="#{alimentoBean.isVisualizacao}"
                        display="text"/>

                <sgp:formCheckbox
                        id="proteico"
                        labelValue="Proteico"
                        value="#{alimentoBean.alimento.proteico}"
                        disabled="#{alimentoBean.isVisualizacao}"/>

                <h:panelGroup layout="block" styleClass="sgp-audit-strip">
                    <div>
                        <strong>Cadastrado por:</strong>
                        <h:outputText
                                value="#{alimentoBean.alimento.autorRegistro.usuario} em #{alimentoBean.alimento.autorRegistro.data}"
                                rendered="#{not empty alimentoBean.alimento.autorRegistro}"/>
                        <h:outputText
                                value="registro ainda não salvo"
                                styleClass="sgp-audit-empty"
                                rendered="#{empty alimentoBean.alimento.autorRegistro}"/>
                    </div>
                    <div>
                        <strong>Última alteração:</strong>
                        <h:outputText
                                value="#{alimentoBean.alimento.autorUltimaAlteracao.usuario} em #{alimentoBean.alimento.autorUltimaAlteracao.data}"
                                rendered="#{not empty alimentoBean.alimento.autorUltimaAlteracao}"/>
                        <h:outputText
                                value="nenhuma alteração registrada"
                                styleClass="sgp-audit-empty"
                                rendered="#{empty alimentoBean.alimento.autorUltimaAlteracao}"/>
                    </div>
                </h:panelGroup>

                <div class="sgp-form-actions">
                    <p:button outcome="pretty:ListarAlimento"
                              value="Voltar"
                              styleClass="sgp-btn-secondary">
                        <f:param name="list" value="1"/>
                    </p:button>
                    <p:commandButton value="Salvar"
                                     action="#{alimentoBean.salvar()}"
                                     update="@form"
                                     process="@form"
                                     styleClass="sgp-btn-primary"
                                     rendered="#{(securityUtil.possuiPermissao('CadastrarAlimento') and !alimentoBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarAlimento') and !alimentoBean.isVisualizacao)}"/>
                </div>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
