<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sgp="http://sejudh.mt.gov.br/components"
                template="/WEB-INF/pages/_templates/principal.xhtml">

    <ui:define name="footer">
        <h:outputScript library="js" name="selectOneMenuFilter.js" />
    </ui:define>

    <ui:define name="conteudo">
        <sgp:validarAcesso/>

        <h3> Alimentos </h3>

        <h:form>
            <p:button value="Cadastrar" outcome="pretty:CadastrarAlimento" icon="ui-icon-plus"
                      rendered="#{securityUtil.possuiPermissao('CadastrarAlimento')}"/>
        </h:form>

        <h:form id="meuFormulario">
            <p:panel>
                <p:outputLabel value="Consulta"/>
                <div class="form-block">
                    <div class="form-label-column" style="min-width:150px !important">
                        <p:outputLabel for="descricaoConsulta" value="Descrição:"/>
                    </div>
                    <div class="form-required-column">
                        <p:spacer width="15px"/>
                    </div>
                    <div class="form-input-column">
                        <p:autoComplete
                                id="descricaoConsulta"
                                value="#{alimentoBean.filtro.descricao}"
                                completeMethod="#{alimentoBean.completarDescricoesAlimentosFiltro}"
                                minQueryLength="2" queryDelay="400" maxResults="20"
                                forceSelection="false" dropdown="false" style="width:300px"/>
                    </div>
                    <div class="form-error-column">
                        <p:message for="descricaoConsulta" display="text"/>
                    </div>
                </div>
                <sgp:formSelectOneMenu
                        id="unidadeMedida"
                        labelValue="Unidade de medida"
                        value="#{alimentoBean.filtro.unidadeMedida}"
                        itemsValue="#{comboHelperBean.unidadesMedida}"
                        itemValue="#{item}"
                        itemLabel="#{item.descricao}"
                        temSelecione="true"
                        styleFormLabelColumn="min-width:150px !important"
                />
                <sgp:formSelectOneMenu
                        styleFormLabelColumn="min-width:150px !important"
                        id="status" labelValue="Status"
                        value="#{alimentoBean.filtro.status}"
                        itemsValue="#{comboHelperBean.status}"
                        itemValue="#{item}"
                        itemLabel="#{item.descricao}"
                        temSelecione="true"
                />
                <sgp:formSelectOneMenu
                        styleFormLabelColumn="min-width:150px !important"
                        id="proteicoFilter"
                        labelValue="Proteico"
                        value="#{alimentoBean.filtro.proteico}"
                        itemsValue="#{comboHelperBean.simNao}"
                        itemValue="#{item}"
                        itemLabel="#{item.descricao}"
                        temSelecione="true"
                />


                <br/> <br/>
                <p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search"
                                 onstart="if (PF('alimentoDataTable')) { PF('alimentoDataTable').getPaginator().setPage(0); }"/>
            </p:panel>
        </h:form>

        <h:form id="registrosForm">
            <p:dataTable id="dataTable" var="alimento" value="#{alimentoBean.alimentos}"
                         emptyMessage="Nenhum registro encontrado."
                         widgetVar="alimentoDataTable"
                         rows="10" paginator="true" paginatorPosition="bottom" lazy="true"
                         sortBy="#{alimento.descricao}" reflow="true"
                         rowsPerPageTemplate="10,20,30,50" styleClass="sgp-datatable">

                <p:column headerText="Código" style="width:100px;" sortBy="#{alimento.id}">
                    <h:outputText value="#{alimento.id}"/>
                </p:column>

                <p:column headerText="Descrição" sortBy="#{alimento.descricao}">
                    <h:outputText value="#{alimento.descricao}"/>
                </p:column>

                <p:column headerText="Unidade de Medida" sortBy="#{alimento.unidadeMedida}">
                    <h:outputText value="#{alimento.unidadeMedida.descricao}"/>
                </p:column>

                <p:column headerText="Proteico" sortBy="#{alimento.proteico}">
                    <h:outputText value="#{alimento.proteico ? 'Sim' : 'Não'}"/>
                </p:column>

                <p:column headerText="Situação" sortBy="#{alimento.status}">
                    <h:outputText value="#{alimento.status.descricao}"/>
                </p:column>

                <p:column headerText="Ações" style="width:150px;" styleClass="sgp-datatable-actions">
                    <h:panelGroup layout="block" styleClass="sgp-datatable-actions">
                        <p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarAlimento"
                                  rendered="#{securityUtil.possuiPermissao('VisualizarAlimento')}">
                            <f:param name="id" value="#{alimento.id}"/>
                        </p:button>

                        <p:button title="Editar" icon="ui-icon-pencil" outcome="pretty:AlterarAlimento"
                                  rendered="#{securityUtil.possuiPermissao('AlterarAlimento')}">
                            <f:param name="id" value="#{alimento.id}"/>
                        </p:button>

                        <p:commandButton action="#{alimentoBean.excluir(alimento)}" icon="ui-icon-trash" title="Excluir"
                                         rendered="#{securityUtil.possuiPermissao('ExcluirAlimento')}"
                                         update="@form :registrosForm :mensagens">
                            <p:confirm header="Confirmação" message="Deseja excluir o alimento?" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </h:panelGroup>
                </p:column>

                <f:facet name="footer">
                    Total de registros: #{alimentoBean.alimentos.rowCount}
                </f:facet>
            </p:dataTable>

            <p:confirmDialog global="true">
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check"/>
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
