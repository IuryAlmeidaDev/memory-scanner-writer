<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">

		<div class="sgp-page-header">
			<h3>Parâmetros do Sistema</h3>

			<h:form id="formNovoParametro">
				<p:commandButton value="Cadastrar"
					icon="fa fa-plus"
					actionListener="#{parametroBean.configurarParametro}"
					oncomplete="PF('dlg').show();"
					update=":formDlg"
					immediate="true"
					styleClass="sgp-btn-primary" />
			</h:form>
		</div>

		<h:form id="formParametro">
			<p:dataGrid id="dataGrid" layout="grid" columns="3" rows="0"
				value="#{parametroBean.params}" var="p">
				<p:panel header="#{p.nome}" styleClass="sgp-data-card">
					<h:outputText value="#{p.valor}" />

					<div class="sgp-data-card-actions">
						<p:commandButton icon="fa fa-pencil"
							actionListener="#{parametroBean.configurarParametro}"
							oncomplete="PF('dlg').show();"
							update=":formDlg"
							styleClass="sgp-btn-icon"
							title="Editar">
							<f:attribute name="parametro" value="#{p}" />
						</p:commandButton>

						<p:commandButton icon="fa fa-trash"
							actionListener="#{parametroBean.excluir(p)}"
							update=":formParametro:dataGrid :mensagens"
							styleClass="sgp-btn-icon sgp-btn-icon-danger"
							title="Excluir" />
					</div>
				</p:panel>
			</p:dataGrid>
		</h:form>

		<h:form id="formDlg">
			<p:dialog dynamic="true" modal="true" id="dialog"
				closeOnEscape="true" closable="true" widgetVar="dlg"
				resizable="false" draggable="false" header="Parâmetro"
				width="440" styleClass="sgp-dialog">

				<sgp:formInputText
					id="nomeParametro"
					labelValue="Nome"
					value="#{parametroBean.param.nome}"
					validationRequired="true"
					maxlength="80"
					display="text" />

				<sgp:formInputText
					id="valorParametro"
					labelValue="Valor"
					value="#{parametroBean.param.valor}"
					validationRequired="true"
					display="text"
					maxlength="80"
					permiteCaracterEspecial="true" />

				<div class="sgp-form-actions">
					<p:commandButton value="Fechar"
						onclick="PF('dlg').hide(); return false;"
						styleClass="sgp-btn-secondary" />
					<p:commandButton value="Salvar"
						actionListener="#{parametroBean.salvar}"
						oncomplete="PF('dlg').hide();"
						update=":formDlg :formParametro:dataGrid :mensagens"
						styleClass="sgp-btn-primary" />
				</div>
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
