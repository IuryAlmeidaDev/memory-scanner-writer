<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="footer">
		<h:outputScript library="js" name="selectOneMenuFilter.js" />
	</ui:define>

	<ui:define name="conteudo">
		<sgp:validarAcesso />

		<h3>Cardápios</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarCardapio"
				icon="ui-icon-plus"
				rendered="#{securityUtil.possuiPermissao('CadastrarCardapio')}" />
		</h:form>

		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta" />

				<sgp:formSelectOneMenu id="contrato" labelValue="Contrato"
					value="#{cardapioBean.filtro.contrato}"
					itemsValue="#{cardapioBean.contratos}" itemValue="#{item}"
					itemLabel="#{item.numContrato}" temSelecione="true" defaultFilterMode="true"
					converter="SimpleEntityConverter"
					styleFormLabelColumn="min-width:150px !important">
					<p:ajax process="@this"
						listener="#{cardapioBean.onContratoFiltroChange}"
						update=":meuFormulario:unidadePrisionalWrapper" />
				</sgp:formSelectOneMenu>

				<p:outputPanel id="unidadePrisionalWrapper">
					<sgp:formSelectOneMenu id="unidadePrisional"
						labelValue="Unidade Prisional" itemValue="#{item}"
						itemLabel="#{item.nome}"
						itemsValue="#{cardapioBean.unidadesPrisionais}"
						value="#{cardapioBean.filtro.unidadePrisional}"
						converter="SimpleEntityConverter" temSelecione="true" defaultFilterMode="true"
						styleFormLabelColumn="min-width:150px !important"
						rendered="#{cardapioBean.exibirFiltroUnidadePrisional}" />
				</p:outputPanel>

				<p:column headerText="Unidade Prisional"
					sortBy="#{cardapio.nomeUnidadePrisional}">
					<h:outputText value="#{cardapio.nomeUnidadePrisional}" />
				</p:column>

				<sgp:formSelectOneMenu id="tipoRefeicao"
					labelValue="Tipo de Refeição"
					itemsValue="#{cardapioBean.tiposRefeicao}" itemValue="#{item}"
					itemLabel="#{item.descricao}"
					value="#{cardapioBean.filtro.tipoRefeicao}" temSelecione="true"
					styleFormLabelColumn="min-width:150px !important"
					converter="SimpleEntityConverter" display="text" />

				<sgp:formSelectOneMenu id="tipoDieta" labelValue="Tipo de Dieta"
					itemsValue="#{cardapioBean.tiposDieta}" itemValue="#{item}"
					itemLabel="#{item.descricao}"
					value="#{cardapioBean.filtro.tipoDieta}" temSelecione="true"
					defaultFilterMode="true"
					styleFormLabelColumn="min-width:150px !important"
					converter="SimpleEntityConverter" display="text" />

				<sgp:formSelectOneMenu id="semana" labelValue="Semana"
					itemsValue="#{cardapioBean.semanas}" itemValue="#{item}"
					itemLabel="#{item.descricao}" value="#{cardapioBean.filtro.semana}"
					temSelecione="true"
					styleFormLabelColumn="min-width:150px !important"
					converter="SimpleEntityConverter" display="text" />

				<sgp:formSelectOneMenu id="diaSemana" labelValue="Dia da Semana"
					itemsValue="#{cardapioBean.diasSemana}" itemValue="#{item}"
					itemLabel="#{item.descricao}"
					value="#{cardapioBean.filtro.diaSemana}" temSelecione="true"
					styleFormLabelColumn="min-width:150px !important"
					converter="SimpleEntityConverter" display="text" />

				<sgp:formSelectOneMenu id="festivo" labelValue="Cardápio Festivo?"
					value="#{cardapioBean.filtro.festivo}" itemsValue="#{null}"
					itemValue="#{null}" itemLabel=""
					styleFormLabelColumn="min-width:150px !important"
					temSelecione="true" display="text">
					<f:selectItem itemLabel="Sim" itemValue="true" />
					<f:selectItem itemLabel="Não" itemValue="false" />
				</sgp:formSelectOneMenu>

				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm"
					process="@form" icon="ui-icon-search"
					onstart="if (PF('cardapioDataTable')) { PF('cardapioDataTable').getPaginator().setPage(0); }" />
			</p:panel>
		</h:form>

		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="cardapio"
				value="#{cardapioBean.cardapios}"
				emptyMessage="Nenhum registro encontrado." rows="10"
				widgetVar="cardapioDataTable"
				paginator="true" paginatorPosition="bottom" lazy="true"
				sortBy="#{cardapio.id}" rowsPerPageTemplate="10,20,30,50"
				reflow="true" styleClass="sgp-datatable"
				paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
				currentPageReportTemplate="Total de registros: {totalRecords}">

				<p:column headerText="Código" style="width:100px;"
					sortBy="#{cardapio.id}">
					<h:outputText value="#{cardapio.id}" />
				</p:column>

				<p:column headerText="Refeição"
					sortBy="#{cardapio.nomeRefeicao}">
					<h:outputText value="#{cardapio.nomeRefeicao}" />
				</p:column>

				<p:column headerText="Dieta"
					sortBy="#{cardapio.nomeDieta}">
					<h:outputText value="#{cardapio.nomeDieta}" />
				</p:column>

				<p:column headerText="Semana"
					sortBy="#{cardapio.semana}">
					<h:outputText value="#{cardapio.semana}" />
				</p:column>

				<p:column headerText="Dia" sortBy="#{cardapio.diaSemana}">
					<h:outputText value="#{cardapio.diaSemana.descricao}" />
				</p:column>

				<p:column headerText="Próxima Ocorrência"
					sortBy="#{cardapio.proximaData}">
					<h:outputText value="#{cardapio.proximaData}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText="Unidade Prisional"
					sortBy="#{cardapio.nomeUnidadePrisional}">
					<h:outputText value="#{cardapio.nomeUnidadePrisional}" />
				</p:column>

				<p:column headerText="Contrato" sortBy="#{cardapio.numContrato}">
					<h:outputText value="#{cardapio.numContrato}" />
				</p:column>

				<p:column headerText="Ações" style="width:150px;" styleClass="sgp-datatable-actions">
					<h:panelGroup layout="block" styleClass="sgp-datatable-actions">
						<p:button title="Visualizar" icon="ui-icon-document"
							outcome="pretty:VisualizarCardapio"
							rendered="#{securityUtil.possuiPermissao('VisualizarCardapio')}">
							<f:param name="id" value="#{cardapio.id}" />
						</p:button>

						<p:button title="Editar" icon="ui-icon-pencil"
							outcome="pretty:AlterarCardapio"
							rendered="#{securityUtil.possuiPermissao('AlterarCardapio')}">
							<f:param name="id" value="#{cardapio.id}" />
						</p:button>
					</h:panelGroup>
				</p:column>

			</p:dataTable>
		</h:form>

	</ui:define>
</ui:composition>
