<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />

		<div class="sgp-page-header">
			<h3>#{crimeBean.tituloPagina} Crime</h3>
		</div>

		<h:form>
			<p:panel styleClass="sgp-card-form sgp-card-form--wide">

				<sgp:formSelectOneMenu id="legislacao" labelValue="Lei"
					itemValue="#{item}" itemLabel="#{item}"
					itemsValue="#{crimeBean.legislacoes}"
					value="#{crimeBean.crime.nomeLegislacao}" filter="true"
					filterMatchMode="contains" display="text" temSelecione="true"
					validationRequired="true">
				</sgp:formSelectOneMenu>

				<sgp:formInputText id="artigo" labelValue="Artigo"
					value="#{crimeBean.crime.numArtigo}" validationRequired="true"
					disabled="#{crimeBean.isVisualizacao}" maxlength="80"
					display="text" />

				<sgp:formInputText id="paragrafo" labelValue="Parágrafo"
					value="#{crimeBean.crime.numParagrafo}"
					disabled="#{crimeBean.isVisualizacao}" maxlength="80"
					display="text" />

				<sgp:formInputText id="inciso" labelValue="Inciso"
					value="#{crimeBean.crime.numInciso}"
					disabled="#{crimeBean.isVisualizacao}" maxlength="80"
					display="text" />

				<sgp:formInputText id="alinea" labelValue="Alínea"
					value="#{crimeBean.crime.numAlinea}"
					disabled="#{crimeBean.isVisualizacao}" maxlength="80"
					display="text" />

				<sgp:formSelectOneMenu id="status" labelValue="Status"
					value="#{crimeBean.crime.status}"
					itemsValue="#{comboHelperBean.status}" itemValue="#{item}"
					itemLabel="#{item.descricao}"
					disabled="#{crimeBean.isVisualizacao}" display="text" />

				<sgp:formInputTextarea id="descCrime" labelValue="Descrição"
					value="#{crimeBean.crime.detalhamento}"
					disabled="#{crimeBean.isVisualizacao}" validationRequired="true"
					rows="5" columns="100" maxlength="250" autoResize="true"
					size="#{crimeBean.crime.detalhamento.length()+5}" display="text" />

				<div class="sgp-form-actions">
					<p:button outcome="pretty:ListarCrime"
						value="Voltar"
						styleClass="sgp-btn-secondary">
						<f:param name="list" value="1" />
					</p:button>
					<p:commandButton value="Salvar"
						action="#{crimeBean.salvar()}"
						update="@form"
						styleClass="sgp-btn-primary"
						rendered="#{(securityUtil.possuiPermissao('CadastrarCrime') and !crimeBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarCrime') and !crimeBean.isVisualizacao)}" />
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
