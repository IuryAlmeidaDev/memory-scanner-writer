<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />

		<h3>Gerar Pedido</h3>
		
		<h:form id="meuFormulario">
			<p:panel>
                <p:outputLabel value="Consulta"/>
                
                <sgp:formSelectOneMenu 
                 		id="unidadePrisional"
                 		labelValue="Unidade Prisional"
                 		itemValue="#{item}" 
                 		itemLabel="#{item.nome}"
                 		itemsValue="#{mapaConsolidadoBean.unidadesPrisionais}"
                 		value="#{horarioRefeicaoBean.filtro.unidadePrisional}" 
                 		converter="SimpleEntityConverter"
                 		temSelecione="true"
						defaultFilterMode="true"
                 		styleFormLabelColumn="min-width:150px !important"
                 		rendered="#{securityUtil.possuiPermissao('ListarTodasUnidades')}"
				/>
                
                <br/> <br/>
                <p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search"/>
        	</p:panel>
        </h:form>

	</ui:define>
</ui:composition>
