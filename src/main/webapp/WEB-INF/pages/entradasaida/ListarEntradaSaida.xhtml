<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml"
	xmlns:pe="http://primefaces.org/ui/extensions">

	<ui:define name="footer">
		<ui:include src="/WEB-INF/pages/_script/biometriaEntradaSaidaConfig.xhtml" />
		<h:outputScript library="js" name="biometriaCore.js?ver=#{biometriaUtilBean.getBiometriaJsVersao('core')}" />
		<h:outputScript library="js" name="biometriaEntradaSaida.js?ver=#{biometriaUtilBean.getBiometriaJsVersao('entrada-saida')}" />
		<h:outputScript library="js" name="selectOneMenuFilter.js" />
	</ui:define>

	<ui:define name="conteudo">
		<sgp:validarAcesso />


		<h3><strong>Entrada/Saída de Visitante</strong></h3>

		<h:form prependId="false" id="formStatus">
			<p:panel>

				<center>
					<div class="ui-g">
						<div class="ui-g-8">
							<sgp:formCalendar labelValue="Data da Visita"
								value="#{entradaSaidaBean.filtro.data}" display="text"
								validationRequired="false" pattern="dd/MM/yyyy" 
								disabled="#{true}" />
						</div>
						<div class="ui-g-4">
							<sgp:formOutputText labelValue="Estruturas liberadas para visitas"
								 />
							<p:commandButton icon="ui-icon ui-icon-search"
								title="Selecionar Estrutura" immediate="true"
								update=":formDialogEstrutura:dialogEstrutura"
								actionListener="#{entradaSaidaBean.abrirDialogEstruturaDisponiveis}">
							</p:commandButton>
						</div>
					</div>

					<div class="ui-g">
						<div class="ui-g-6">
							<h4>
								<strong>Visitas em Andamento: #{entradaSaidaBean.emAndamento()}</strong>
							</h4>
						</div>
						<div class="ui-g-6">
							<h4>
								<strong>Visitas Finalizadas: #{entradaSaidaBean.finalizadas()}</strong>
							</h4>
						</div>
					</div>
				</center>

				<center>

					<p:commandButton value="Entrada / Saída Biométrica" id="btnBio" styleClass="botaoBiometrico" onclick="pesquisar(); return false;" icon="ui-icon-bio" rendered="#{false}"/>
					<p:commandButton value="Pesquisar Visitante para Entrada / Saída" actionListener="#{entradaSaidaBean.abrirDialogAssociarVisitante}"  update=":registrosForm, :dialogInformacoesVisitante" > 
						<p:ajax event="dialogReturn" listener="#{entradaSaidaBean.associarVisitante}" />
					</p:commandButton>
        			<p:remoteCommand name="retornoBiometria" actionListener="#{entradaSaidaBean.retornoOperacaoBiometrica()}" update=":registrosForm" />
				</center>
			</p:panel>
			<br/>
		</h:form>

		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta Visitantes na Unidade " />
				<br />
				<br />
				
				<sgp:formInputText id="pesquisar" labelValue="Nome do Visitante"
					value="#{entradaSaidaBean.filtro.nome}" maxlength="80"
					styleFormLabelColumn="width:180px" style="width: 200px;" />
				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm, :dialogInformacoesVisitante, :formStatus"
					actionListener="#{entradaSaidaBean.pesquisar()}" 
					icon="ui-icon-search" >
				</p:commandButton>
				<br />
				<br />
				<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{entradaSaidaBean.imprimir()}"/>
				<br />
				<br />
			</p:panel>
		</h:form>

		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="entrada"
				value="#{entradaSaidaBean.entradas}" rows="10" paginator="true"
				paginatorPosition="bottom" lazy="true" sortBy="#{entrada.entradas.id}"
				emptyMessage="Nenhum registro encontrado." sortOrder="DESCENDING"
				selectionMode="single"
				selection="#{entradaSaidaBean.entradaSelecionada}">

				<p:column headerText="Data/ Hora Entrada"
					sortBy="#{entrada.entradas.dataEntrada}" width="20%"
					style="text-align: center;">
					<h:outputText value="#{entradaSaidaBean.buscarData(entrada)}">
						<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
					</h:outputText>
				</p:column>

				<p:column headerText="Visitante"
					sortBy="#{visitante.pessoa.nome}" >
					<h:outputText value="#{entrada.pessoa.nome}" />
				</p:column>

				<p:column headerText="Recuperando" >
					<h:outputText value="#{entradaSaidaBean.buscarRecuperandoPorVisitanteCredenciado(entrada.id)}" />
				</p:column>

				<p:column headerText="Ações" width="25%">
					<center>
						<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:EntradaSaida" rendered="#{entradaSaidaBean.buscarStatusVisita(entrada) > 0}">
							<f:param name="acao" value="VISUALIZAR" />
							<f:param name="idPessoa" value="#{entrada.pessoa.id}" />
						</p:button>
                        
						<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:EntradaSaida" rendered="#{securityUtil.possuiPermissao('AlterarEntradaSaidaVisitante') and entradaSaidaBean.buscarStatusVisita(entrada) == 1}">
							<f:param name="acao" value="ALTERAR" />
							<f:param name="idPessoa" value="#{entrada.pessoa.id}" />
						</p:button>
                        
                        <p:commandButton title="Finalizar" icon="ui-icon-flag" action="#{entradaSaidaBean.abrirDialogDetalhes(entrada, 'FINALIZAR')}" oncomplete="PF('detalhes').show()" update="formDetalhesVisitante" process="@this"
                                         rendered="#{entradaSaidaBean.buscarStatusVisita(entrada) == 1 and securityUtil.possuiPermissao('FinalizarEntradaSaidaVisitante') }" />

                        <p:commandButton title="Cancelar" icon="ui-icon-cancel" action="#{entradaSaidaBean.abrirDialogDetalhes(entrada, 'CANCELAR')}" oncomplete="PF('detalhes').show()" update="formDetalhesVisitante" process="@this"
                                         rendered="#{entradaSaidaBean.buscarStatusVisita(entrada) == 1}" />

						<p:commandButton title="Iniciar Visita" icon="fa fa-arrow-right" actionListener="#{entradaSaidaBean.buttonIniciarVisita(entrada.pessoa.id)}" rendered="#{entradaSaidaBean.buscarStatusVisita(entrada) == 0}" />
						
						<p:commandButton 
							icon="ui-icon-trash" 
							title="Excluir" 
							action="#{entradaSaidaBean.excluir(entrada)}" 
							immediate="true" 
							update="@form :registrosForm :formStatus"
							rendered="#{securityUtil.possuiPermissao('ExcluirEntradaSaidaVisitante') and entradaSaidaBean.buscarStatusVisita(entrada) > 0}"
							>
							<p:confirm header="Confirmação"
								message="Deseja excluir visita?" icon="ui-icon-alert" />
						</p:commandButton>
					</center>
				</p:column>
			</p:dataTable>
		</h:form>


		<p:dialog id="dialogInformacoesVisitante"
				header="Informações do Visitante" dynamic="true" closable="true"
				width="1100" height="100%" showEffect="fade"
				widgetVar="dialogInformacoesVisitante" modal="true"
				draggable="false" resizable="false" closeOnEscape="true">
			<h:form id="formInformacoesVisitante">
				<pe:importEnum type="br.gov.mt.sejudh.sigepen.enumerator.TipoAutorizacaoValidacaoSemBio" var="tipoAut" allSuffix="ALL_ENUM_VALUES" />
						
				<h:inputHidden value="#{entradaSaidaBean.visitanteTemBiometria}" id="visitanteTemBiometria" />
				<p:panel id="panelVisitante"
					footer="Cadastrado por: #{entradaSaidaBean.entrada.autorRegistro.usuario} em #{entradaSaidaBean.entrada.autorRegistro.data} | Última alteração: #{entradaSaidaBean.entrada.autorUltimaAlteracao.usuario} em #{entradaSaidaBean.entrada.autorUltimaAlteracao.data}">
					<div class="ui-g">
						<div class="ui-g-8">
							<h:outputLabel value="Nome:" style="width: 150px;" />
							<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.pessoa.nome}" />
							<div>
								<h:outputLabel value="Nome da Mãe:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.pessoa.nomeMae}" />
							</div>
							<div>
								<h:outputLabel value="Nome do Pai:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.pessoa.nomePai}" />
							</div>
							<div>
								<h:outputLabel value="Nascimento:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.pessoa.dataNascimento}">
									<f:convertDateTime pattern="dd/MM/yyyy" />
								</h:outputLabel>
							</div>
							<div>
								<h:outputLabel value="Emancipado:" style="width: 150px;" rendered="#{entradaSaidaBean.isMenor(entradaSaidaBean.entrada.visitante.pessoa.dataNascimento)}"/>
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.emancipado.descricao}" rendered="#{entradaSaidaBean.isMenor(entradaSaidaBean.entrada.visitante.pessoa.dataNascimento)}"/>
							</div>
							<div>
								<h:outputLabel value="Nacionalidade:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.nacionalidade.descricao}"
									rendered="#{entradaSaidaBean.entrada.visitante.pessoa.nacionalidade ne null}" />
							</div>
							<div>
								<h:outputLabel value="Pais de Origem:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.pais.nome}"
									rendered="#{entradaSaidaBean.entrada.visitante.pessoa.pais ne null}" />
							</div>
							<div>
								<h:outputLabel value="Estado:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.naturalidade.estado.nome}"
									rendered="#{entradaSaidaBean.entrada.visitante.pessoa.naturalidade ne null}" />
							</div>
							<div>
								<h:outputLabel value="Cidade:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.naturalidade.nome}"
									rendered="#{entradaSaidaBean.entrada.visitante.pessoa.naturalidade ne null}" />
							</div>
							<div>
								<h:outputLabel value="Sexo:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.sexo.descricao}"
									rendered="#{entradaSaidaBean.entrada.visitante.pessoa.sexo ne null}" />
							</div>
							<div>
								<h:outputLabel value="Ident. Gênero:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.identidadeDeGenero.descricao}"
									rendered="#{entradaSaidaBean.entrada.visitante.identidadeDeGenero ne null}" />
							</div>
							<div>
								<h:outputLabel value="Nome Social:" style="width: 150px;" />
								<h:outputLabel
									value="#{entradaSaidaBean.entrada.visitante.pessoa.nomeSocial}" />
							</div>
							<div>
								<div>
									<h:outputLabel value="PNE:" style="width: 150px;" />
									<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.pne.descricao}"
										rendered="#{entradaSaidaBean.entrada.visitante.pne ne null}" />
								</div>
								<div>
									<h:panelGroup rendered="#{entradaSaidaBean.entrada.visitante.pne eq 'S'}">
										<h:outputLabel value="Permanente:" style="width: 150px;" />
										<h:outputLabel
											value="#{entradaSaidaBean.entrada.visitante.pnePermanente.descricao}"
											rendered="#{entradaSaidaBean.entrada.visitante.pnePermanente ne null}" />
									</h:panelGroup>
								</div>
							</div>
						</div>
						<div class="ui-g-4">
							<p:dataGrid layout="tabular" style="width: 188px" columns="1"
								rows="1"
								value="#{entradaSaidaBean.entrada.visitante.fotoFrenteAtual}"
								emptyMessage="Sem foto de frente." var="f">
								<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}"
									cache="false" width="180" height="240">
									<f:param name="hashId" value="#{f.imagem.id}" />
								</p:graphicImage>
							</p:dataGrid>
						</div>
					</div>
				</p:panel>
				<br />
				
				<p:panel id="panelResponsavel" rendered="#{entradaSaidaBean.entrada.visitante.responsavel ne null}">
				<h4>Visitante Responsável</h4>
					<div class="ui-g">
						<div class="ui-g-8">
						<h:outputLabel value="Nome:" style="width: 150px;" />
							<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.nome}" />
							<div>
								<h:outputLabel value="Nome da Mãe:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.nomeMae}" />
							</div>
							<div>
								<h:outputLabel value="Nome do Pai:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.nomePai}" />
							</div>
							<div>
								<h:outputLabel value="Nascimento:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.dataNascimento}">
									<f:convertDateTime pattern="dd/MM/yyyy" />
								</h:outputLabel>
							</div>
							<div>
								<h:outputLabel value="Emancipado:" style="width: 150px;" rendered="#{entradaSaidaBean.isMenor(entradaSaidaBean.entrada.visitante.responsavel.pessoa.dataNascimento)}"/>
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.emancipado.descricao}" rendered="#{entradaSaidaBean.isMenor(entradaSaidaBean.entrada.visitante.responsavel.pessoa.dataNascimento)}"/>
							</div>
							<div>
								<h:outputLabel value="Nacionalidade:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.nacionalidade.descricao}"/>
							</div>
							<div>
								<h:outputLabel value="Pais de Origem:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.pais.nome}"/>
							</div>
							<div>
								<h:outputLabel value="Estado:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.naturalidade.estado.nome}"/>
							</div>
							<div>
								<h:outputLabel value="Cidade:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.responsavel.pessoa.naturalidade.nome}"/>
							</div>
							<div>
								<h:outputLabel value="Sexo:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.sexo.descricao}"/>
							</div>
							<div>
								<h:outputLabel value="Ident. Gênero:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.identidadeDeGenero.descricao}"/>
							</div>
							<div>
								<h:outputLabel value="Nome Social:" style="width: 150px;" />
								<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pessoa.nomeSocial}" />
							</div>
							<div>
								<div>
									<h:outputLabel value="PNE:" style="width: 150px;" />
									<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pne.descricao}"/>
								</div>
								<div>
									<h:panelGroup>
										<h:outputLabel value="Permanente:" style="width: 150px;" />
										<h:outputLabel value="#{entradaSaidaBean.entrada.visitante.responsavel.pnePermanente.descricao}" />
									</h:panelGroup>
								</div>
							</div>
							<div>
								<h:outputLabel value="Situação Visita:" style="width: 150px;" />
								<h:outputLabel  
								 value="#{entradaSaidaBean.verificarVisitaResponsavel() ? 'Ausente' : 'Em visita'}"/>
							</div>
						</div>
						<div class="ui-g-4">
							<p:dataGrid layout="tabular" style="width: 188px" columns="1"
								rows="1"
								value="#{entradaSaidaBean.entrada.visitante.responsavel.fotoFrenteAtual}"
								emptyMessage="Sem foto de frente." var="f">
								<p:graphicImage value="#{imageHandlerBean.getImagem(f.imagem)}"
									cache="false" width="180" height="240">
									<f:param name="hashId" value="#{f.imagem.id}" />
								</p:graphicImage>
							</p:dataGrid>
						</div>
					</div>
				</p:panel>
				<br />
		
				<h:panelGroup id="panelCancelar" rendered="#{entradaSaidaBean.cancelar == true}">
					<div class="ui-g-12">
		                        <sgp:formInputTextarea labelValue="Motivo do Cancelamento"
		                        				id="idMotivoCancelamento"
                                               value="#{entradaSaidaBean.entrada.motivoCancelamento}"
                                               rows="10"
                                               columns="100"
                                               maxlength="250"
                                               autoResize="true"
                                               display="text"
                                              />
					</div>
				</h:panelGroup>
				
				
				<h:panelGroup id="panelFinalizar"
							rendered="#{entradaSaidaBean.detalhes == true}">
							<div class="ui-g-12">
								<sgp:formInputTextarea labelValue="Motivo de Finalizar Visita"
									id="idMotivoFinalizarVisita"
									value="#{entradaSaidaBean.entrada.motivoFinalizacao}" rows="10"
									columns="100" maxlength="250" autoResize="true" display="text" />
							</div>
						</h:panelGroup>
				
				<h:panelGroup rendered="#{entradaSaidaBean.cancelar == false and entradaSaidaBean.detalhes == false}" >
					<p:panel id="panelBiometria">
						<div class="ui-g">
							<div class="ui-g-8">
							<h:panelGroup id="biometriaCapturada">
								<pe:importEnum
									type="br.gov.mt.sejudh.sigepen.enumerator.BiometriaTipoDedo"
									var="TipoDedo" allSuffix="ALL_ENUM_VALUES" />
									<p:panelGrid
										rendered="#{entradaSaidaBean.entrada.visitante.pessoa.biometria.dedos.size() gt 0 or entradaSaidaBean.entrada.visitante.pessoa.biometria.id gt 0 or true}"
										style="border-width:1px; border-style:solid; margin-bottom: 15px">
										<f:facet name="header">
											<p:row>
												<p:column colspan="3">
													<h:outputText value="Biometria capturada em: " />
													<h:outputText
														value="#{entradaSaidaBean.entrada.visitante.pessoa.biometria.dataCaptura}">
														<f:convertDateTime pattern="dd/MM/yyyy" />
													</h:outputText>
												</p:column>
											</p:row>
											<p:row>
												<p:column colspan="1" />
												<p:column colspan="1">Esquerda</p:column>
												<p:column colspan="1">Direita</p:column>
											</p:row>
										</f:facet>
										<p:row>
											<p:column style="font-weight: bold;">Polegar</p:column>
											<p:column style="text-align: center" rowspan="1">
												<p:graphicImage id="bioPE"
													name="#{(entradaSaidaBean.entrada.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO) ? 'green.png' : 'red.png')}"
													library="icons" />
												<p:overlayPanel for="bioPE" my="right bottom" at="left top"
													showEvent="mouseover" hideEvent="mouseout"
													appendToBody="true"
													rendered="#{(entradaSaidaBean.entrada.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_ESQUERDO))}">
													<p:dataGrid layout="tabular" style="width: 188px"
														columns="1" rows="1"
														value="#{entradaSaidaBean.entrada.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_ESQUERDO)}"
														var="f">
														<p:graphicImage value="#{imageHandlerBean.getImagem(f)}"
															cache="false" width="180" height="240">
															<f:param name="hashId" value="#{f.id}" />
														</p:graphicImage>
													</p:dataGrid>
												</p:overlayPanel>
											</p:column>
											<p:column style="text-align: center">
												<p:graphicImage id="bioPD"
													name="#{(entradaSaidaBean.entrada.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO) ? 'green.png' : 'red.png')}"
													library="icons" />
												<p:overlayPanel for="bioPD" my="right bottom" at="left top"
													showEvent="mouseover" hideEvent="mouseout"
													appendToBody="true"
													rendered="#{(entradaSaidaBean.entrada.visitante.pessoa.biometria.isDedoCapturado(TipoDedo.POLEGAR_DIREITO))}">
													<p:dataGrid layout="tabular" style="width: 188px"
														columns="1" rows="1"
														value="#{entradaSaidaBean.entrada.visitante.pessoa.biometria.getImagemBiometriaPorPosicao(TipoDedo.POLEGAR_DIREITO)}"
														var="f">
														<p:graphicImage value="#{imageHandlerBean.getImagem(f)}"
															cache="false" width="180" height="240">
															<f:param name="hashId" value="#{f.id}" />
														</p:graphicImage>
													</p:dataGrid>
												</p:overlayPanel>
											</p:column>
										</p:row>
	
										<p:row>
											<p:column style="font-weight: bold;">Indicador</p:column>
											<p:column style="text-align: center" rowspan="1">
												<p:graphicImage id="bioIE"
