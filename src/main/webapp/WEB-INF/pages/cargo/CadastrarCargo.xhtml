<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />

		<div class="sgp-page-header">
			<h3>#{cargoBean.tituloPagina} Cargo</h3>
		</div>

		<h:form>
			<p:panel styleClass="sgp-card-form">

				<sgp:formInputText
					id="nomeCargo"
					labelValue="Nome"
					value="#{cargoBean.cargo.nome}"
					validationRequired="true"
					disabled="#{cargoBean.isVisualizacao}"
					display="text"
					maxlength="80"/>

				<sgp:formSelectOneMenu
					id="categoria" labelValue="Categoria"
					value="#{cargoBean.cargo.categoria}"
					itemsValue="#{cargoBean.categorias}"
					itemValue="#{item}"
					itemLabel="#{item.nome}"
					temSelecione="true"
					validationRequired="true"
					converter="SimpleEntityConverter"
					display="text"
					disabled="#{cargoBean.isVisualizacao}" />

				<sgp:formSelectOneMenu
					id="escolta" labelValue="Escolta?"
					value="#{cargoBean.cargo.escolta}"
					validationRequired="true"
					temSelecione="true"
					disabled="#{cargoBean.isVisualizacao}"
					display="text">
					<f:selectItem itemLabel="Sim" itemValue="true" />
					<f:selectItem itemLabel="Não" itemValue="false" />
				</sgp:formSelectOneMenu>

				<sgp:formSelectOneMenu
					id="status" labelValue="Status"
					value="#{cargoBean.cargo.status}"
					itemsValue="#{comboHelperBean.status}"
					itemValue="#{item}"
					itemLabel="#{item.descricao}"
					disabled="#{cargoBean.isVisualizacao}"
					display="text" />

				<h:panelGroup layout="block" styleClass="sgp-audit-strip">
					<div>
						<strong>Cadastrado por:</strong>
						<h:outputText
							value="#{cargoBean.cargo.autorRegistro.usuario} em #{cargoBean.cargo.autorRegistro.data}"
							rendered="#{not empty cargoBean.cargo.autorRegistro}"/>
						<h:outputText
							value="registro ainda não salvo"
							styleClass="sgp-audit-empty"
							rendered="#{empty cargoBean.cargo.autorRegistro}"/>
					</div>
					<div>
						<strong>Última alteração:</strong>
						<h:outputText
							value="#{cargoBean.cargo.autorUltimaAlteracao.usuario} em #{cargoBean.cargo.autorUltimaAlteracao.data}"
							rendered="#{not empty cargoBean.cargo.autorUltimaAlteracao}"/>
						<h:outputText
							value="nenhuma alteração registrada"
							styleClass="sgp-audit-empty"
							rendered="#{empty cargoBean.cargo.autorUltimaAlteracao}"/>
					</div>
				</h:panelGroup>

				<div class="sgp-form-actions">
					<p:button outcome="pretty:ListarCargo"
						value="Voltar"
						styleClass="sgp-btn-secondary">
						<f:param name="list" value="1" />
					</p:button>
					<p:commandButton value="Salvar"
						action="#{cargoBean.salvar()}"
						update="@form"
						styleClass="sgp-btn-primary"
						rendered="#{(securityUtil.possuiPermissao('CadastrarCargo') and !cargoBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarCargo') and !cargoBean.isVisualizacao)}" />
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
