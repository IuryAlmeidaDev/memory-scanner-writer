<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />

		<h3>Fornecedor</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarFornecedor"
				icon="ui-icon-plus"
				rendered="#{securityUtil.possuiPermissao('CadastrarFornecedor')}" />
		</h:form>

		<p:panel>
			<h:form id="meuFormulario">
				<p:outputLabel value="Consulta" />

				<sgp:formInputMask id="cnpj" labelValue="CNPJ"
					mask="**.***.***/****-99" value="#{fornecedorBean.filtro.cnpj}"
					maxlength="14" display="text" size="40"
					disabled="#{fornecedorBean.isVisualizacao}" converter="convertCnpj"
					styleFormLabelColumn="min-width:120px !important" />

				<sgp:formInputText id="razaoSocial" labelValue="Razão Social"
					value="#{fornecedorBean.filtro.razaoSocial}" size="40"
					disabled="#{fornecedorBean.isVisualizacao}" display="text"
					styleFormLabelColumn="min-width:120px !important" />

				<sgp:formInputText id="nomeFantasia" labelValue="Nome Fantasia"
					value="#{fornecedorBean.filtro.nomeFantasia}" size="40"
					disabled="#{fornecedorBean.isVisualizacao}" display="text"
					styleFormLabelColumn="min-width:120px !important" />

				<sgp:formSelectOneMenu id="status" labelValue="Status"
					value="#{fornecedorBean.filtro.status}"
					itemsValue="#{comboHelperBean.status}"
					styleFormLabelColumn="min-width:120px !important"
					itemValue="#{item}" itemLabel="#{item.descricao}"
					temSelecione="true" />


				<div class="form-block "></div>
				<p:commandButton value="Pesquisar" update=":registrosForm"
					process="@form" icon="ui-icon-search" />
			</h:form>
		</p:panel>

		<br />
		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="fornecedor"
				value="#{fornecedorBean.fornecedores}"
				emptyMessage="Nenhum registro encontrado." rows="10"
				paginator="true" paginatorPosition="bottom" lazy="true"
				sortBy="#{fornecedor.id}" reflow="true">
				<p:column headerText="Código" style="width:100px;"
					sortBy="#{fornecedor.id}">
					<h:outputText value="#{fornecedor.id}" />
				</p:column>
				<p:column headerText="Credor FIPLAN" sortBy="#{fornecedor.creador}">
					<h:outputText value="#{fornecedor.creador}" />
				</p:column>
				<p:column headerText="CNPJ" sortBy="#{fornecedor.cnpj}">
					<h:outputText value="#{fornecedor.cnpj}" />
				</p:column>
				<p:column headerText="Nome Fantasia"
					sortBy="#{fornecedor.nomeFantasia}">
					<h:outputText value="#{fornecedor.nomeFantasia}" />
				</p:column>
				<p:column headerText="Razão Social"
					sortBy="#{fornecedor.razaoSocial}">
					<h:outputText value="#{fornecedor.razaoSocial}" />
				</p:column>
				<p:column headerText="Status" sortBy="#{fornecedor.status}">
					<h:outputText value="#{fornecedor.status}" />
				</p:column>
				<p:column headerText="Ações" style="width:150px;">
					<center>
						<p:button title="Visualizar" icon="ui-icon-document"
							outcome="pretty:Visualizarfornecedor"
							rendered="#{securityUtil.possuiPermissao('Visualizarfornecedor')}">
							<f:param name="id" value="#{fornecedor.id}" />
						</p:button>
						<p:button title="Editar" icon="ui-icon-pencil"
							outcome="pretty:Alterarfornecedor"
							rendered="#{securityUtil.possuiPermissao('Alterarfornecedor')}">
							<f:param name="id" value="#{fornecedor.id}" />
						</p:button>
					</center>
				</p:column>

				<f:facet name="footer">
					Total de registros: #{fornecedorBean.fornecedores.rowCount}
				</f:facet>
			</p:dataTable>

			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button"
					styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button"
					styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>

	</ui:define>
</ui:composition>
