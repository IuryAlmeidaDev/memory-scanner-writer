<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>#{categoriaBean.tituloPagina} Categoria</h3>
			<h:form>
				<p:panel footer="Cadastrado por: #{categoriaBean.categoria.autorRegistro.usuario} em #{categoriaBean.categoria.autorRegistro.data} | Última alteração: #{categoriaBean.categoria.autorUltimaAlteracao.usuario} em #{categoriaBean.categoria.autorUltimaAlteracao.data}">
					<sgp:formInputText 
						id="nomeCargo" 
						labelValue="Nome"
						value="#{categoriaBean.categoria.nome}" 
						validationRequired="true"
						maxlength="80"
						disabled="#{categoriaBean.isVisualizacao}"
						display="text" />
						
					<sgp:formSelectOneMenu 
						id="status" labelValue="Status"
						value="#{categoriaBean.categoria.status}"
						itemsValue="#{comboHelperBean.status}" 
						itemValue="#{item}"
						itemLabel="#{item.descricao}" 
						disabled="#{categoriaBean.isVisualizacao}"
						display="text" />
					<br />
					<br />

					<p:commandButton value="Salvar" action="#{categoriaBean.salvar()}" update="@form" icon="ui-icon-disk" 
					rendered="#{(securityUtil.possuiPermissao('CadastrarCategoria') and !categoriaBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarCategoria') and !categoriaBean.isVisualizacao)}"/>
					<p:button outcome="pretty:ListarCategoria" value="Voltar" icon="ui-icon-arrowreturnthick-1-w">
						<f:param name="list" value="1" />
					</p:button>
				</p:panel>
			</h:form>
	</ui:define>
</ui:composition>
