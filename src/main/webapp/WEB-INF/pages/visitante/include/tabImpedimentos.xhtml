<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sgp="http://sejudh.mt.gov.br/components">

    <h4>Impedimento</h4>

        <div class="ui-g">

            <ui:repeat value="#{visitanteBean.visitante.impedimentos}" var="impedimento">
            <div class="ui-g-12" style="border: 1px solid #cccccc">
                <div class="ui-g">
                    <div class="ui-g-2">
                        <p:outputLabel value="Data do Impedimento:"/>
                    </div>
                    <div class="ui-g-10">
                        <h:outputText value="#{impedimento.dataImpedimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </div>

                    <div class="ui-g-2">
                        <p:outputLabel value="Tipo Impedimento:"/>
                    </div>
                    <div class="ui-g-10">
                        <h:outputText value="#{impedimento.tipoImpedimento.descricao}"/>
                    </div>

                    <div class="ui-g-2">
                        <p:outputLabel value="Observação:"/>
                    </div>
                    <div class="ui-g-10">
                        <h:outputText value="#{impedimento.observacao}"/>
                    </div>

                    <div class="ui-g-2">
                        <p:outputLabel value="Situação:"/>
                    </div>
                    <div class="ui-g-10">
                        <h:outputText value="#{impedimento.status.descricao}" />
                    </div>

                    <div class="ui-g-2">
                        <p:outputLabel value="Fim do Impedimento:"/>
                    </div>
                    <div class="ui-g-10">
                        <h:outputText value="#{impedimento.fimImpedimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </div>
                </div>

            </div>
            </ui:repeat>

        </div>
</ui:composition>
