<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/pages/_templates/dialog.xhtml"
                xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite">

    <ui:define name="head">
        <title>Visitante </title>
    </ui:define>

    <ui:define name="conteudo">
        <p:panel>
            <h:form id="registrosForm">
                <sgp:formInputText display="text" id="nomePessoa" labelValue="Nome"
                                   value="#{associarResponsavelBean.filtroAssociarResp.nome}"
                                   size="40" maxlength="80" styleFormLabelColumn="width: 150px"/>

                <sgp:formInputText display="text" id="cpf" labelValue="CPF"
                                   value="#{associarResponsavelBean.filtroAssociarResp.cpf}"
                                   size="40" maxlength="80" styleFormLabelColumn="width: 150px"/>

                <sgp:formCalendar display="text" labelValue="Data de Nascimento"
                                  value="#{associarResponsavelBean.filtroAssociarResp.dataNascimento}"
                                  dataMaxima="#{comboHelperBean.maxDate}" styleFormLabelColumn="width: 150px"/>
                                  
               <sgp:formInputText display="text" id="matricula" labelValue="Matricula"
                   value="#{associarResponsavelBean.filtroAssociarResp.matricula}"
                   size="40" maxlength="80" styleFormLabelColumn="width: 150px"
                   rendered="#{associarResponsavelBean.exibirMatricula}"/>

                <br/>
                <br/>
                <p:commandButton value="Pesquisar" update="@form, dataTable" process="@form" icon="ui-icon-search"/>
                <br/>
                <br/>

                <p:dataTable id="dataTable" var="visitante" value="#{associarResponsavelBean.lazyDataModel}" rows="5" paginator="true"
                             paginatorPosition="bottom" lazy="true" sortBy="#{visitante.visitanteId}" sortOrder="descending"
                             emptyMessage="Nenhum registro encontrado.">

                    <p:column headerText="ID" width="60" sortBy="#{visitante.visitanteId}">
                        <h:outputText value="#{visitante.visitanteId}" />
                    </p:column>

                    <p:column headerText="Nome" sortBy="#{visitante.nome}">
                        <h:outputText value="#{visitante.nome}" />
                    </p:column>

                    <p:column headerText="CPF" rendered="true" sortBy="#{visitante.cpf}">
                      <center>
                        <h:outputText value="#{visitante.cpf}" />
                      </center>
                    </p:column>

                    <p:column headerText="Data de Nascimento" sortBy="#{visitante.dataNascimento}">
                        <h:outputText value="#{visitante.dataNascimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Ações" width="60" >
                        <center>
                            <p:commandButton title="Selecionar" icon="ui-icon-check"
                                             actionListener="#{associarResponsavelBean.selecionarAssociarResponsavel(visitante)}"/>
                        </center>
                    </p:column>

                </p:dataTable>
            </h:form>
        </p:panel>


    </ui:define>
</ui:composition>
