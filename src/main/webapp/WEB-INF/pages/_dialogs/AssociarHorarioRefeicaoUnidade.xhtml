<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/pages/_templates/dialog.xhtml"
	xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite">

	<ui:define name="head">
		<title> Horário Refeição </title>
	</ui:define>
	
	<ui:define name="conteudo">
		<h:form id="refeicaoForm">
			<p:panel>		
				<sgp:formSelectOneMenu display="text" temSelecione="true" id="tipo"
                   labelValue="Tipo" itemValue="#{item}" itemLabel="#{item.descricao}"
                   itemsValue="#{associarHorarioRefeicaoUnidadeBean.tiposRefeicao}"
                   value="#{associarHorarioRefeicaoUnidadeBean.horarioRefeicao.tipoRefeicao}"
                   validationRequired="true" 
                   converter="SimpleEntityConverter"/>
					
				<sgp:formInputMask labelValue="Horário da Refeição" mask="99:99" maxlength="5"
					value="#{associarHorarioRefeicaoUnidadeBean.horarioRefeicao.horario}"
					display="text" styleFormLabelColumn="width: 100px"
					converter="HoraConverter" 
					validationRequired="true" 
				 />
					
				<br/> <br/>
				<p:commandButton title="Salvar" value="Adicionar" icon="ui-icon-plus" update="@form" action="#{associarHorarioRefeicaoUnidadeBean.incluirHorarioRefeicao()}" />
				<p:commandButton value="Fechar" icon="ui-icon-close" immediate="true" actionListener="#{associarHorarioRefeicaoUnidadeBean.fecharDialog}" />
				
				<br/>
			</p:panel>
			
		</h:form>
	</ui:define>
</ui:composition>
