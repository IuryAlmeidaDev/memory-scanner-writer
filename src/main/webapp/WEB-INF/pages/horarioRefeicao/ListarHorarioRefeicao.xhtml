<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="footer">
		<h:outputScript library="js" name="selectOneMenuFilter.js" />
	</ui:define>

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Cronograma de Pedidos de Refeição</h3>
		
		<h:form id="meuFormulario" rendered="#{securityUtil.possuiPermissao('ListarTodasUnidades')}">
			<p:panel>
                <p:outputLabel value="Consulta"/>
                
                <sgp:formSelectOneMenu 
                		id="unidadePrisional"
                		labelValue="Unidade Prisional"
                		itemValue="#{item}" 
                		itemLabel="#{item.nome}"
                		itemsValue="#{horarioRefeicaoBean.unidadesPrisionais}"
                		value="#{horarioRefeicaoBean.filtro.unidadePrisional}" 
                		converter="SimpleEntityConverter"
                		temSelecione="true"
                		filter="true" filterMatchMode="custom" filterFunction="removeAcento"
                		styleFormLabelColumn="min-width:150px !important"
				/>
                
				<br/> <br/>
				<p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search"
					onstart="if (PF('cronogramaDataTable')) { PF('cronogramaDataTable').getPaginator().setPage(0); }"/>
	        	</p:panel>
	        </h:form>
        
		
		<h:form id="registrosForm">
			<p:dataTable id="dataTable" var="horario" value="#{horarioRefeicaoBean.horariosRefeicao}" emptyMessage="Nenhum registro encontrado."
				widgetVar="cronogramaDataTable"
				rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{horario.unidadeId}"
				reflow="true" rowsPerPageTemplate="10,20,50" styleClass="sgp-datatable sgp-cronograma"
				paginatorTemplate="{RowsPerPageDropdown} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
				currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} Registros">

				<p:column headerText="Código" styleClass="col-codigo" sortBy="#{horario.unidadeId}">
					<h:outputText value="#{horario.unidadeId}" />
				</p:column>
				
				<p:column headerText="Nome Unidade" sortBy="#{horario.nomeUnidade}" styleClass="col-nome-unidade">
					<h:outputText value="#{horario.nomeUnidade}" />
				</p:column>
				
				<p:column headerText="Contrato" sortBy="#{horario.contrato}" styleClass="col-contrato">
					<h:outputText value="#{horario.contrato}" />
				</p:column>

				<p:column headerText="Refeição Atual" sortBy="#{horario.refeicaoAtual}" styleClass="col-refeicao-atual">
					<h:outputText value="#{horario.refeicaoAtual}" />
				</p:column>

				<p:column headerText="Próxima Refeição" sortBy="#{horario.proximaRefeicao}" styleClass="col-proxima-refeicao">
					<h:outputText value="#{horario.proximaRefeicao}" />
				</p:column>

				<p:column sortBy="#{horario.disparo}" styleClass="col-disparo">
					<f:facet name="header">
						<h:panelGroup layout="block">
							<h:outputText value="Disparo " />
							<h:outputText id="ajudaDisparo" styleClass="fa fa-exclamation-circle sgp-help-icon" />
							<sgp:tooltip for="#{p:component('ajudaDisparo')}" value="Momento em que o pedido da próxima refeição é gerado automaticamente"
								position="top" styleClass="tooltip-cronograma" />
						</h:panelGroup>
					</f:facet>
					<h:outputText value="#{horario.disparo}" />
				</p:column>

				<p:column sortBy="#{horario.corte}" styleClass="col-corte">
					<f:facet name="header">
						<h:panelGroup layout="block">
							<h:outputText value="Corte " />
							<h:outputText id="ajudaCorte" styleClass="fa fa-exclamation-circle sgp-help-icon" />
							<sgp:tooltip for="#{p:component('ajudaCorte')}" value="Prazo final para gerar o pedido da próxima refeição"
								position="top" styleClass="tooltip-cronograma" />
						</h:panelGroup>
					</f:facet>
					<h:outputText value="#{horario.corte}" />
				</p:column>

				<p:column sortBy="#{horario.tempoRestanteCorte}" styleClass="col-tempo-restante">
					<f:facet name="header">
						<h:panelGroup layout="block">
							<h:outputText value="Tempo restante " />
							<h:outputText id="ajudaTempoRestante" styleClass="fa fa-exclamation-circle sgp-help-icon" />
							<sgp:tooltip for="#{p:component('ajudaTempoRestante')}" value="Tempo restante até o horário de corte para gerar o pedido da próxima refeição"
								position="top" styleClass="tooltip-cronograma" />
						</h:panelGroup>
					</f:facet>
					<h:outputText value="#{horario.tempoRestanteCorte}" />
				</p:column>
				
			</p:dataTable>

			<p:confirmDialog global="true">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>

	</ui:define>
</ui:composition>
