<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<div class="sgp-page-header">
			<h3>Alterar senha</h3>
			<p class="lead">Defina uma nova senha de acesso ao sistema.</p>
		</div>

		<h:form id="form">
			<p:panel id="panel" styleClass="sgp-card-form">

				<h:panelGroup rendered="#{alterarSenhaBean.usuario.primeiroAcesso}">
					<div class="sgp-alert sgp-alert-warn">
						<strong>Primeiro acesso:</strong> por medidas de segurança é obrigatório alterar a senha agora.
					</div>
				</h:panelGroup>

				<div class="sgp-alert sgp-alert-info">
					A senha deve conter no mínimo <strong>6</strong> e no máximo <strong>15</strong> caracteres.
				</div>

				<sgp:formInputPassword
					id="pwd1"
					labelValue="Nova senha"
					value="#{alterarSenhaBean.usuario.senha}"
					validationRequired="true"
					maxlength="15"
					match=":form:pwd2:input"
					validatorMessage="A senha e a confirmação devem ser iguais."
					display="text"/>

				<sgp:formInputPassword
					id="pwd2"
					labelValue="Confirme a senha"
					value="#{alterarSenhaBean.usuario.senha}"
					validationRequired="true"
					maxlength="15"
					display="text" />

				<div class="sgp-form-actions">
					<p:commandButton
						value="Alterar"
						action="#{alterarSenhaBean.alterar()}"
						update="@form"
						styleClass="sgp-btn-primary"/>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
