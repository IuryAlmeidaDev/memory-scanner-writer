<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="footer">
		<h:outputScript library="js" name="selectOneMenuFilter.js" />
	</ui:define>

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		<h3>Usuário</h3>
		
		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarUsuario" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarUsuario')}" />
		</h:form>
		
		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta"/>
				<sgp:formInputText labelValue="Nome" value="#{usuarioBean.filtro.nome}" />
				<sgp:formInputText labelValue="CPF" value="#{usuarioBean.filtro.cpf}" />
				<sgp:formInputText labelValue="Login" value="#{usuarioBean.filtro.login}" />				
				<sgp:formInputText labelValue="Email" value="#{usuarioBean.filtro.email}" permiteCaracterEspecial="true"/>
				<sgp:formSelectOneMenu
						id="status" labelValue="Status"
						value="#{usuarioBean.filtro.status}"
						itemsValue="#{comboHelperBean.status}"
						itemValue="#{item}"
						itemLabel="#{item.descricao}"
						temSelecione="true"/>

				<sgp:formSelectOneMenu
						labelValue="Unidade Prisional"
						value="#{usuarioBean.filtro.unidadePrisional}"
						itemsValue="#{usuarioBean.unidadesPrisionais}"
						itemValue="#{item}"
						filter="true"  filterMatchMode="custom" filterFunction="removeAcento"
						itemLabel="#{item.nome}"
						style="width: 280px;"
						temSelecione="true"
						converter="SimpleEntityConverter"
						display="text"
				/>


				<sgp:formSelectOneMenu
						id="perfil"
						labelValue="Perfil"
						itemValue="#{item}"
						itemLabel="#{item.nome}"
						itemsValue="#{usuarioBean.perfils}"
						value="#{usuarioBean.filtro.perfil}"
						converter="SimpleEntityConverter"
						temSelecione="true" filterFunction="removeAcento"
						filter="true" filterMatchMode="custom"
				/>

				<sgp:formSelectOneMenu
						id="perfil"
						labelValue="Perfil"
						itemValue="#{item}"
						itemLabel="#{item.nome}"
						itemsValue="#{usuarioBean.perfils}"
						value="#{usuarioBean.filtro.perfil}"
						converter="SimpleEntityConverter"
						temSelecione="true"
						filter="true" filterMatchMode="custom"
				/>
				

				<br />
				<br />
				<p:commandButton value="Pesquisar"
					update=":registrosForm"
					process="@form"
					icon="ui-icon-search" />

					<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{usuarioBean.imprimir()}"/>

			</p:panel>
		</h:form>

		<h:form id="registrosForm">
				<p:dataTable id="dataTable" var="u" value="#{usuarioBean.usuarios}" rows="10" paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{u.id}">
					<p:column headerText="Código" width="94" sortBy="#{u.id}">
						<h:outputText value="#{u.id}" />
					</p:column>

					<p:column headerText="Nome" sortBy="#{u.nome}">
						<h:outputText value="#{u.nome}"/>
					</p:column>					
		
					<p:column headerText="Login" sortBy="#{u.login}">
						<h:outputText value="#{u.login}" />
					</p:column>
					
					<p:column headerText="E-mail" sortBy="#{u.email}">
						<h:outputText value="#{u.email}"/>
					</p:column>
					
					<p:column headerText="Situação" width="109" sortBy="#{u.status}">
						<h:outputText value="#{u.status}"/>
					</p:column>
					
					<p:column headerText="Ações" width="111">
						<center>
							<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarUsuario" rendered="#{securityUtil.possuiPermissao('VisualizarUsuario')}">
								<f:param name="id" value="#{u.id}"/>
							</p:button>
							<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:AlterarUsuario" rendered="#{securityUtil.possuiPermissao('AlterarUsuario')}">
								<f:param name="id" value="#{u.id}"/>
							</p:button>
							<p:commandButton action="#{usuarioBean.excluir(u)}" icon="ui-icon-trash" title="Excluir" update="@form :registrosForm :mensagens" rendered="#{securityUtil.possuiPermissao('ExcluirUsuario')}">
								<p:confirm header="Confirmação" message="Deseja excluir o usuário?" icon="ui-icon-alert" />
							</p:commandButton>
						</center>
					</p:column>
					
					<f:facet name="footer">
						Total de registros: #{usuarioBean.usuarios.rowCount}
					</f:facet>
				</p:dataTable>

				<p:confirmDialog global="true">
					<p:commandButton value="Sim" type="button"
						styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button"
						styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
