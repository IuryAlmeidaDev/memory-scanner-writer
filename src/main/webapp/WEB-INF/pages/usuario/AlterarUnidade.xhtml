<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:sgp="http://java.sun.com/jsf/composite/sejudh/composite"
    template="/WEB-INF/pages/_templates/principal.xhtml">

    <ui:define name="conteudo">
        <div class="sgp-page-header">
            <h3>Alterar unidade</h3>
            <p class="lead">Troque a unidade ativa nesta sessão.</p>
        </div>

        <h:form id="form">
            <p:panel id="panel" styleClass="sgp-card-form">
                <sgp:formSelectOneMenu
                    id="unidade"
                    labelValue="Unidade"
                    value="#{alterarUnidadeBean.unidadeSelecionada}"
                    itemsValue="#{alterarUnidadeBean.unidades}"
                    itemValue="#{item}"
                    itemLabel="#{item.nome}"
                    temSelecione="true"
                    requiredMessage="Selecione uma unidade"
                    display="text"
                    validationRequired="true"
                    converter="SimpleEntityConverter"/>

                <div class="sgp-form-actions">
                    <p:commandButton
                        id="btnAlterar"
                        action="#{alterarUnidadeBean.alterarUnidade}"
                        value="Alterar unidade"
                        update="@form"
                        styleClass="sgp-btn-primary"/>
                </div>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
