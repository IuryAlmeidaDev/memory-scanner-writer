<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">

	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>Tipo Ocorrencia</h3>

		<h:form>
			<p:button value="Cadastrar" outcome="pretty:CadastrarOcorrencia" icon="ui-icon-plus" rendered="#{securityUtil.possuiPermissao('CadastrarOcorrencia')}"/>
		</h:form>		
			
		<h:form id="meuFormulario">
			<p:panel>
				<p:outputLabel value="Consulta"/>
				
				<sgp:formInputText 					
					id="tipo"
					value="#{tipoOcorrenciaBean.filtro.tipo}"					 
					labelValue="Tipo" 
					maxlength="50" 
					style="width:300px;" />
					
				<sgp:formInputText 					
					id="descricao"
					value="#{tipoOcorrenciaBean.filtro.descricao}"					 
					labelValue="Descrição" 
					maxlength="50" 
					style="width:300px;" />
					
				<sgp:formSelectOneMenu 					
					id="status" labelValue="Status"
					value="#{tipoOcorrenciaBean.filtro.status}"
					itemsValue="#{comboHelperBean.status}" 
					itemValue="#{item}"
					itemLabel="#{item.descricao}" 
					temSelecione="true"/>
					
				<br />
				<br />
				<p:commandButton value="Pesquisar" update=":registrosForm" process="@form" icon="ui-icon-search" />
				<p:commandButton value="Imprimir" icon="fa fa-file-pdf-o" actionListener="#{tipoOcorrenciaBean.imprimir()}"/>
			</p:panel>
		</h:form>	

		<h:form id="registrosForm">
				<p:dataTable 
					id="dataTable" var="tipoOcorrencia" 
					value="#{tipoOcorrenciaBean.tipoOcorrencias}" rows="10" 
					paginator="true" paginatorPosition="bottom" lazy="true" sortBy="#{tipoOcorrencia.id}"
				    emptyMessage="Nenhum registro encontrado.">
				             
					<p:column headerText="Código" width="100" sortBy="#{tipoOcorrencia.id}">
						<h:outputText value="#{tipoOcorrencia.id}" />
					</p:column>
	
					<p:column headerText="Tipo" sortBy="#{tipoOcorrencia.tipo}">
						<h:outputText value="#{tipoOcorrencia.tipo}" />
					</p:column>
					
					<p:column headerText="Descrição" sortBy="#{tipoOcorrencia.descricao}">
						<h:outputText value="#{tipoOcorrencia.descricao}" />
					</p:column>
					
					<p:column headerText="Status" width="120" sortBy="#{tipoOcorrencia.status}">
						<h:outputText value="#{tipoOcorrencia.status.descricao}" />						
					</p:column>
					
					
					<p:column headerText="Ações" width="120">
						<center>
						
							<p:button title="Visualizar" icon="ui-icon-document" outcome="pretty:VisualizarOcorrencia" rendered="#{securityUtil.possuiPermissao('VisualizarOcorrencia')}">
								<f:param name="id" value="#{tipoOcorrencia.id}" />
							</p:button>
							
							<p:button title="Alterar" icon="ui-icon-pencil" outcome="pretty:AlterarOcorrencia" rendered="#{securityUtil.possuiPermissao('AlterarOcorrencia')}">
								<f:param name="id" value="#{tipoOcorrencia.id}" />
							</p:button>
														
						</center>
					</p:column>
					
					<f:facet name="footer">
						Total de registros: #{tipoOcorrenciaBean.tipoOcorrencias.rowCount}
					</f:facet>
				</p:dataTable>

				<p:confirmDialog global="true">
					<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
