<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sgp="http://sejudh.mt.gov.br/components"
	template="/WEB-INF/pages/_templates/principal.xhtml">
	
	<ui:define name="conteudo">
		<sgp:validarAcesso />
		
		<h3>#{categoriaBean.tituloPagina} Tipo Ocorrencia</h3>
			<h:form>				
				<p:panel footer="Cadastrado por: #{tipoOcorrenciaBean.tipoOcorrencia.autorRegistro.usuario} em #{tipoOcorrenciaBean.tipoOcorrencia.autorRegistro.data} | Última alteração: #{tipoOcorrenciaBean.tipoOcorrencia.autorUltimaAlteracao.usuario} em #{tipoOcorrenciaBean.tipoOcorrencia.autorUltimaAlteracao.data}">
							
					
					<sgp:formSelectOneMenu
						id="tipo"
						labelValue="Tipo" 					
						value="#{tipoOcorrenciaBean.tipoOcorrencia.tipo}"
						disabled="#{tipoOcorrenciaBean.isVisualizacao}" 					
						style="width:200px"  
	                    styleInput="width:200px; margin-bottom:15px;">					
											
						<f:selectItem itemLabel="Selecione" itemValue="" noSelectionOption="true"/>					
						<f:selectItem itemLabel="Alimentação" itemValue="ALIMENTACAO" />
	                    <f:selectItem itemLabel="Movimentação" itemValue="MOVIMENTACAO" />
	                    <f:selectItem itemLabel="Recuperando" itemValue="RECUPERANDO" />
	                    <f:selectItem itemLabel="Servidor" itemValue="SERVIDOR" />
	                    <f:selectItem itemLabel="Visita" itemValue="VISITA" />
	                     				    					   
				    </sgp:formSelectOneMenu>
				    
				    
				    <sgp:formSelectOneMenu
						id="classificacao"
						labelValue="classificacao" 					
						value="#{tipoOcorrenciaBean.tipoOcorrencia.classificacao}"
						disabled="#{tipoOcorrenciaBean.isVisualizacao}" 					
						style="width:200px"  
	                    styleInput="width:200px; margin-bottom:15px;">					
											
						<f:selectItem itemLabel="Selecione" itemValue="" noSelectionOption="true"/>					
						<f:selectItem itemLabel="Ocorrência" itemValue="OCORRENCIA" />
	                    <f:selectItem itemLabel="Comunicado" itemValue="COMUNICADO" />	                    
	                     				    					   
				    </sgp:formSelectOneMenu>
				    	
					<sgp:formInputText 
						id="descricao" 
						labelValue="Descrição"
						value="#{tipoOcorrenciaBean.tipoOcorrencia.descricao}" 
						validationRequired="true"
						maxlength="50"
						disabled="#{tipoOcorrenciaBean.isVisualizacao}"
						display="text" 						
						style="width:200px"
						styleInput="width:200px; margin-bottom:15px;" />
						
						<sgp:formSelectOneMenu 
						id="status" labelValue="Status"
						value="#{tipoOcorrenciaBean.tipoOcorrencia.status}"
						itemsValue="#{comboHelperBean.status}" 
						itemValue="#{item}"
						itemLabel="#{item.descricao}" 
						disabled="#{tipoOcorrenciaBean.isVisualizacao}"
						display="text" />
					
					<br />
					<br />

					<p:commandButton value="Salvar" action="#{tipoOcorrenciaBean.salvar()}" update="@form" icon="ui-icon-disk" 
						rendered="#{(securityUtil.possuiPermissao('CadastrarTipoOcorrencia') and !tipoOcorrenciaBean.isVisualizacao) or (securityUtil.possuiPermissao('AlterarTipoOcorrencia') and !tipoOcorrenciaBean.isVisualizacao)}"/>
						
					<p:button outcome="pretty:ListarTipoOcorrencia" value="Voltar" icon="ui-icon-arrowreturnthick-1-w">
						<f:param name="list" value="1" />
					</p:button>
				</p:panel>
			</h:form>
	</ui:define>
</ui:composition>
