<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<h:outputStylesheet library="css" name="tokens.css" />
	<h:outputStylesheet library="css" name="main.css" />
	<h:outputStylesheet library="css" name="normalize.css" />
	<h:outputStylesheet library="css" name="bootstrap.min.css" />
	<h:outputStylesheet library="css" name="bootstrap-theme.min.css" />
    <h:outputStylesheet library="css" name="grid.css" />
	<h:outputStylesheet value="/resources/css/bootstrap.css.map" />
	<h:outputStylesheet value="/resources/css/bootstrap-theme.css.map" />
	<h:outputStylesheet library="css" name="forms.css" />
	<h:outputStylesheet library="css" name="alimentacao-grid.css" />

	<title>SIGEPEN - Sistema de Gestão Penitenciária do Estado de Mato Grosso [#{versionBean.versao}]</title>
	<link rel="icon" type="image/png" href="#{resource['images/favicon.png']}"/>
	
	<ui:insert name="head" />
	<style type="text/css">
		.ui-dialog {
			max-height: calc(100% - 100px) !important;
  			position: fixed !important;
    		top: 50% !important;
    		left: 50% !important;
  			transform: translate(-50%, -50%) !important;
  			overflow: auto !important;
		}
		.ui-confirm-dialog {
				overflow: hidden !important;
			}
		}
	</style>
</h:head>

<h:body>
	<h:form>
		<p:remoteCommand name="refresh" action="#{utilBean.refresh}" />
	</h:form>
	<div class="container">
		<div class="row topo">
			<div class="col-md-2 topo-brand">
				<a href="#{sigepen.getApplicationName()}">
					<p:graphicImage name="#{(sigepen.getIsProducao() ? 'sigepen.png' : 'sigepen-h.png')}" library="images" styleClass="topo-logo"/>
				</a>
			</div>
			<div class="col-md-10 topo-bar">
				<p:link outcome="pretty:SelecionarUnidade" styleClass="tb-unidade" title="Trocar unidade">
					<i class="fa fa-building"></i>
					<p:outputLabel value="#{securityUtil.getNomeUnidadeUsuario()}"/>
				</p:link>
				<span class="tb-sep"></span>
				<span class="tb-user">
					<i class="fa fa-user-circle"></i>
					#{securityUtil.getNomeUsuario()}
				</span>
				<p:commandButton action="#{loginBean.logout()}" value="Sair" icon="fa fa-sign-out" title="Sair" styleClass="tb-sair"/>
			</div>
		</div>
		<div class="row">
			<p:row rendered="#{securityUtil.isAutenticado()}">
			<div class="col-md-2 menu" >
				<ui:include src="menu.xhtml" />
			</div>
			</p:row>
			<div class="col-md-10 conteudo">
				<div class="row">
					<div class="col-md-12">
						<p:growl id="mensagens" sticky="true" globalOnly="true" />
					</div>
				</div>
				<ui:insert name="conteudo" />
				<h:panelGroup id="iframe-holder" layout="block" >
					<iframe id="iDownload" name="iDownload" width="1" height="1" frameborder="0" src="#{sigepen.getApplicationDownloadUrl()}"/>
				</h:panelGroup>
			</div>
			<p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" onerror="PF('statusDialog').hide()" oncomplete="PF('statusDialog').hide()"/>
 
			<p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
			    <p:graphicImage name="images/ajax-loader.gif" />
			</p:dialog>
			
			<p:confirmDialog widgetVar="dlgVersoes" closeOnEscape="false" closable="false" header="Atenção" message="A biometria foi atualizada, por favor inicie o aplicativo biométrico.">
				<p:commandButton value="Fechar" type="button" onclick="enviaComandoParaApp({ acao: 'fechar' }); PF('dlgVersoes').hide();" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</div>
	</div>
	
	<h:outputScript library="js" name="bootstrap.min.js" />
	<h:outputScript library="js" name="sigepen.js?ver=#{utilBean.sigepenJsVersao}" />
	<ui:insert name="footer" />
</h:body>
</html>
